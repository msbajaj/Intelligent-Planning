async function explainCommodity(k, c, list, el, modeEl, srcEl) {
  WHY_CTL = new AbortController(); const sig = WHY_CTL.signal;
  const r0 = list[0];
  const fb = !c.status
    ? `There is no market intelligence for ${c.name}, so the agent leaves the forecast recommendation blank rather than guess. The ${list.length} part${list.length > 1 ? 's' : ''} in this classification stay on the statistical forecast, and their supply policy is set separately in Plan For Every Part.`
    : `${c.name} is ${c.status.toLowerCase()}${c.prev !== c.status ? `, up from ${c.prev.toLowerCase()} last week` : ''}. Lead times are ${c.lt} weeks${c.lt !== c.ltPrev ? ` (were ${c.ltPrev})` : ''} and prices are ${c.price > 0 ? 'up' : c.price < 0 ? 'down' : 'flat'} ${c.price ? Math.abs(c.price) + '%' : ''}. ${c.note}\n\n${CONSTRAINED(c.status) ? `A forecast built only on history would place orders too late for these lead times. The recommendation is to pull demand forward for all ${list.length} parts, so the next MRP run releases orders ahead of the constraint.` : c.status === 'Surplus' ? `With supply loose and prices falling, buying ahead ties up cash. The recommendation is to push demand out so the next MRP run buys closer to need.` : `Nothing in the market argues for changing the plan, so the statistical forecast holds.`}\n\nThis is the planner's decision. Supply policies such as buffers, LTSAs or multi-sourcing for these parts are handled in Plan For Every Part.`;
  if (AI.live) {
    modeEl.textContent = 'Claude'; srcEl.textContent = 'Written live by Claude from the market facts on this page.';
    try {
      el.textContent = 'Thinking…';
      await aiCall(`You are the planning agent. Explain to a C-level executive, in 3 short paragraphs (90 words total, plain text, no headings or bullets), why the demand forecast recommendation for this commodity is "${r0.forecast || 'blank'}". Cover what the market is doing, why a history-based forecast would be wrong now, and that supply policies (buffer, LTSA, multi-source) are decided separately in Plan For Every Part. Do not quote unit quantities. Use only these facts:\n${JSON.stringify({ commodity: c.name, status: c.status, last_week: c.prev, lead_time_weeks: c.lt, lead_time_last_week: c.ltPrev, price_change_pct: c.price, note: c.note, parts: list.map(r => r.part.mpn), recommendation: r0.forecast, rule: forecastBasis(c) })}`, { signal: sig, onText: ({ text }) => { el.classList.remove('thinking'); el.textContent = text; } });
      return;
    } catch (e) { if (e && e.code === 'cancelled') return; srcEl.textContent = 'Claude was unavailable, so this explanation was assembled from the market data.'; }
  } else srcEl.textContent = 'Demo mode: explanation assembled from the market data. With Claude connected, this is written live.';
  modeEl.textContent = 'Scripted';
  typeInto(el, fb, sig);
}

function fallbackSpec(text, forcedName) {
  const t = text.toLowerCase();
  const triggers = [], conditions = [];
  const daily = /every (morning|day|night)|daily|nightly/.test(t), weekly = /week|monday/.test(t), monthly = /month/.test(t);
  if (daily || weekly || monthly) triggers.push({ type: 'time', label: daily ? (/night/.test(t) ? 'Every night, 22:00' : 'Every morning, 06:00') : weekly ? 'Every Monday, 07:00' : 'First of the month', detail: 'Runs on a schedule in your time zone' });
  const num = (t.match(/(\d[\d,]*)\s*(boards|units)/) || [])[1];
  if (/gap|not meet|shortage|short|exceed/.test(t)) { triggers.push({ type: 'gap', label: num ? `Projected gap > ${num} boards` : 'Projected supply < demand', detail: 'Evaluated weekly across the 16-week horizon' }); conditions.push({ type: 'gap', label: num ? `Gap above ${num} boards in any week` : 'Projected supply below demand', threshold: num ? +num.replace(/,/g, '') : null }); }
  if (/event|geopolit|disruption|port|tariff|earthquake|region/.test(t)) { triggers.push({ type: 'event', label: 'Geopolitical or supply-chain event', detail: 'Matches events to part origin regions and suppliers' }); conditions.push({ type: 'event', label: 'Part made in an affected region', threshold: null }); }
  if (/market|price|lead time|open-market|availability/.test(t)) { const pct = (t.match(/(\d+)\s*%/) || [])[1]; triggers.push({ type: 'market', label: pct ? `Price or availability moves > ${pct}%` : 'Market constraint or rising prices', detail: 'Open-market and commodity intelligence' }); conditions.push({ type: 'market', label: 'Commodity constrained or tightening', threshold: pct ? +pct : null }); }
  if (/resilien|deteriorat/.test(t)) conditions.push({ type: 'resilience_drop', label: 'Resilience Rating drops ≥ 5 points', threshold: 5 });
  if (/pcn|lifecycle|ltb|end of life|eol/.test(t)) { triggers.push({ type: 'event', label: 'New PCN or lifecycle change', detail: 'Manufacturer notifications' }); conditions.push({ type: 'lifecycle', label: 'Part moved to LTB', threshold: null }); }
  if (/cross|alternate/.test(t) && !/pcn/.test(t)) conditions.push({ type: 'cross', label: 'New pin-to-pin cross available', threshold: null });
  if (/refresh|re-score|all parts/.test(t)) { conditions.push({ type: 'market', label: 'Any recommendation change', threshold: null }); }
  if (!triggers.length) triggers.push({ type: 'time', label: 'Every morning, 06:00', detail: 'Default schedule' });
  if (!conditions.length) conditions.push({ type: 'gap', label: 'Projected supply below demand', threshold: null });
  const comm = Object.entries({ dram: /dram|ddr4|memory/, mcu: /mcu|microcontroller/, mlcc: /mlcc|capacitor/, gan: /gan|gallium/, pmic: /pmic|regulator/, phy: /phy|ethernet/ }).filter(([, re]) => re.test(t)).map(([k]) => k);
  const crit = /critical/.test(t), sole = /sole/.test(t);
  const n = S.world.parts.filter(p => (!crit || p.critical) && (!sole || p.sources === 1) && (!comm.length || comm.includes(p.commodity))).length;
  const scopeLabel = `${sole ? 'Sole-source' : crit ? 'Critical' : comm.length ? comm.map(c => COMMODITIES[c].name.split(' · ')[1] || c).join(' & ') : 'All'} parts (${n})`;
  const approvalAmt = (t.match(/\$\s?(\d+)\s?(k|m)?/) || []);
  const approval = /approv/.test(t) ? `Your approval required${approvalAmt[1] ? ` over $${approvalAmt[1]}${(approvalAmt[2] || '').toUpperCase()}` : ''}` : null;
  const routing = [
    { recommendation: 'Find or validate crosses', owner: 'Design Engineer', approval: null },
    { recommendation: 'Buffer · strategic buy · life-time buy', owner: 'Supply Chain Manager', approval: approval || 'Auto-approve under $25K' },
    { recommendation: 'LTSA · open-market sourcing', owner: 'Procurement / Buyer', approval: null },
    { recommendation: 'Market-adjusted forecast', owner: 'Demand Planner', approval: null },
  ];
  const trigWords = triggers.map(x => x.label.toLowerCase());
  const name = forcedName || (sole ? 'Sole-source exposure watch' : /market|price/.test(t) ? 'Market signal watch' : /gap|exceed/.test(t) && !daily ? 'Supply gap guardrail' : /event|geopolit/.test(t) ? 'Event impact watch' : crit ? 'Daily critical-parts watch' : 'Planning watch');
  return {
    name, schedule: triggers[0].type === 'time' ? triggers[0].label : 'On trigger',
    summary: `${cap(trigWords.join(', and on '))}, the agent checks ${scopeLabel.toLowerCase()} for ${conditions.map(c => c.label.toLowerCase()).join(' or ')}, recommends a mitigation for each and routes it to the owning team.`,
    triggers, scope: { label: scopeLabel, critical_only: crit, sole_source_only: sole, commodities: comm }, conditions,
    steps: {
      sense: 'Pull demand and supply plans, market intelligence, events, PCNs and Resilience Ratings',
      analyze: `Project weekly balance for ${scopeLabel.toLowerCase()} and test each condition`,
      recommend: 'Score Plan for Every Part policies and the market-adjusted forecast; explain each',
      assign: 'Create actions for the default owner of each recommendation',
      act: approval ? approval + '; others proceed automatically' : 'Owners review, approve and execute; agent tracks status',
      reassess: 'Re-run each part when its actions close; alert if the gap persists',
    },
    routing, notify: [/alert|notify|brief|tell me/.test(t) ? 'Brief me in the agent panel' : 'Summary in the agent panel', 'Email digest to owners'],
  };
}

async function runWorkflow(sp) {
  WF.run = { name: sp.name, stage: 0, findings: null };
  const rerender = () => { const card = $('#wf-card'); if (card && S.view === 'workflows') { card.innerHTML = specHtml(sp, WF.draft === sp ? 'Draft' : 'Active'); bindSpecCard(); } };
  for (let i = 0; i < 4; i++) { WF.run.stage = i; rerender(); await sleep(450); }
  const sc = sp.scope;
  const inScope = S.comp.results.filter(r => (!sc.critical_only || r.part.critical) && (!sc.sole_source_only || r.sources === 1) && (!sc.commodities || !sc.commodities.length || sc.commodities.includes(r.part.commodity)));
  const findings = [];
  for (const r of inScope) {
    const why = [];
    for (const c of sp.conditions) {
      if (c.type === 'gap' && r.shortUnits > 0 && (!c.threshold || r.shortUnits / r.part.qtyPer > c.threshold / 4)) why.push(`${fmt(r.shortUnits)} units short from ${WEEKS[r.firstShortWeek].label}`);
      if (c.type === 'resilience_drop' && r.rrDrop >= (c.threshold || 5)) why.push(`Resilience Rating ▼${r.rrDrop}`);
      if (c.type === 'event' && r.hits.length) why.push(r.hits[0].title);
      if (c.type === 'market' && (CONSTRAINED(r.mktStatus) || (/change/.test(c.label) && isChanged(r)))) why.push(/change/.test(c.label) ? 'recommendation changed' : `market ${r.mktStatus.toLowerCase()}`);
      if (c.type === 'lifecycle' && r.ltb) why.push(r.part.pcn.id + ' → LTB');
      if (c.type === 'cross' && r.part.crossNew) why.push('new pin-to-pin cross');
    }
    if (why.length && (r.primary !== 'MRP' || r.adjDir)) findings.push({ id: r.part.id, mpn: r.part.mpn, reason: [...new Set(why)].slice(0, 2).join(' · '), rec: [r.adjDir ? (r.adjDir === 'pull' ? 'Pull' : 'Push') : null, ...r.policies.map(shortPolicy)].filter(Boolean).join(' + '), r });
  }
  findings.sort((a, b) => priority(b.r) - priority(a.r));
  let created = 0, parts = 0;
  for (const f of findings) { const c = acceptRec(f.id, 'Workflow'); if (c.length) { created += c.length; parts++; } }
  WF.run.stage = 6; WF.run.findings = findings;
  WF.run.text = findings.length ? `Checked ${inScope.length} parts; ${findings.length} met the conditions. ${created ? `Created ${created} actions for ${parts} parts that had no owner yet.` : 'All of them already have owners, so no new actions were needed.'} I'll reassess each part as its actions close.` : `Checked ${inScope.length} parts. None met the conditions today.`;
  const w = S.workflows.find(x => x.spec === sp); if (w) w.last = `Just now · ${findings.length} matched, ${created} actions`;
  logActivity('ai', `Workflow <b>${esc(sp.name)}</b> ran: ${findings.length} parts matched, ${created} actions created.`);
  updateBadges(); S.dirty.plan = S.dirty.actions = S.dirty.horizon = true;
  rerender();
  agentSay(`**${sp.name}** ran. ${WF.run.text}`, created ? [{ label: 'Open actions', fn: () => setView('actions') }] : []);
}

    <div class="sc-tile"><div class="eyebrow">On-time delivery</div><div class="v ${m.otd < 95 ? 'red' : ''}">${m.otd}%</div><div class="s">${fmt(m.late)} boards late · 16 wks</div></div>
    <div class="sc-tile"><div class="eyebrow">Total demand</div><div class="v">${money(dem * PRODUCT.asp)}</div><div class="s">${fmt(dem)} boards · 16 wks</div></div>
    <div class="sc-tile"><div class="eyebrow">Total supply</div><div class="v">${money(sup * PRODUCT.asp)}</div><div class="s">${fmt(sup)} boards buildable</div></div>
    <div class="sc-tile"><div class="eyebrow">Total inventory</div><div class="v">${money(m.inv)}</div><div class="s">On hand across ${scoped.length} parts</div></div>`;
  const useAI = S.briefAI && S.briefAI.key === storyKey();
  $('#br-story').innerHTML = useAI ? aiStoryHtml(S.briefAI.text) : `<ol class="ins">${st.insights.map(([h2, p, tone]) => `<li class="${tone}"><b>${esc(h2)}</b><span>${esc(p)}</span></li>`).join('')}</ol>`;
  $('#br-src').textContent = useAI ? 'Written by Claude' : 'Built from live numbers';
  // simulation
  const active = (S.scenario.scp.demandPct || 0) > 0;
  $('#br-read').textContent = simReadout();
  $('#br-chart').innerHTML = briefChart();
  $('#lg-today').hidden = !active;
  const e = demandEconomics(); const ms = metrics(S.scenario.comp);
  const row = (label, cur, sim, sub) => `<tr class="grp-end"><td class="l"><b style="font-weight:600">${label}</b>${sub ? `<div class="muted" style="font-size:11px">${sub}</div>` : ''}</td><td class="v">${cur}</td><td class="v" style="color:var(--agent)">${sim}</td></tr>`;
  $('#br-cmp').innerHTML = `<div class="tablewrap" style="max-height:none"><table class="grid"><thead><tr><th class="l"></th><th>Current</th><th>Simulated</th></tr></thead><tbody>
    ${row('Demand', money(e.demandCur), money(e.demandSim), `${fmt(m.plan)} → ${fmt(ms.plan)} boards`)}
    ${row('Supply', money(e.supplyCur), money(e.supplySim), `On-time delivery ${m.otd}% → ${ms.otd}%`)}
    ${row('Inventory', money(e.invCur), money(e.invSim), 'Held at today\'s weeks of cover')}
    ${row('Working capital investment', '—', active ? money(e.wc) : '—', active ? `${money(Math.max(0, e.invSim - e.invCur))} inventory + ${money(e.purch)} added purchases` : '')}
  </tbody></table></div>`;
}

function briefChart() {
  const s = S.scenario; const W = 700, H = 240, L = 50, R = 12, T = 14, B = 26;
  const dem = s.comp.ctb.plan, sup = s.comp.ctb.built, today = S.comp.ctb.plan;
  const delta = sup.map((v, i) => v - dem[i]);
  const max = Math.max(...dem, ...today) * 1.1, minD = Math.min(0, ...delta);
  const top = T, mid = T + (H - T - B) * 0.72; // lines above, delta bars below
  const y = v => top + (1 - v / max) * (mid - top - 8);
  const dRange = Math.max(1, -minD, Math.max(...delta));
  const yd = v => mid + 12 + (H - B - mid - 16) / 2 - v / dRange * (H - B - mid - 16) / 2;
  const x = i => L + (i + 0.5) * (W - L - R) / NWEEKS, bw = (W - L - R) / NWEEKS * 0.55;
  const path = a => a.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const ticks = [0, max / 2, max].map(v => `<text class="ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${kfmt(v)}</text><line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join('');
  const z = yd(0);
  const bars = delta.map((d, i) => { const h = Math.max(1.5, Math.abs(yd(d) - z)); return `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(d < 0 ? z : z - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${d < 0 ? 'var(--rec)' : 'var(--good)'}" opacity=".85" rx="2"/>${d < 0 && Math.abs(d) > dRange * 0.25 ? `<text class="ax" x="${x(i)}" y="${(z + h + 10).toFixed(1)}" text-anchor="middle" style="fill:var(--rec)">−${kfmt(-d)}</text>` : ''}`; }).join('');
  const lbl = WEEKS.map((w, i) => i % 2 === 0 ? `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${w.iso}</text>` : '').join('');
  const active = (s.scp.demandPct || 0) > 0;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly demand, supply and delta">${ticks}
    ${active ? `<path d="${path(today)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>` : ''}
    <path d="${path(dem)}" fill="none" stroke="var(--demand)" stroke-width="2.2"/><path d="${path(sup)}" fill="none" stroke="var(--supply)" stroke-width="2.2"/>
    <text class="ax" x="${L - 6}" y="${z + 3}" text-anchor="end">Δ 0</text><line x1="${L}" x2="${W - R}" y1="${z}" y2="${z}" stroke="var(--line2)"/>${bars}${lbl}</svg>`;
}

// ── Live agent write-up of the insights (actual supply chain)
function storyKey() { return 'actual|' + S.comp.ctb.revenueAtRisk + '|' + pendingChanged().length; }
function aiStoryHtml(text) { return `<div class="st-ai">${mdToHtml(text)}</div>`; }
async function agentStory() {
  const btn = $('#br-ai'); const box = $('#br-story');
  if (!AI.live) { toast('Claude is not available in this view, so the insights stay built from the numbers.'); return; }
  const st = buildStory(); const key = storyKey();
  btn.disabled = true; $('#br-src').textContent = 'Claude is writing…';
  const facts = { headline: st.headline, on_time_delivery_pct: st.m.otd, boards_late: st.m.late, revenue_at_risk_usd: Math.round(st.m.rar), insights: st.insights.map(x => `${x[0]}: ${x[1]}`), converge_open_market: CONVERGE, top_drivers: topDrivers(S.comp).map(d => ({ part: d.r.part.mpn, cause: d.cause, revenue_at_risk_usd: Math.round(d.r.revenueAtRisk) })) };
  try {
    let first = true;
    const text = await aiCall(`You are the anchor of a daily supply-chain briefing for a CEO. Using only these facts about the actual supply chain, write 5 key insights as a numbered list. Each item starts with a bold 2–3 word lead-in, then one plain sentence with the key number. No jargon, no invented numbers.\n${JSON.stringify(facts)}`, { tier: 'quick', onText: ({ text }) => { if (first) { box.innerHTML = ''; first = false; } box.innerHTML = aiStoryHtml(text); } });
    S.briefAI = { text, key }; $('#br-src').textContent = 'Written by Claude';
  } catch (e) { $('#br-src').textContent = 'Built from live numbers'; if (e && e.code !== 'cancelled') toast('Claude could not write the insights right now.'); updateBriefing(); }
  btn.disabled = false;
}

// ───────────────────────── Boot ─────────────────────────
(function boot() {
  S.world = makeWorld();
  S.lastWeek = compute(prevWorld(S.world));
  S.comp = compute(S.world);
  S.ai = compute(withAllApplied(S.world, S.comp));
  S.startRisk = S.comp.ctb.revenueAtRisk;
  seedHistory(); seedWorkflows();
  initShell();
  updateBadges();
  setView('scenarios');
  initAI();
  briefing();
})();
</script>
