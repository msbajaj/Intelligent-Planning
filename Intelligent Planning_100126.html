<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Intelligent Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>:root {
  color-scheme: dark;
  --ink: #0A1018;
  --deep: #0F1721;
  --panel: #141F2C;
  --panel2: #192637;
  --line: #22324A;
  --line2: #2F4360;
  --text: #E7EDF4;
  --soft: #B9C6D6;
  --muted: #8494AB;
  --faint: #56677E;
  --demand: #7EB0FF;
  --supply: #4CCFB2;
  --rec: #FF5B4F;
  --rec-soft: rgba(255, 91, 79, .14);
  --warn: #F3B34C;
  --good: #5ED39A;
  --agent: #B7A7FF;
  --agent-soft: rgba(183, 167, 255, .12);
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cond: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --serif: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --r: 8px;
  --dock: 380px;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 10.5px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.red { color: var(--rec); }

/* ── App frame */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { display: flex; align-items: center; gap: 20px; padding: 0 16px; min-height: 58px; border-bottom: 1px solid var(--line); background: var(--deep); position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 0; }
.brand-mark { width: 32px; height: 32px; flex-shrink: 0; }
.brand-name { font: 600 15px/1.1 var(--cond); letter-spacing: .02em; }
.brand-ctx { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 18px 12px 16px; border-radius: 6px; text-align: left; white-space: nowrap; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; }
.tab .stage { display: block; font: 600 9.5px/1 var(--cond); letter-spacing: .14em; color: var(--faint); margin-bottom: 4px; }
.tab .tname { font-weight: 500; color: var(--soft); }
.tab:hover .tname { color: var(--text); }
.tab[aria-selected="true"] { border-bottom-color: var(--agent); }
.tab[aria-selected="true"] .tname { color: var(--text); }
.tab[aria-selected="true"] .stage { color: var(--agent); }
.tab .badge { display: inline-block; margin-left: 6px; min-width: 18px; padding: 1px 5px; border-radius: 9px; background: var(--rec); color: #fff; font: 600 10.5px/1.4 var(--mono); text-align: center; }
.agent-pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line2); border-radius: 20px; background: var(--panel); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
.dot.live { background: var(--agent); box-shadow: 0 0 0 3px var(--agent-soft); animation: pulse 2.4s infinite; }
.dot.demo { background: var(--warn); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(183,167,255,0); } }

main.body { display: grid; grid-template-columns: 1fr var(--dock); min-height: 0; }
body.dock-closed main.body { grid-template-columns: 1fr 0; }
.views { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.view { position: absolute; inset: 0; overflow: auto; }
.view.pad { padding: 20px 20px 40px; }

/* ── Common UI */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--agent); border-color: var(--agent); color: #150F2E; }
.btn.primary:hover { background: #C9BDFF; }
.btn.danger { background: var(--rec); border-color: var(--rec); color: #fff; }
.btn.ghost { background: none; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 5px; font-size: 11.5px; border: 1px solid var(--line2); color: var(--soft); background: var(--panel); white-space: nowrap; }
.chip.rec { color: var(--rec); border-color: rgba(255,91,79,.45); background: var(--rec-soft); font-weight: 500; }
.chip.good { color: var(--good); border-color: rgba(94,211,154,.35); }
.chip.warn { color: var(--warn); border-color: rgba(243,179,76,.4); }
.chip.bad { color: var(--rec); border-color: rgba(255,91,79,.4); }
.chip.agent { color: var(--agent); border-color: rgba(183,167,255,.4); background: var(--agent-soft); }
.chip.new::after { content: 'NEW'; font: 700 9px/1 var(--cond); letter-spacing: .1em; color: var(--ink); background: var(--warn); padding: 2px 4px; border-radius: 3px; margin-left: 2px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font: 600 11px/1.5 var(--sans); white-space: nowrap; }
.pill.High { background: rgba(255,91,79,.16); color: var(--rec); }
.pill.Medium { background: rgba(243,179,76,.16); color: var(--warn); }
.pill.Low { background: rgba(94,211,154,.12); color: var(--good); }
.mkt { font-size: 12px; white-space: nowrap; }
.mkt::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; background: var(--faint); }
.mkt.Constrained::before { background: var(--rec); } .mkt.Tightening::before { background: var(--warn); } .mkt.Stable::before { background: var(--good); } .mkt.Surplus::before { background: var(--demand); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.section-title { font: 600 18px/1.25 var(--cond); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 70ch; margin: 4px 0 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .eyebrow { line-height: 1.3; }
.kpi .v { font: 500 24px/1.1 var(--mono); margin-top: 8px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 12px; font-size: 12.5px; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--text); box-shadow: inset 0 -2px 0 var(--agent); }
.field { background: var(--deep); border: 1px solid var(--line2); border-radius: 7px; padding: 7px 10px; font-size: 13px; }
.field:focus { border-color: var(--agent); outline: none; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--soft); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--agent); width: 15px; height: 15px; }

/* ── Horizon (3D corridor) */
#v-horizon { display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(120% 70% at 50% 36%, #132034 0%, var(--ink) 62%); }
#hz-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#hz-canvas.drag { cursor: grabbing; }
#hz-cards { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.hz-card { position: absolute; left: 0; top: 0; width: 250px; display: block; pointer-events: auto; transform-origin: 50% 50%; border-radius: 9px; padding: 11px 13px 12px; background: rgba(16, 25, 38, .92); border: 1px solid var(--line2); box-shadow: 0 10px 30px rgba(0,0,0,.35); cursor: pointer; will-change: transform, opacity; text-align: left; color: var(--text); }
.hz-card:hover { border-color: var(--soft); }
.hz-card .k { display: flex; align-items: center; gap: 6px; font: 600 9.5px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hz-card .k i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--warn); }
.hz-card .t { font-weight: 600; font-size: 14px; line-height: 1.25; margin: 7px 0 4px; }
.hz-card .d { font-size: 12px; color: var(--soft); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hz-card.hzsig.bad .k i { background: var(--rec); }
.hz-card.hzsig.good .k i { background: var(--good); }
.hz-card.hzsig.neutral .k i { background: var(--demand); }
.hz-card.recm { border-color: rgba(255,91,79,.55); background: rgba(40, 16, 18, .9); }
.hz-card.recm .k { color: var(--rec); }
.hz-card.recm .k i { background: var(--rec); box-shadow: 0 0 10px var(--rec); }
.hz-card .pols { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
.hz-card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.hz-card .foot b { color: var(--rec); font: 500 12px var(--mono); }
.hz-card .newtag { margin-left: auto; font: 700 9px/1 var(--cond); letter-spacing: .1em; color: var(--ink); background: var(--warn); padding: 2px 5px; border-radius: 3px; }

.hz-top { position: relative; z-index: 3; flex-shrink: 0; padding: 14px 16px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px 24px; flex-wrap: wrap; background: var(--deep); border-bottom: 1px solid var(--line); }
.hz-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.hz-right { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; min-width: 0; }
.hz-lgd { border-collapse: collapse; font-size: 10.5px; color: var(--soft); }
.hz-lgd th { text-align: left; font: 600 9px/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 3px 12px 3px 0; white-space: nowrap; }
.hz-lgd td { padding: 2px 12px 2px 0; white-space: nowrap; }
.hz-lgd .lg { display: inline-flex; align-items: center; gap: 6px; }
.hz-lgd i { display: inline-block; flex-shrink: 0; }
.hz-lgd i.ln-dem, .hz-lgd i.ln-sup, .hz-lgd i.ln-gap, .hz-lgd i.ln-lane { width: 16px; height: 3px; border-radius: 2px; }
.hz-lgd i.ln-dem { background: var(--demand); } .hz-lgd i.ln-sup { background: var(--supply); } .hz-lgd i.ln-gap { background: var(--rec); height: 8px; opacity: .7; } .hz-lgd i.ln-lane { background: #F29BD0; opacity: .7; }
.hz-lgd i[class^="d-"] { width: 8px; height: 8px; border-radius: 50%; }
.hz-lgd i.d-dis { background: var(--rec); } .hz-lgd i.d-hol { background: var(--demand); } .hz-lgd i.d-dem { background: #F29BD0; } .hz-lgd i.d-life { background: var(--agent); } .hz-lgd i.d-tar { background: var(--warn); } .hz-lgd i.d-comp { background: #D5DCE6; } .hz-lgd i.d-price { background: var(--supply); }
.hz-title { max-width: 520px; min-width: 0; }
.hz-title h1 { margin: 0; font: 600 22px/1.1 var(--cond); letter-spacing: .01em; }
.hz-title p { margin: 4px 0 0; color: var(--soft); max-width: 62ch; font-size: 12.5px; }
.hz-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.hz-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--soft); margin-top: 10px; }
.hz-legend span { display: inline-flex; align-items: center; gap: 6px; }
.hz-legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.hz-kpis { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.hz-kpi { max-width: 290px; background: rgba(15,23,33,.82); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; min-width: 118px; backdrop-filter: blur(6px); }
.hz-kpi .v { font: 500 20px/1.1 var(--mono); margin-top: 6px; font-variant-numeric: tabular-nums; }
.hz-kpi .v s { color: var(--faint); font-size: 14px; margin-right: 6px; }
.hz-kpi .s { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.hz-bottom { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 28px; display: flex; align-items: center; gap: 10px; }
.hz-strip { flex: 1; display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; position: relative; min-width: 0; }
.hz-strip button { border: 0; padding: 0; height: 30px; border-radius: 3px; position: relative; background: var(--good); opacity: .75; }
.hz-strip button span { position: absolute; left: 0; right: 0; top: 34px; font: 500 10px/1 var(--mono); color: var(--muted); text-align: center; }
.hz-strip button.amber { background: var(--warn); }
.hz-strip button.red { background: var(--rec); }
.hz-strip button.cur { opacity: 1; outline: 2px solid var(--text); outline-offset: 1px; }
.hz-strip button:hover { opacity: 1; }
.hz-nav { display: flex; gap: 4px; }
.hz-nav button { width: 34px; height: 30px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel); }
.hz-hint { position: absolute; z-index: 2; left: 50%; bottom: 76px; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); background: rgba(10,16,24,.7); padding: 5px 12px; border-radius: 12px; pointer-events: none; white-space: nowrap; }
.hz-pop { position: absolute; z-index: 5; width: 320px; max-width: calc(100% - 32px); padding: 14px 16px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.hz-pop h3 { margin: 6px 0 6px; font-size: 15px; }
.hz-pop p { margin: 0 0 10px; color: var(--soft); font-size: 12.5px; }
.hz-pop ul { list-style: none; margin: 0 0 12px; padding: 0; max-height: 180px; overflow: auto; }
.hz-pop li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.hz-pop li button { background: none; border: 0; color: var(--text); padding: 0; text-align: left; }
.hz-pop li button:hover { color: var(--agent); }
.hz-pop .x { position: absolute; right: 8px; top: 8px; background: none; border: 0; color: var(--muted); font-size: 18px; width: 28px; height: 28px; }

/* ── Plan */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 12px; }
.toolbar .grow { flex: 1; }
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--deep); max-height: calc(100vh - 250px); }
table.grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 12.5px; }
table.grid th, table.grid td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; }
table.grid thead th { position: sticky; top: 0; background: var(--panel); z-index: 3; font: 600 10.5px/1.2 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; }
table.grid thead th .dt { display: block; font: 400 10.5px var(--mono); letter-spacing: 0; color: var(--faint); text-transform: none; margin-top: 3px; }
table.grid th.l, table.grid td.l { text-align: left; }
table.grid .stick { position: sticky; left: 0; background: var(--deep); z-index: 2; }
table.grid thead .stick { z-index: 4; background: var(--panel); }
table.grid tbody tr.grp td { border-bottom: 0; }
table.grid tbody tr.grp-end td { border-bottom: 1px solid var(--line2); }
table.grid tbody tr:hover td { background: #121c29; }
table.grid td.metric { color: var(--muted); text-align: left; font-size: 11.5px; }
table.grid td.v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--soft); }
table.grid td.v.neg { color: var(--rec); font-weight: 600; background: rgba(255,91,79,.08); }
table.grid td.v.adj { color: var(--rec); }
table.grid td.v.adj.up::before { content: '▲ '; font-size: 8px; vertical-align: 1px; }
table.grid td.v.adj.dn::before { content: '▼ '; font-size: 8px; vertical-align: 1px; }
table.grid td.v.ev { box-shadow: inset 0 -2px 0 var(--warn); }
.partcell { display: flex; flex-direction: column; gap: 2px; min-width: 170px; }
.partcell button { background: none; border: 0; padding: 0; font: 600 12.5px var(--mono); color: var(--text); text-align: left; }
.partcell button:hover { color: var(--agent); }
.partcell small { color: var(--muted); font-size: 11px; }
table.grid tr.cgrp td { background: var(--panel); }
table.grid tr.cgrp td.stick { background: var(--panel); }
.partcell .tog { font: 600 13px var(--sans); display: flex; align-items: center; gap: 4px; }
.partcell .tog .caret { display: inline-block; width: 14px; color: var(--muted); font-size: 11px; }
.recs { display: flex; flex-direction: column; gap: 2px; color: var(--rec); font-size: 12px; font-weight: 500; text-align: left; min-width: 190px; }
.recs span { white-space: normal; }
.recs .was { color: var(--faint); font-weight: 400; text-decoration: line-through; font-size: 11px; }
.recs .ok { color: var(--good); font-weight: 400; }
.chg { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
.rr { font-family: var(--mono); }
.rr small { font-size: 10.5px; margin-left: 4px; }
.rr small.dn { color: var(--rec); }
.status-accepted { color: var(--agent); font-size: 12px; }
.why-btn { background: none; border: 1px solid rgba(183,167,255,.4); color: var(--agent); border-radius: 5px; padding: 3px 9px; font-size: 11.5px; }
.why-btn:hover { background: var(--agent-soft); }

/* ── Why drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(4,8,14,.55); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--deep); border-left: 1px solid var(--line2); z-index: 41; display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0,0,0,.4); animation: slidein .28s ease-out; }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
.drawer header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); position: relative; }
.drawer header h2 { margin: 6px 0 2px; font: 600 20px/1.2 var(--mono); }
.drawer header .x { position: absolute; right: 12px; top: 12px; background: none; border: 1px solid var(--line2); color: var(--soft); border-radius: 6px; width: 32px; height: 32px; font-size: 16px; }
.drawer .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.drawer .scroll { flex: 1; overflow: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 22px; }
.drawer footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel); }
.recbox { border: 1px solid rgba(255,91,79,.45); background: linear-gradient(180deg, rgba(255,91,79,.1), rgba(255,91,79,.03)); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.recbox .lbl { font: 600 10px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.recbox .val { color: var(--rec); font-weight: 600; font-size: 16px; margin-top: 6px; line-height: 1.3; }
.recbox .sub { font-size: 12px; color: var(--soft); margin-top: 4px; }
.recbox .was { font-size: 11.5px; color: var(--faint); margin-top: 6px; }
.why-sec h4 { margin: 0 0 10px; font: 600 10.5px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.siglist { display: flex; flex-direction: column; gap: 8px; }
.sig { display: grid; grid-template-columns: 86px 1fr; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
.sig .kind { font: 600 10px/1.3 var(--cond); letter-spacing: .12em; text-transform: uppercase; }

.rules .bar { width: 70px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
.rules .bar i { display: block; height: 100%; background: var(--soft); }
.rules tr.pick .bar i { background: var(--rec); }
.rules .rs { color: var(--soft); }
.agent-text { font: 400 16px/1.55 var(--serif); color: var(--text); background: var(--agent-soft); border: 1px solid rgba(183,167,255,.25); border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; min-height: 80px; }

.routes { display: flex; flex-direction: column; gap: 8px; }

.chart svg { width: 100%; height: auto; display: block; }

/* ── Actions */

.lane-h .cnt { white-space: nowrap; margin-left: auto; font: 500 12px var(--mono); color: var(--muted); }
.act { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; display: flex; flex-direction: column; gap: 7px; }
.act.fresh { animation: fresh 1.6s ease-out; }

.act .t { font-weight: 600; font-size: 13px; }
.act .p { font: 500 12px var(--mono); color: var(--soft); }

.feed { display: flex; flex-direction: column; }
.feed .ev { display: grid; grid-template-columns: 56px 28px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; align-items: start; }

.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.routing-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.routing-table td { padding: 7px 6px; border-top: 1px solid var(--line); }

/* ── Workflows */
.wf-grid { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.composer { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.trig { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.trig .t { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--deep); }

.wf-list { display: flex; flex-direction: column; gap: 8px; }

.wf-item .right { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 8px; }
.findings { display: flex; flex-direction: column; gap: 6px; }
.finding { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 12px; background: var(--deep); border: 1px solid var(--line); border-radius: 7px; font-size: 12.5px; align-items: center; }
.finding .mono { font-weight: 600; }
.refine { display: flex; gap: 8px; }
.refine input { flex: 1; min-width: 0; }

/* ── Scenarios */
.sc-grid { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.sc-panel { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; }

.presets button:hover, .presets button[aria-pressed="true"] { border-color: var(--agent); color: var(--text); background: var(--agent-soft); }
.param { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-size: 12.5px; }

.delta-up { color: var(--rec); } .delta-dn { color: var(--good); }

/* ── Agent dock */
aside.dock { border-left: 1px solid var(--line); background: var(--deep); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }

.dock-h .x { margin-left: auto; background: none; border: 1px solid var(--line2); border-radius: 6px; width: 30px; height: 30px; color: var(--soft); }
.feedwrap { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.msg.agent .body { font: 400 15px/1.55 var(--serif); color: var(--text); }

.msg .who { font: 600 10px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--agent); margin-bottom: 7px; display: flex; gap: 8px; align-items: center; }
.msg .who time { color: var(--faint); letter-spacing: 0; font: 400 10.5px var(--mono); }
.msg.user { align-self: flex-end; max-width: 88%; background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px 12px 3px 12px; padding: 9px 12px; font-size: 13.5px; }
.msg .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

.tool b { color: var(--agent); font-weight: 500; }
.typing::after { content: '▍'; animation: blink 1s steps(2) infinite; color: var(--agent); margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.dock-in { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }

.dock-in form { display: flex; gap: 8px; align-items: flex-end; }
.dock-in textarea { flex: 1; min-width: 0; resize: none; height: 42px; max-height: 120px; background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; padding: 10px 12px; font-size: 13.5px; }
.dock-in textarea:focus { border-color: var(--agent); outline: none; }
.send { width: 42px; height: 42px; border-radius: 9px; border: 0; background: var(--agent); color: #150F2E; display: grid; place-items: center; flex-shrink: 0; }
.fab { display: none; }
body.dock-closed .hz-bottom { right: 130px; }
body.dock-closed .fab { display: flex; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 24px; background: var(--agent); color: #150F2E; border: 0; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--agent); color: var(--text); padding: 10px 16px; border-radius: 9px; z-index: 60; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100% - 32px); }

@media (max-width: 1100px) {
  :root { --dock: 340px; }
  .wf-grid, .sc-grid { grid-template-columns: 1fr; }

}

  aside.dock { position: fixed; left: 0; right: 0; bottom: 0; height: 72vh; z-index: 50; border-left: 0; border-top: 1px solid var(--line2); border-radius: 14px 14px 0 0; box-shadow: 0 -20px 60px rgba(0,0,0,.5); transition: transform .25s; padding-bottom: env(safe-area-inset-bottom, 0px); }
  body.dock-closed aside.dock { transform: translateY(105%); visibility: visible; }
  .fab { display: flex; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 24px; background: var(--agent); color: #150F2E; border: 0; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .view.pad { padding: 16px 16px 90px; }
  .twocol { grid-template-columns: 1fr; }
  .hz-kpis { display: none; }
  .hz-right { align-items: flex-start; } .hz-lgd-wrap, #hz-legend { overflow-x: auto; max-width: 100%; }

}

table.grid td.v.pos { color: var(--good); }
/* ── Scenarios: executive briefing */

.brief-tag { display: inline-flex; align-items: center; gap: 8px; background: var(--rec); color: #fff; font: 700 11px/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; padding: 6px 10px; border-radius: 3px; }

    const crossMfr = mfr === CROSS_MFRS[commodity] ? 'Kestrel Passives' : CROSS_MFRS[commodity];
    return {
      id: 'p' + idx, mpn, mfr, desc, commodity, region, qtyPer, price, sources, crossesP2P, crossNew, lifecycle, rr, rrPrev,
      onHand: Math.round(avg * onHandWeeks),
      demand,
      supplyPlan: demand.map(d => d), // supply plan committed to meet demand
      pcn: lifecycle === 'LTB' ? { id: 'PCN-' + (26000 + idx * 37), isNew: !!pcnNew, ltbDate: pcnNew ? 'Mar 31, 2027' : 'Dec 15, 2026' } : null,
      bestCross: crossesP2P > 0 ? { mpn: crossMpn(mpn, commodity), mfr: crossMfr, match: crossNew ? 'Pin-to-pin · form-fit-function' : 'Pin-to-pin' } : null,
      critical: qtyPer >= 10 || price >= 2 || sources === 1,
      // mitigations applied through actions (REASSESS)
      applied: {},

// ───────────────────────── Recommendation engine ─────────────────────────
// Deterministic rules (section 3 + 4 of the concept) produce repeatable,
// explainable recommendations. The AI layer synthesizes, prioritizes and explains.

const POLICY_SHORT = { 'Long Term Supply Agreement': 'LTSA', 'Life-time buy': 'LTB', 'Strategic buy': 'Strategic buy', 'Multi-source': 'Multi-source', 'Buffer': 'Buffer', 'MRP': 'MRP' };
const CONSTRAINED = s => s === 'Constrained' || s === 'Tightening';

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function makeWorld() {
  return { parts: makeParts(), commodities: clone(COMMODITIES), events: clone(EVENTS), build: BUILD_PLAN.slice(), demandPct: 0, label: 'Current plan' };
}

// Previous-week view of the world: used to detect recommendation changes
function prevWorld(w) {
  const p = clone(w);
  for (const k in p.commodities) { const c = p.commodities[k]; c.status = c.prev; c.lt = c.ltPrev; }
  p.events = p.events.filter(e => !e.isNew);
  for (const part of p.parts) {
    part.rr = part.rrPrev;
    if (part.crossNew) { part.crossesP2P -= 1; part.crossNew = false; if (!part.crossesP2P) part.bestCross = null; }
    if (part.pcn && part.pcn.isNew) { part.lifecycle = 'Active'; part.pcn = null; }
  }
  return p;
}

function eventImpact(world, part) {
  const imp = new Array(NWEEKS).fill(0); const hits = [];
  for (const e of world.events) {
    const match = (e.region && e.region === part.region) || (e.commodity && e.commodity === part.commodity);
    if (!match) continue;
    hits.push(e);
    for (let w = e.from; w < Math.min(NWEEKS, e.from + e.weeks); w++) imp[w] = Math.max(imp[w], e.impact);
  }
  return { imp, hits };
}

function adjustedDemand(part, mkt, dem) {
  const avg = dem.reduce((a, b) => a + b, 0) / NWEEKS;
  const out = dem.slice(); let dir = null, qty = 0;
  if (mkt && CONSTRAINED(mkt.status)) {
    dir = 'pull';
    const ltDelta = Math.max(2, (mkt.lt || 0) - (mkt.ltPrev || 0));
    qty = Math.round(avg * Math.min(4, ltDelta / 2) * 0.5);
    for (let w = 0; w < 4; w++) out[w] += Math.round(qty / 4);
    for (let w = 8; w < 16; w++) out[w] -= Math.round(qty / 8);
  } else if (mkt && mkt.status === 'Surplus') {
    dir = 'push';
    qty = Math.round(dem.slice(0, 4).reduce((a, b) => a + b, 0) * 0.25);
    for (let w = 0; w < 4; w++) out[w] -= Math.round(qty / 4);
    for (let w = 8; w < 12; w++) out[w] += Math.round(qty / 4);
  }
  return { out, dir, qty };
}

function evaluatePart(world, part) {
  const mkt = world.commodities[part.commodity];
  const a = part.applied || {};
  const dmult = 1 + (world.demandPct || 0) / 100;
  const baseDemand = part.demand.map(d => Math.round(d * dmult));
  const adj = adjustedDemand(part, mkt, baseDemand);
  const demand = a.forecast ? adj.out : baseDemand;
  const { imp, hits } = eventImpact(world, part);
  const sources = a.multi ? Math.max(2, part.sources) : part.sources;
  const sole = sources === 1;
  const mitig = a.multi ? 0.4 : 1;
  const boost = world.boost && world.boost.pct && (world.boost.commodity === 'all' || world.boost.commodity === part.commodity) ? world.boost.pct / 100 : 0;
  const smult = dmult > 1 && mkt && CONSTRAINED(mkt.status) ? 1 + (dmult - 1) * 0.5 : dmult;
  const supply = part.supplyPlan.map((s, w) => Math.round(s * smult * (1 - imp[w] * mitig) * (w >= 2 ? 1 + boost : 1)));
  let inv = part.onHand + Math.round((world.bufferWeeks || 0) * avgOf(baseDemand)) + (a.buffer ? Math.round(part.onHand * 0 + avgOf(baseDemand) * 3) : 0) + (a.strategic ? Math.round(avgOf(baseDemand) * 6) : 0) + (a.ltb ? Math.round(avgOf(baseDemand) * 20) : 0);
  const startInv = inv;
  const balance = [], short = [];
  for (let w = 0; w < NWEEKS; w++) {
    const avail = inv + supply[w]; const use = Math.min(avail, demand[w]);
    short.push(demand[w] - use); inv = avail - use; balance.push(inv - short[w]);
  }
  const shortUnits = short.reduce((a, b) => a + b, 0);
  const avg = avgOf(baseDemand);
  const minBal = Math.min(...balance);
  const invRisk = shortUnits > 0 ? 'High' : minBal < avg * 0.5 ? 'Medium' : 'Low';
  const mktStatus = mkt ? mkt.status : null;
  const mktConstraint = CONSTRAINED(mktStatus);
  const geo = hits.length > 0;
  const rrDrop = (part.rrPrev || part.rr) - part.rr;
  const ltb = part.lifecycle === 'LTB';
  const diversifiable = sources >= 2 || part.crossesP2P > 0;
  const annualSpend = avg * 52 * part.price;
  const ltDelta = mkt && mkt.lt != null ? mkt.lt - mkt.ltPrev : 0;

  // After mitigations are in place and no shortage remains, the part returns to MRP (REASSESS)
  const covered = (a.multi || a.buffer || a.strategic || a.ltsa || a.ltb) && invRisk === 'Low';
  // Candidate policies: eligibility per section 4, then a deterministic priority score
  const cands = [];
  const add = (policy, eligible, score, why) => { if (covered && policy !== 'MRP') { eligible = false; why = 'Mitigation already in place; no shortage projected'; } cands.push({ policy, eligible, score: eligible ? score : 0, why }); };
  add('Life-time buy', ltb && !a.ltb, 100, ltb ? `Lifecycle moved to LTB via ${part.pcn ? part.pcn.id : 'PCN'}; last-time-buy deadline ${part.pcn ? part.pcn.ltbDate : ''}` : 'Part is not under a last-time-buy PCN');
  let ms = 0;
  if (diversifiable && !a.multi) { ms = sole ? 40 + 20 : 20; if (part.crossNew) ms += 30; if (mktConstraint || geo) ms += 15; if (rrDrop >= 8) ms += 10; if (ltb) ms = 60; }
  add('Multi-source', diversifiable && !a.multi, ms, a.multi ? 'Alternate source already approved' : diversifiable ? (sole ? `Sole-sourced today, but ${part.crossesP2P} pin-to-pin cross${part.crossesP2P > 1 ? 'es' : ''} available${part.crossNew ? ' (new this week)' : ''}` : `${sources} approved sources; quota can be rebalanced`) : 'No approved alternates or pin-to-pin crosses');
  const bufElig = !a.buffer && !ltb && (sole || invRisk === 'High' || mktConstraint || geo) && !(a.ltsa && !sole && invRisk !== 'High');
  add('Buffer', bufElig, 30 + (sole ? 30 : 0) + (invRisk === 'High' ? 25 : 0) + (mktConstraint && !a.ltsa ? (sole ? 10 : 5) : 0) + (geo ? 15 : 0) - (a.multi ? 25 : 0), bufElig ? [sole && 'sole source', invRisk === 'High' && 'projected shortage', mktConstraint && 'constrained market', geo && 'event exposure'].filter(Boolean).join(', ') : 'No sole-source, inventory or market trigger');
  const sbElig = !a.strategic && !a.ltb && (invRisk === 'High' || (mktConstraint && !a.ltsa));
  add('Strategic buy', sbElig, 15 + (invRisk === 'High' ? 45 : invRisk === 'Medium' ? 15 : 0) + (mktConstraint ? 15 : 0) + (mkt && mkt.price >= 8 ? 10 : 0), sbElig ? `${invRisk === 'High' ? 'Projected shortage' : 'Rising market'}${mkt && mkt.price > 0 ? `; price +${mkt.price}% and rising` : ''}` : 'Inventory risk low and market not constrained');
  const ltsaElig = mktConstraint && !a.ltsa && !ltb;
  add('Long Term Supply Agreement', ltsaElig, 20 + 20 + (annualSpend > 150000 ? 15 : 0) + (ltDelta >= 6 ? 10 : 0), ltsaElig ? `Market ${mktStatus.toLowerCase()}, lead time +${ltDelta} wks; annual spend ${money(annualSpend)}` : 'Market not constrained');
  const normal = covered || (!mktConstraint && invRisk === 'Low' && !ltb && !geo && (!sole || a.multi || a.buffer));
  add('MRP', true, normal ? 50 : 1, covered ? 'Mitigations are in place and supply now covers demand; return to standard MRP and keep monitoring' : normal ? 'Market stable, supply meets demand, no lifecycle or event trigger' : 'Conditions are not normal');

  const ranked = cands.filter(c => c.eligible).sort((x, y) => y.score - x.score);
  const policies = [ranked[0]];
  if (ranked[1] && ranked[1].score >= 60 && ranked[0].policy !== 'MRP') policies.push(ranked[1]);
  const policyNames = policies.map(p => p.policy);

  // Market-adjusted forecast recommendation (section 3)
  let forecast = '';
  if (a.forecast) forecast = 'Hold';
  else if (!mkt || !mktStatus) forecast = '';
  else if (mktConstraint) forecast = 'Adjust forecast (pull)';
  else if (mktStatus === 'Surplus') forecast = 'Adjust forecast (push)';
  else forecast = 'Hold forecast';

  const signals = buildSignals(world, part, mkt, hits, rrDrop, invRisk, shortUnits, a);
  const boardsShort = shortUnits / part.qtyPer;

  return {
    part, mkt, demand: baseDemand, adjDemand: adj.out, adjDir: a.forecast ? null : adj.dir, adjQty: adj.qty,
    supply, balance, short, shortUnits, startInv, invRisk, sole, sources, geo, hits, rrDrop, ltb, mktStatus,
    forecast, policies: policyNames, primary: policyNames[0], cands, ranked, signals,
    revenueAtRisk: boardsShort * PRODUCT.asp, annualSpend,
    firstShortWeek: short.findIndex(s => s > 0),
  };
}
function avgOf(a) { return a.reduce((x, y) => x + y, 0) / a.length; }

function buildSignals(world, part, mkt, hits, rrDrop, invRisk, shortUnits, a) {
  const s = [];
  if (mkt && mkt.status) {
    const lt = mkt.lt != null && mkt.lt !== mkt.ltPrev ? `lead time ${mkt.ltPrev}→${mkt.lt} wks` : `lead time ${mkt.lt} wks`;
    s.push({ kind: 'Market', tone: CONSTRAINED(mkt.status) ? 'bad' : mkt.status === 'Surplus' ? 'good' : 'neutral', title: `${mkt.name.split(' · ')[1] || mkt.name} market ${mkt.status.toLowerCase()}`, detail: `${cap(lt)} · price ${mkt.price > 0 ? '+' : ''}${mkt.price}%. ${mkt.note}`, isNew: mkt.status !== mkt.prev, source: 'Market intelligence' });
  } else s.push({ kind: 'Market', tone: 'neutral', title: 'No market coverage', detail: 'No market intelligence for this commodity classification, so the forecast recommendation is left blank.', isNew: false, source: 'Market intelligence' });
  for (const e of hits) s.push({ kind: e.kind, tone: 'bad', title: e.title, detail: `${e.detail} Affects ${wkRange(e.from, e.from + e.weeks - 1)}, ~${Math.round(e.impact * 100)}% supply impact.`, isNew: e.isNew, source: e.source, eventId: e.id, week: e.from });
  if (part.pcn) s.push({ kind: 'Lifecycle', tone: 'bad', title: `${part.pcn.id}: last-time buy`, detail: `Manufacturer notice moves the part to LTB; final orders due ${part.pcn.ltbDate}.`, isNew: part.pcn.isNew, source: 'PCN notification' });
  if (part.crossNew && part.bestCross) s.push({ kind: 'Cross', tone: 'good', title: 'Pin-to-pin cross available', detail: `${part.bestCross.mpn} (${part.bestCross.mfr}) matched ${part.bestCross.match.toLowerCase()}; ${part.crossesP2P} alternates in total.`, isNew: true, source: 'Cross reference' });
  if (rrDrop >= 5) s.push({ kind: 'Resilience', tone: 'bad', title: `Resilience Rating ${part.rrPrev}→${part.rr}`, detail: `Rating fell ${rrDrop} points; drivers include ${part.sources === 1 ? 'single source, ' : ''}${hits.length ? 'regional event exposure, ' : ''}${mkt && CONSTRAINED(mkt.status) ? 'market constraint' : 'lifecycle risk'}.`, isNew: true, source: 'Resilience Rating' });
  if (shortUnits > 0) s.push({ kind: 'Supply', tone: 'bad', title: 'Projected shortage', detail: `${fmt(shortUnits)} units short over the horizon.`, isNew: false, source: 'Demand / supply plan' });
  return s;
}

function compute(world) {
  const results = world.parts.map(p => evaluatePart(world, p));
  const byId = Object.fromEntries(results.map(r => [r.part.id, r]));
  return { world, results, byId, ctb: clearToBuild(world, results) };
}

// Clear-to-build: boards buildable each week given every part's projected supply
function clearToBuild(world, results) {
  const dmult = 1 + (world.demandPct || 0) / 100;
  const plan = world.build.map(b => Math.round(b * dmult));
  const inv = results.map(r => r.startInv);
  const built = [], limiting = [];
  for (let w = 0; w < NWEEKS; w++) {
    let cap = plan[w]; let lim = [];
    results.forEach((r, i) => {
      const can = Math.floor((inv[i] + r.supply[w]) / r.part.qtyPer);
      if (can < plan[w]) lim.push({ id: r.part.id, can });
      if (can < cap) cap = can;
    });
    cap = Math.max(0, cap);
    results.forEach((r, i) => { inv[i] = inv[i] + r.supply[w] - cap * r.part.qtyPer; });
    built.push(cap); limiting.push(lim.sort((a, b) => a.can - b.can).slice(0, 4));
  }
  const shortBoards = plan.map((p, w) => p - built[w]);
  const rev = shortBoards.reduce((a, b) => a + b, 0) * PRODUCT.asp;
  return { plan, built, shortBoards, limiting, revenueAtRisk: rev };
}

// Apply every current recommendation (as if all actions were approved) → "AI plan"
function withAllApplied(world, comp) {

}

// Scenario: apply what-if parameters to a copy of the world
function scenarioWorld(base, prm) {
  const w = clone(base);
  w.label = prm.label || 'Scenario';
  w.demandPct = (base.demandPct || 0) + (prm.demandPct || 0);
  for (const s of prm.commodityShocks || []) {
    const c = w.commodities[s.commodity]; if (!c) continue;
    if (s.status) c.status = s.status;
    if (s.ltDelta) c.lt = (c.lt || 12) + s.ltDelta;
    if (s.pricePct) c.price = (c.price || 0) + s.pricePct;
    if (s.supplyImpact) w.events.push({ id: 'sx' + s.commodity, kind: 'Scenario', title: `${c.name} supply constrained`, detail: 'What-if assumption.', commodity: s.commodity, from: s.from || 0, weeks: s.weeks || 12, impact: s.supplyImpact, isNew: true, source: 'Scenario' });
  }
  for (const e of prm.regionEvents || []) w.events.push({ id: 'sr' + e.region, kind: 'Scenario', title: e.title || `${e.region} disruption`, detail: 'What-if assumption.', region: e.region, from: e.from || 0, weeks: e.weeks || 4, impact: e.impact || 0.5, isNew: true, source: 'Scenario' });
  for (const x of prm.eventOverrides || []) { const ev = w.events.find(e => e.id === x.id); if (ev) Object.assign(ev, x); }
  w.boost = prm.boost || null; w.bufferWeeks = prm.bufferWeeks || 0;
  if (prm.crossQualified) for (const p of w.parts) if (p.crossNew) { p.applied = p.applied || {}; p.applied.multi = true; }
  return w;
}

// Plain-language basis for the forecast recommendation (no quantities: that belongs to MRP)
function forecastBasis(mkt) {
  if (!mkt || !mkt.status) return 'No market intelligence for this commodity classification';
  const lt = mkt.lt !== mkt.ltPrev ? `lead time ${mkt.ltPrev}→${mkt.lt} wks` : `lead time ${mkt.lt} wks`;
  const pr = `price ${mkt.price > 0 ? '+' : ''}${mkt.price}%`;
  if (CONSTRAINED(mkt.status)) return `Market ${mkt.status.toLowerCase()} (${lt}, ${pr}): pull demand forward so orders are placed ahead of the constraint`;
  if (mkt.status === 'Surplus') return `Market in surplus (${lt}, ${pr}): push demand out and buy closer to need`;
  return `Market stable (${lt}, ${pr}): keep the statistical forecast`;
}

function acceptRec(partId, source = 'You') {

}

function advanceAction(id) {

  if (a.status === 'In review') logActivity(a.role, `<b>${esc(person)}</b> started review: ${esc(a.title)} · ${esc(a.mpn)}`);

}

function mdToHtml(md) {

  let out = '', inList = false, para = [];
  const flush = () => { if (para.length) { out += `<p>${para.join(' ')}</p>`; para = []; } };
  for (const ln of lines) {
    const m = ln.match(/^\s*(\d+)[.)]\s+(.*)/) || ln.match(/^\s*[-•]\s+(.*)/);
    if (m) { flush(); if (!inList) { out += '<ol>'; inList = true; } out += `<li>${m[2] ?? m[1]}</li>`; continue; }
    if (inList) { out += '</ol>'; inList = false; }
    if (!ln.trim()) flush(); else para.push(ln);
  }
  flush(); if (inList) out += '</ol>';
  return out;
}

    sel.innerHTML = `<option value="portfolio">All parts</option>` + src.comp.results.slice().sort((a, b) => a.part.mpn.localeCompare(b.part.mpn)).map(r => `<option value="${r.part.id}">${esc(r.part.mpn)}</option>`).join('');

  if ($('#hz-base')) $('#hz-base').onclick = () => { S.hz.source = 'base'; VIEWS.horizon(); };

function bindHorizon() {
  const c = HZ.canvas;
  $('#v-horizon').addEventListener('wheel', e => { if (e.target.closest('.hz-pop, .hz-top select')) return; e.preventDefault(); nudge((e.deltaY + e.deltaX) * 0.0032); }, { passive: false });
  c.addEventListener('pointerdown', e => { HZ.drag = { y: e.clientY, x: e.clientX, cam: HZ.camT }; c.setPointerCapture(e.pointerId); c.classList.add('drag'); });
  c.addEventListener('pointermove', e => { if (!HZ.drag) return; const d = (HZ.drag.y - e.clientY) * 0.014 + (HZ.drag.x - e.clientX) * 0.01; setCam(HZ.drag.cam + d); });
  const end = () => { HZ.drag = null; c.classList.remove('drag'); };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  $('#hz-prev').onclick = () => setCam(Math.round(HZ.camT + CAM_OFF) - 1 - CAM_OFF);
  $('#hz-next').onclick = () => setCam(Math.round(HZ.camT + CAM_OFF) + 1 - CAM_OFF);
  $('#hz-scope').onchange = e => { S.hz.scope = e.target.value; closePop(); buildSeries(); buildCards(); renderHzChrome(); setCam(-CAM_OFF); };
  $('#hz-cal').onclick = openStrategicCalendar;
  $('#hz-lgbtn').onclick = () => { const v = $('#v-horizon'); const on = !v.classList.contains('lg-open'); v.classList.toggle('lg-open', on); $('#hz-lgbtn').setAttribute('aria-expanded', String(on)); };
  $$('[data-hg]').forEach(b => b.onclick = () => { if (S.hz.group === b.dataset.hg) return; S.hz.group = b.dataset.hg; S.hz.scope = 'portfolio'; closePop(); VIEWS.horizon(); });
  document.addEventListener('keydown', e => {
    if (S.view !== 'horizon' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); $('#hz-next').click(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); $('#hz-prev').click(); }
  });
}
function nudge(d) { setCam(HZ.camT + d); }
function setCam(v) { HZ.camT = Math.max(-2.2, Math.min(NWEEKS - 3.5, v)); HZ.lastInteract = performance.now(); const hint = $('#hz-hint'); if (hint) hint.hidden = true; HZ_wake(); }

function HZ_resize() {
  if (!HZ.canvas) return;
  // compact layout when the Roadmap has little room (small laptop, agent panel open)
  const v = $('#v-horizon'); const vr = v.getBoundingClientRect();

// ── Weekly demand / supply for the selected scope
function buildSeries() {
  const src = hzSource();
  if (S.hz.scope === 'portfolio') {
    const c = src.comp.ctb;
    HZ.series = { unit: 'boards', demand: c.plan, supply: c.built, short: c.shortBoards, max: Math.max(...c.plan) * 1.05 };
  } else {
    const list = hzScopeResults(src.comp);
    if (!list.length) { S.hz.scope = 'portfolio'; return buildSeries(); }
    const sum = key => WEEKS.map((_, w) => list.reduce((s, r) => s + r[key][w], 0));
    const demand = sum('demand'), supply = sum('supply'), short = sum('short');
    HZ.series = { unit: 'units', demand, supply, short, max: Math.max(...demand, ...supply) * 1.08 };

}

// ── Time-phased items: disruptions and holidays on the left wall; lifecycle, tariffs and price changes on the right
function roadmapItems(comp) {
  const items = comp.world.events.map(e => ({ id: e.id, kind: e.kind === 'Scenario' ? 'What-if' : 'Disruption', title: e.title, date: e.weeks > 1 ? `${WEEKS[e.from].date} · ${e.weeks} wks` : WEEKS[e.from].date, week: e.from, regions: e.region ? [e.region] : null, commodities: e.commodity ? [e.commodity] : null, detail: `${e.detail} About ${Math.round(e.impact * 100)}% supply impact.`, isNew: e.isNew }));
  const strat = STRATEGIC.filter(x => x.view === 'in' && !x.lane).map(x => ({ id: x.id, kind: x.kind, title: x.title, date: x.note || x.timing, week: x.week, weeks: x.weeks, global: x.global, regions: x.regions, commodities: x.commodities, detail: `${x.risk}. Action: ${x.action}.`, risk: x.risk, action: x.action, geo: x.geo, url: x.url, source: 'Strategic calendar' }));
  return items.concat(CALENDAR.map(c => ({ ...c })), strat);
}
function itemParts(it, results) {
  if (it.global) return results;
  return results.filter(r => (it.regions && it.regions.includes(r.part.region)) || (it.commodities && it.commodities.includes(r.part.commodity) && (!it.mfr || r.part.mfr === it.mfr)) || (it.parts && it.parts.includes(r.part.mpn)));
}
function buildCards() {
  const src = hzSource(); const scoped = hzScopeResults(src.comp); const cards = [];
  for (const it of roadmapItems(src.comp)) {
    const parts = itemParts(it, scoped);
    if (!parts.length) continue;
    const left = LEFT_KINDS.includes(it.kind);
    cards.push({ side: left ? -1 : 1, week: it.week, cls: KIND_CLS[it.kind] || '', kind: it.kind, isNew: !!it.isNew, title: it.title, detail: it.detail, foot: it.geo ? it.geo : it.global ? 'All parts' : `${parts.length} part${parts.length > 1 ? 's' : ''} affected`, date: it.date, item: it, parts });
  }
  const used = {};
  cards.sort((a, b) => a.week - b.week || (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
  for (const c of cards) {
    let w = c.week; while ((used[c.side + ':' + w] || 0) >= 3 && w < NWEEKS - 1) w++;
    c.slot = used[c.side + ':' + w] || 0; used[c.side + ':' + w] = c.slot + 1; c.week = w;
  }
  const lanes = STRATEGIC.filter(x => x.view === 'in' && x.lane && itemParts(x, scoped).length);
  const li = { l: 0, r: 0 };
  HZ.lanes = lanes.map(x => { const left = LEFT_KINDS.includes(x.kind); const k = left ? li.l++ : li.r++; return { ...x, side: left ? -1 : 1, idx: k }; });
  HZ.cardLayer.innerHTML = '';
  HZ.cards = cards.map(c => {
    const el = h(`<div class="hz-card ${c.cls}" role="button" tabindex="0">
      <div class="k"><i></i>${esc(c.kind)}${c.isNew ? '<span class="newtag">NEW</span>' : ''}</div>
      <div class="t">${esc(c.title)}</div>
      <div class="d">${esc(c.detail)}</div>
      <div class="foot"><span>${esc(c.foot)}</span><span>${esc(c.date)}</span></div></div>`);
    el.onclick = (e) => { e.stopPropagation(); cardClick(c, el); };
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cardClick(c, el); } };
    HZ.cardLayer.append(el);
    return { ...c, el, z: (c.week + 0.3 + c.slot * 0.34) * ZD, y: 2.3 + c.slot * 1.45 };
  });
  HZ_wake();
}

function cardClick(c, el) {
  closePop();

function renderHzChrome() {

    <tr><th>Left wall</th><td>${sw('d-dis', 'Disruption')}</td><td>${sw('d-hol', 'Holiday')}</td><td>${sw('d-dem', 'Demand cycle')}</td><td></td></tr>
    <tr><th>Right wall</th><td>${sw('d-life', 'LTB / EOL / PCN')}</td><td>${sw('d-tar', 'Trade &amp; tariff')}</td><td>${sw('d-comp', 'Compliance')}</td><td>${sw('d-price', 'Price change')}</td></tr>

// ── Render loop
function hzFrame() {
  HZ.raf = 0;
  if (S.view !== 'horizon' || !HZ.w) return;
  const d = HZ.camT - HZ.cam;
  HZ.cam += d * 0.09;
  if (Math.abs(d) < 0.0008) HZ.cam = HZ.camT;
  drawHorizon();
  if (HZ.cam !== HZ.camT) HZ.raf = requestAnimationFrame(hzFrame);
}

function drawHorizon() {
  const { ctx, w, h, dpr } = HZ; const s = HZ.series; if (!s) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const F = Math.min(h * 0.9, w * 0.7), cx = w / 2, hy = h * 0.36, camZ = HZ.cam * ZD - 6;
  const NEAR = 4;
  const P = (x, y, z) => { const dz = z - camZ; return [cx + x * F / dz, hy + (CAMH - y) * F / dz, dz]; };
  const fog = dz => Math.max(0, Math.min(1, 1.2 - dz / 150));
  // horizon glow
  const hg = ctx.createLinearGradient(0, hy - 60, 0, hy + 40); hg.addColorStop(0, 'rgba(183,167,255,0)'); hg.addColorStop(0.6, 'rgba(183,167,255,.07)'); hg.addColorStop(1, 'rgba(183,167,255,0)'); ctx.fillStyle = hg; ctx.fillRect(0, hy - 60, w, 100);
  const zMax = NWEEKS * ZD;
  // floor grid
  ctx.lineWidth = 1;
  for (let x = -14; x <= 14; x += 1.4) {
    const a = P(x, 0, camZ + NEAR), b = P(x, 0, zMax + 30);
    const g = ctx.createLinearGradient(a[0], a[1], b[0], b[1]); g.addColorStop(0, 'rgba(60,86,120,.28)'); g.addColorStop(1, 'rgba(60,86,120,0)');
    ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  // band segments per week
  const hw = v => (v / s.max) * BAND;
  const quad = (x0, x1, z0, z1, fill) => { const a = P(x0, 0, z0), b = P(x1, 0, z0), c2 = P(x1, 0, z1), d2 = P(x0, 0, z1); ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c2[0], c2[1]); ctx.lineTo(d2[0], d2[1]); ctx.closePath(); ctx.fill(); };
  const line = (x, z0, z1, style, width, dash) => { const a = P(x, 0, z0), b = P(x, 0, z1); ctx.strokeStyle = style; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.setLineDash([]); };
  for (let i = NWEEKS - 1; i >= 0; i--) {
    let z0 = i * ZD, z1 = (i + 1) * ZD;
    if (z1 <= camZ + NEAR) continue; z0 = Math.max(z0, camZ + NEAR);
    const f = fog(z0 - camZ);
    const hd = hw(s.demand[i]), hs = hw(Math.max(0, s.demand[i] - s.short[i] > s.supply[i] ? s.demand[i] - s.short[i] : s.supply[i]));
    const hsBand = hw(s.demand[i] - s.short[i]);
    quad(-hsBand, hsBand, z0, z1, `rgba(76,207,178,${0.2 * f})`);
    if (hd > hsBand + 0.01) { quad(hsBand, hd, z0, z1, `rgba(255,91,79,${0.5 * f})`); quad(-hd, -hsBand, z0, z1, `rgba(255,91,79,${0.5 * f})`); }
    line(hsBand, z0, z1, `rgba(76,207,178,${0.95 * f})`, 2); line(-hsBand, z0, z1, `rgba(76,207,178,${0.95 * f})`, 2);
    line(hd, z0, z1, `rgba(126,176,255,${0.95 * f})`, 1.6); line(-hd, z0, z1, `rgba(126,176,255,${0.95 * f})`, 1.6);
    void hs;
  }
  // seasonal lanes (multi-week calendar windows) along the road edges
  ctx.textAlign = 'center';
  for (const ln of HZ.lanes || []) {
    const x = ln.side * (BAND + 0.75 + ln.idx * 0.55), rgb = KIND_RGB[ln.kind] || '183,167,255';
    let z0 = ln.week * ZD, z1 = (ln.week + ln.weeks) * ZD;
    if (z1 <= camZ + NEAR) continue; z0 = Math.max(z0, camZ + NEAR);
    const f = fog(z0 - camZ);
    quad(x - 0.09, x + 0.09, z0, Math.min(z1, zMax + 20), `rgba(${rgb},${0.4 * f})`);
    // label: at the lane start, or just ahead of the camera once the start has passed
    const lz = Math.max(ln.week * ZD, camZ + 16);
    if (lz < z1 - 4) {
      const g = P(x + ln.side * 0.3, 0.2 + ln.idx * 0.6, lz), ts = Math.min(12.5, 170 / g[2]);
      if (ts >= 7) { ctx.textAlign = ln.side < 0 ? 'right' : 'left'; ctx.fillStyle = `rgba(${rgb},${0.95 * fog(g[2])})`; ctx.font = `600 ${ts}px 'IBM Plex Sans Condensed', sans-serif`; ctx.fillText(`${ln.title} · ${ln.timing}`, g[0], g[1]); ctx.textAlign = 'center'; }
    }
  }
  // gates + labels
  ctx.textAlign = 'center';
  for (let i = NWEEKS; i >= 0; i--) {
    const z = i * ZD; if (z <= camZ + NEAR) continue;
    const dz = z - camZ, f = fog(dz) * Math.max(0, Math.min(1, (dz - 7) / 9)); if (f <= 0.02) continue;
    const short = i < NWEEKS && s.short[i] > 0;
    const isNow = i === 0;
    const col = isNow ? `rgba(183,167,255,${0.9 * f})` : short ? `rgba(255,91,79,${0.55 * f})` : `rgba(90,120,160,${0.45 * f})`;
    const bl = P(-GATE_X, 0, z), tl = P(-GATE_X, GATE_H, z), tr = P(GATE_X, GATE_H, z), br = P(GATE_X, 0, z);
    ctx.strokeStyle = col; ctx.lineWidth = isNow ? 2 : 1.2;
    ctx.beginPath(); ctx.moveTo(bl[0], bl[1]); ctx.lineTo(tl[0], tl[1]); ctx.lineTo(tr[0], tr[1]); ctx.lineTo(br[0], br[1]); ctx.stroke();
    // floor tick
    const l0 = P(-GATE_X, 0, z), l1 = P(GATE_X, 0, z); ctx.strokeStyle = `rgba(90,120,160,${0.25 * f})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(l0[0], l0[1]); ctx.lineTo(l1[0], l1[1]); ctx.stroke();
    if (i === NWEEKS) continue;
    const sz = Math.max(0, Math.min(24, 190 / dz));
    if (sz < 6.5) continue;
    const top = P(0, GATE_H + 0.35, z);
    ctx.fillStyle = isNow ? `rgba(183,167,255,${f})` : `rgba(231,237,244,${0.9 * f})`;
    ctx.font = `600 ${sz}px 'IBM Plex Sans Condensed', sans-serif`;
    ctx.fillText((isNow ? 'NOW · ' : '') + WEEKS[i].label.toUpperCase(), top[0], top[1]);
    ctx.fillStyle = `rgba(132,148,171,${f})`; ctx.font = `400 ${sz * 0.72}px 'IBM Plex Mono', monospace`;
    ctx.fillText(WEEKS[i].date, top[0], top[1] + sz * 0.95);
    // weekly demand / supply summary on the road
    const g = P(0, 0, z + ZD * 0.3), gdz = g[2];
    const ts = Math.min(20, 240 / gdz);
    const fa = fog(gdz) * Math.max(0, Math.min(1, (gdz - 9) / 5));
    if (ts >= 7.5 && fa > 0.05) {
      const dmd = s.demand[i], sup = s.demand[i] - s.short[i], dl = sup - dmd;
      const nf = v => s.unit === 'boards' ? fmt(v) : kfmt(v);
      const rows = [['DEMAND', nf(dmd), '231,237,244'], ['SUPPLY', nf(sup), '231,237,244'], ['DELTA', (dl > 0 ? '+' : dl < 0 ? '−' : '') + nf(Math.abs(dl)), dl < 0 ? '255,120,110' : '94,211,154']];
      const lh = ts * 1.22; let y = g[1] - lh * rows.length - ts * 0.2;
      ctx.save();
      for (const [lab, val, rgb] of rows) {
        y += lh;
        ctx.textAlign = 'right'; ctx.fillStyle = `rgba(185,198,214,${0.9 * fa})`; ctx.font = `600 ${ts * 0.62}px 'IBM Plex Sans Condensed', sans-serif`;
        ctx.fillText(lab, g[0] - ts * 0.35, y);
        ctx.textAlign = 'left'; ctx.fillStyle = `rgba(${rgb},${fa})`; ctx.font = `600 ${ts}px 'IBM Plex Mono', monospace`;
        ctx.fillText(val, g[0] + ts * 0.1, y);
      }
      ctx.restore();
    }
  }
  // cards
  for (const c of HZ.cards) {
    const [sx, sy, dz] = P(c.side * WALL, c.y, c.z);
    const sc = 15 / dz;
    let op = 1;
    if (dz < 13) op = Math.max(0, (dz - 8) / 5);
    if (dz > 34) op = Math.min(op, Math.max(0, (52 - dz) / 18));
    if (op <= 0.01 || dz <= 0) { c.el.style.opacity = 0; c.el.style.visibility = 'hidden'; continue; }
    c.el.style.visibility = 'visible';
    const cw = c.el.offsetWidth, ch = c.el.offsetHeight;
    c.el.style.opacity = op.toFixed(3);
    c.el.style.transform = `translate(${(sx - cw / 2).toFixed(1)}px, ${(sy - ch / 2).toFixed(1)}px) scale(${Math.min(HZ.compact ? 0.82 : 1.0, sc * (HZ.compact ? 0.85 : 1)).toFixed(3)})`;
    c.el.style.zIndex = String(1000 - Math.round(dz));
    c.el.tabIndex = op > 0.5 ? 0 : -1; c.el.style.pointerEvents = op > 0.3 ? 'auto' : 'none';
  }
  // strip "current" marker
  const cur = Math.max(0, Math.min(NWEEKS - 1, Math.round(HZ.cam + CAM_OFF)));
  $$('#hz-strip button').forEach((b, i) => b.classList.toggle('cur', i === cur));
}

// ───────────────────────── Plan: Intelligent Plan (forecast) + Plan For Every Part (supply policy) ─────────────────────────
// Intelligent Plan = planner view: market-adjusted forecast recommendation only.
// Plan For Every Part = procurement view: supply / replenishment policy only.
const kfmt = n => { const a = Math.abs(n); return a >= 10000 ? (n / 1000).toFixed(0) + 'K' : a >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(Math.round(n)); };
const fcChanged = r => lastRec(r.part.id).forecast !== r.forecast;
const polChanged = r => lastRec(r.part.id).policies.join('|') !== r.policies.join('|');
const modeChanged = r => (S.plan.mode === 'grid' ? fcChanged(r) : polChanged(r));
const fcPriority = r => ({ 'Adjust forecast (pull)': 3, 'Adjust forecast (push)': 2, 'Hold forecast': 1 }[r.forecast] || 0);

function planRows() {
  const f = S.plan;
  return S.comp.results.filter(r => (!f.ids || f.ids.includes(r.part.id)) && (!f.changedOnly || modeChanged(r)))
    .sort((a, b) => f.mode === 'grid' ? (fcChanged(b) - fcChanged(a)) || (fcPriority(b) - fcPriority(a)) || (priority(b) - priority(a)) : priority(b) - priority(a));
}
function planGroups(rows) {
  const g = {};
  for (const r of rows) (g[r.part.commodity] = g[r.part.commodity] || []).push(r);
  const order = k => { const c = COMMODITIES[k]; return (c.status !== c.prev ? 100 : 0) + ({ Constrained: 4, Tightening: 3, Surplus: 2, Stable: 1 }[c.status] || 0); };
  return Object.entries(g).sort((a, b) => order(b[0]) - order(a[0]) || b[1].length - a[1].length);
}
function forecastHtml(fc, was) {
  const main = fc ? (fc.startsWith('Adjust') ? `<span>${esc(fc)}</span>` : `<span class="ok">${esc(fc)}</span>`) : '<span class="ok" title="No market intelligence for this commodity">— no market data</span>';
  return `<div class="recs">${main}${was !== undefined && was !== fc ? `<span class="was">${esc(was || 'No recommendation')}</span>` : ''}</div>`;
}
function policyHtml(r) {
  const p = lastRec(r.part.id);
  const now = r.primary === 'MRP' ? `<span class="ok">MRP</span>` : r.policies.map(x => `<span title="${esc(x)}">${esc(shortPolicy(x))}</span>`).join('');
  return `<div class="recs">${now}${polChanged(r) ? `<span class="was">${esc(p.policies.map(shortPolicy).join(' + '))}</span>` : ''}</div>`;
}
function statusHtml(r) {
  const id = r.part.id;
  if (S.accepted[id]) { const open = S.actions.filter(a => a.partId === id && a.status !== 'Done').length; return `<span class="status-accepted">Assigned · ${open} open</span>`; }
  if (S.resolved[id]) return `<span class="chip good">Resolved</span>`;
  if (S.dismissed[id]) return `<span class="muted">Dismissed</span>`;
  if (isChanged(r) && needsDecision(r)) return `<span class="chip warn">Awaiting decision</span>`;
  return '<span class="muted">—</span>';
}
function mktLine(c) { return c.status ? `<span class="mkt ${c.status}">${esc(c.status)}</span>${c.lt != null ? ` <small class="muted">· LT ${c.ltPrev === c.lt ? c.lt : c.ltPrev + '→' + c.lt} wks · price ${c.price > 0 ? '+' : ''}${c.price}%</small>` : ''}` : '<span class="mkt">No coverage</span>'; }

// ── Intelligent Plan: forecast recommendation + Demand / Supply / Projected balance
function weekHead() { return WEEKS.map(w => `<th>${w.label}<span class="dt">${w.date}</span></th>`).join(''); }
function metricRows(lines, lead) {
  const n = lines.length;
  return lines.map((ln, i) => `<tr class="${ln.cls || ''} ${i === n - 1 ? 'grp-end' : 'grp'}">${i === 0 ? lead(n) : ''}<td class="metric">${ln.name}</td>${ln.vals.map(v => `<td class="v ${ln.neg && v < 0 ? 'neg' : ln.neg && v > 0 ? 'pos' : ''}">${kfmt(v)}</td>`).join('')}</tr>`).join('');
}
function partLines(r) { return [{ name: 'Demand', vals: r.demand }, { name: 'Supply', vals: r.supply }, { name: 'Proj. balance', vals: r.balance, neg: true }]; }
function ipPartRows(r, nested) {
  return metricRows(partLines(r), n => `
    <td class="l stick" rowspan="${n}"><div class="partcell" style="${nested ? 'padding-left:18px' : ''}"><button data-why="${r.part.id}">${esc(r.part.mpn)}</button><small>${esc(r.part.mfr)}</small>${nested ? '' : `<small>${esc(COMMODITIES[r.part.commodity].name)}</small><small><span class="mkt ${r.mktStatus || ''}">${esc(r.mktStatus || 'No coverage')}</span></small>`}</div></td>
    <td class="l" rowspan="${n}">${forecastHtml(r.forecast, lastRec(r.part.id).forecast)}<div style="margin-top:6px"><button class="why-btn" data-why="${r.part.id}">Why?</button></div></td>
    <td rowspan="${n}" class="v">${kfmt(r.part.onHand)}</td>
    <td rowspan="${n}" class="rr">${r.part.rr}${r.rrDrop > 0 ? `<small class="dn">▼${r.rrDrop}</small>` : ''}</td>`);
}
function ipTable(rows) {
  if (!rows.length) return `<p class="muted" style="padding:20px">No parts match.</p>`;
  const head = `<thead><tr><th class="l stick">${S.plan.group === 'commodity' ? 'Commodity · part' : 'Part'}</th><th class="l">Forecast recommendation</th><th>Inv.</th><th>RR</th><th class="l">Plan</th>${weekHead()}</tr></thead>`;
  if (S.plan.group === 'part') return `<table class="grid">${head}<tbody>${rows.map(r => ipPartRows(r, false)).join('')}</tbody></table>`;
  const body = planGroups(rows).map(([k, list]) => {

    const sum = key => WEEKS.map((_, w) => list.reduce((s, r) => s + r[key][w], 0));
    const inv = list.reduce((s, r) => s + r.part.onHand, 0);
    const head = metricRows([{ name: 'Demand', vals: sum('demand'), cls: 'cgrp' }, { name: 'Supply', vals: sum('supply'), cls: 'cgrp' }, { name: 'Proj. balance', vals: sum('balance'), neg: true, cls: 'cgrp' }], n => `
      <td class="l stick" rowspan="${n}"><div class="partcell"><button class="tog" data-tog="${k}" aria-expanded="${open}"><span class="caret">${open ? '▾' : '▸'}</span>${esc(c.name)}</button><small>${list.length} part${list.length > 1 ? 's' : ''}</small><small>${mktLine(c)}</small></div></td>
      <td class="l" rowspan="${n}">${forecastHtml(r0.forecast, lastRec(r0.part.id).forecast)}<div style="margin-top:6px"><button class="why-btn" data-cwhy="${k}">Why?</button></div></td>

// ── Plan For Every Part: supply / replenishment policy per part
// The five highest-impact risk factors, in place of the composite Resilience Rating
function riskFactors(r) {
  const m = r.mkt, a = r.part.applied || {};
  const ltDelta = m && m.lt != null ? m.lt - m.ltPrev : 0;
  return {
    lifecycle: r.ltb ? ['High', `LTB · final orders ${r.part.pcn.ltbDate}`] : r.part.lifecycle === 'NRND' ? ['Medium', 'Not recommended for new designs'] : ['Low', 'Active'],
    market: !m || !m.status ? [null, 'No market coverage'] : m.status === 'Constrained' ? ['High', 'Market constrained'] : m.status === 'Tightening' ? ['Medium', 'Market tightening'] : ['Low', `Market ${m.status.toLowerCase()}`],
    inventory: [r.invRisk, r.invRisk === 'High' ? `Projected shortage from ${WEEKS[r.firstShortWeek].label}` : r.invRisk === 'Medium' ? 'Cover drops below half a week' : 'Supply covers demand'],
    leadTime: !m || m.lt == null ? (r.hits.length ? ['Medium', 'Event delays'] : [null, 'No lead-time data']) : (ltDelta >= 6 || m.lt >= 26) ? ['High', `Lead time ${m.ltPrev}→${m.lt} wks`] : (ltDelta >= 3 || m.lt >= 18 || r.hits.length) ? ['Medium', `Lead time ${m.ltPrev}→${m.lt} wks${r.hits.length ? ' · event delays' : ''}`] : ['Low', `Lead time ${m.lt} wks`],
    sourcing: r.sources >= 2 ? ['Low', `${r.sources} approved sources`] : r.part.crossesP2P ? ['Medium', `Sole source · ${r.part.crossesP2P} pin-to-pin cross${r.part.crossesP2P > 1 ? 'es' : ''}`] : ['High', 'Sole source, no crosses'],
  };
}
const RISK_KEYS = [['lifecycle', 'Lifecycle'], ['market', 'Market risk'], ['inventory', 'Inventory risk'], ['leadTime', 'Lead time risk'], ['sourcing', 'Sourcing risk']];
const RANK = { High: 3, Medium: 2, Low: 1 };
function riskPill([lvl, tip]) { return lvl ? `<span class="pill ${lvl}" title="${esc(tip)}">${lvl}</span>` : `<span class="muted" title="${esc(tip)}">—</span>`; }
function spend(r) { return r.demand.reduce((a, b) => a + b, 0) * r.part.price; }

function pfepRow(r, nested) {
  const rf = riskFactors(r);
  return `<tr class="grp-end">
    <td class="l stick"><div class="partcell" style="${nested ? 'padding-left:18px' : ''}"><button data-why="${r.part.id}">${esc(r.part.mpn)}</button><small>${esc(r.part.mfr)}</small></div></td>
    <td class="l cm">${esc(COMMODITIES[r.part.commodity].name)}</td>
    <td class="v">${money(spend(r))}</td>
    ${RISK_KEYS.map(([k]) => `<td class="l">${riskPill(rf[k])}</td>`).join('')}
    <td class="l">${policyHtml(r)}</td>
    <td><button class="why-btn" data-why="${r.part.id}">Why?</button></td></tr>`;
}
function pfepTable(rows) {
  if (!rows.length) return `<p class="muted" style="padding:20px">No parts match.</p>`;
  const byC = S.plan.group === 'commodity';
  const head = `<thead><tr><th class="l stick">${byC ? 'Commodity · part' : 'Part'}</th><th class="l">Commodity</th><th title="Forecasted demand × unit price over 16 weeks">Forecasted spend</th>${RISK_KEYS.map(([, n]) => `<th class="l">${n}</th>`).join('')}<th class="l">Recommended policy</th><th></th></tr></thead>`;
  if (!byC) return `<table class="grid">${head}<tbody>${rows.map(r => pfepRow(r, false)).join('')}</tbody></table>`;
  const body = planGroups(rows).map(([k, list]) => {
    const c = COMMODITIES[k]; const open = S.plan.openP[k] !== false;
    const mix = {}; for (const r of list) for (const p of r.policies) mix[p] = (mix[p] || 0) + 1;
    const worst = key => { const lv = list.map(r => riskFactors(r)[key]).filter(x => x[0]).sort((a, b) => RANK[b[0]] - RANK[a[0]]); if (!lv.length) return riskPill([null, 'No data']); const n = lv.filter(x => x[0] === lv[0][0]).length; return `${riskPill([lv[0][0], `Highest in group: ${lv[0][1]}`])}${list.length > 1 ? ` <small class="muted">${n}/${list.length}</small>` : ''}`; };
    return `<tr class="cgrp grp-end"><td class="l stick"><div class="partcell"><button class="tog" data-tog="${k}" aria-expanded="${!!open}"><span class="caret">${open ? '▾' : '▸'}</span>${esc(c.name)}</button><small>${list.length} part${list.length > 1 ? 's' : ''} · ${mktLine(c)}</small></div></td>
      <td class="l cm">${esc(c.name)}</td>
      <td class="v">${money(list.reduce((s2, r) => s2 + spend(r), 0))}</td>
      ${RISK_KEYS.map(([key]) => `<td class="l">${worst(key)}</td>`).join('')}
      <td class="l"><div class="recs">${Object.entries(mix).sort((a, b) => b[1] - a[1]).map(([p, n]) => `<span>${n} × ${esc(shortPolicy(p))}</span>`).join('')}</div></td><td></td></tr>` + (open ? list.map(r => pfepRow(r, true)).join('') : '');
  }).join('');
  return `<table class="grid">${head}<tbody>${body}</tbody></table>`;
}

function whyChart(r) {
  const W = 600, H = 190, L = 44, R = 10, T = 12, B = 26;
  const max = Math.max(...r.demand, ...r.supply) * 1.1;
  const x = i => L + (i + 0.5) * (W - L - R) / NWEEKS, bw = (W - L - R) / NWEEKS * 0.56;
  const y = v => T + (1 - v / max) * (H - T - B);
  const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const ticks = [0, max / 2, max].map(v => `<text class="ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${kfmt(v)}</text><line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const bars = r.supply.map((v, i) => `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y(v)).toFixed(1)}" fill="rgba(76,207,178,.45)" rx="2"/>`).join('');
  const shorts = r.short.map((s, i) => s > 0 ? `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(r.demand[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2, y(r.demand[i] - s) - y(r.demand[i])).toFixed(1)}" fill="var(--rec)" opacity=".85" rx="2"/>` : '').join('');
  const lbl = WEEKS.map((w, i) => i % 2 === 0 ? `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${w.iso}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly demand and projected supply">${ticks}${bars}${shorts}<path d="${path(r.demand)}" fill="none" stroke="var(--demand)" stroke-width="2"/>${lbl}</svg>`;
}

const AI = { sample: null, live: false, tools: false, state: 'connecting' };
const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'];

async function initAI() {
  try {
    const s = window.claude && window.claude.use ? await window.claude.use('sample') : null;
    if (s) { AI.sample = s; AI.live = true; const lim = await s.limits().catch(() => null); AI.tools = !!(lim && lim.tools); }

}
function setAgentState(st) {
  AI.state = st; const dot = $('#agent-dot'), lab = $('#agent-state');

  lab.textContent = st === 'live' ? 'Live · Claude' : st === 'demo' ? 'Demo mode' : 'Connecting…';
  $('#dock-sub').title = st === 'live' ? 'Recommendations are explained live by Claude. Click to show or hide the agent.' : 'Claude is not available in this view, so the agent uses scripted explanations built from the same data.';
}
async function aiCall(input, opts = {}) {
  if (!AI.live || !AI.sample) throw { code: 'offline' };
  try {
    const o = { modelTier: opts.tier || 'quick' };
    if (opts.onText) o.onText = opts.onText;
    if (opts.signal) o.signal = opts.signal;
    if (opts.tools) o.tools = opts.tools; else if (opts.cache === false) o.cache = false;
    return opts.json ? await AI.sample.json(input, o) : (await AI.sample(input, o)).text;
  } catch (e) {
    if (e && PERMANENT.includes(e.code)) { AI.live = false; setAgentState('demo'); }
    throw e;
  }
}
async function typeInto(el, text, signal) {
  el.classList.remove('thinking');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { el.textContent = text; return; }
  for (let i = 0; i <= text.length; i += 4) { if (signal && signal.aborted) return; el.textContent = text.slice(0, i); await sleep(12); }
  el.textContent = text;
}

// ── Explain a recommendation
async function explainPart(r, el, modeEl, srcEl) {
  WHY_CTL = new AbortController(); const sig = WHY_CTL.signal;
  const fallback = whyFallback(r);
  if (AI.live) {
    modeEl.textContent = 'Claude'; srcEl.textContent = 'Written live by Claude from the facts on this page.';
    const prompt = `You are the planning agent in a supply-planning app for an electronics OEM. Explain this part's recommendation to a C-level executive.
Write exactly three short paragraphs, 110 words in total, plain text with no headings, bullets or markdown:
1) What changed in the signals (market, events, lifecycle, crosses, Resilience Rating) and why a traditional demand/supply check would or would not catch it.
2) Why the recommended forecast adjustment and policy beat the alternatives considered (use the scores and reasons given).
3) The cost of waiting and what accepting sets in motion.
Use only these facts; do not invent numbers.

FACTS:
${JSON.stringify(partFacts(r))}`;
    try {
      el.textContent = 'Thinking…';
      await aiCall(prompt, { signal: sig, onText: ({ text }) => { el.classList.remove('thinking'); el.textContent = text; } });
      return;
    } catch (e) {
      if (e && e.code === 'cancelled') return;
      srcEl.textContent = 'Claude was unavailable, so this explanation was assembled from the rule trace.';
    }
  } else srcEl.textContent = 'Demo mode: explanation assembled from the rule trace. With Claude connected, this is written live.';
  modeEl.textContent = AI.live ? 'Claude' : 'Scripted';
  typeInto(el, fallback, sig);
}
function whyFallback(r) {
  const m = r.mkt; const parts = [];
  const sigs = [];
  if (m && m.status && m.status !== m.prev) sigs.push(`the ${m.name.split(' · ')[1] || m.name} market moved from ${m.prev.toLowerCase()} to ${m.status.toLowerCase()} (lead time ${m.ltPrev}→${m.lt} weeks, price ${m.price > 0 ? '+' : ''}${m.price}%)`);
  else if (m && m.status) sigs.push(`the ${m.name.split(' · ')[1] || m.name} market is ${m.status.toLowerCase()}`);
  for (const e of r.hits) sigs.push(`${e.title} cuts supply about ${Math.round(e.impact * 100)}% in ${wkRange(e.from, e.from + e.weeks - 1)}`);
  if (r.part.pcn) sigs.push(`${r.part.pcn.id} moves the part to last-time buy by ${r.part.pcn.ltbDate}`);
  if (r.part.crossNew) sigs.push(`a new pin-to-pin cross, ${r.part.bestCross.mpn} from ${r.part.bestCross.mfr}, just became available`);
  if (r.rrDrop >= 5) sigs.push(`the Resilience Rating fell ${r.rrDrop} points to ${r.part.rr}`);
  parts.push(`${cap(sigs.join('; ') || 'signals are stable')}. ${r.shortUnits > 0 ? `The plan now shows ${fmt(r.shortUnits)} units short starting ${WEEKS[r.firstShortWeek].label}.` : `A traditional demand/supply check still shows no gap, because supply commitments cover demand today. The signals say that cover is fragile.`}`);
  const top = r.ranked[0], alt = r.ranked.find(c => !r.policies.includes(c.policy));
  parts.push(`${r.forecast && r.forecast.startsWith('Adjust') ? `For the demand plan I recommend ${r.adjDir === 'pull' ? 'pulling demand forward' : 'pushing demand out'}, so orders reflect the market rather than history. ` : ''}${r.policies.join(' plus ')} ranks highest (${top.score}) because ${top.why.charAt(0).toLowerCase() + top.why.slice(1)}.${alt ? ` ${alt.policy} was considered (${alt.score}) but ${alt.policy === 'MRP' ? 'conditions are not normal' : 'addresses less of the exposure'}.` : ''}`);
  parts.push(r.revenueAtRisk > 0 ? `Waiting leaves ${money(r.revenueAtRisk)} of ${PRODUCT.name} revenue exposed. Accepting routes ${actionsFor(r).length} actions to the owning teams, and I will reassess the part as they close.` : `Acting now is cheap insurance: no revenue is at risk yet, but lead times move faster than the plan. Accepting routes ${actionsFor(r).length} action${actionsFor(r).length === 1 ? '' : 's'} to the owning teams.`);
  return parts.join('\n\n');
}

If you accept all ${pend.length}, clear-to-build goes from **${pct(c)}% to ${pct(a)}%** and revenue at risk falls from **${money(c.revenueAtRisk)} to ${money(a.revenueAtRisk)}**.`;

function findParts(i = {}) {
  const pol = (i.policy || '').toLowerCase();
  return S.comp.results.filter(r => (!i.commodity || r.part.commodity === i.commodity || COMMODITIES[r.part.commodity].name.toLowerCase().includes(String(i.commodity).toLowerCase()))
    && (!pol || r.policies.some(p => p.toLowerCase().includes(pol)) || (r.forecast || '').toLowerCase().includes(pol))
    && (!i.region || r.part.region.toLowerCase().includes(String(i.region).toLowerCase()))
    && (!i.changed_only || isChanged(r)) && (!i.at_risk_only || r.revenueAtRisk > 0) && (!i.sole_source_only || r.sources === 1))
    .sort((a, b) => priority(b) - priority(a)).slice(0, 15)
    .map(r => ({ part: r.part.mpn, commodity: COMMODITIES[r.part.commodity].name, market: r.mktStatus, region: r.part.region, sources: r.sources, rr: r.part.rr, inventory_risk: r.invRisk, revenue_at_risk_usd: Math.round(r.revenueAtRisk), recommendation: [r.forecast, ...r.policies].filter(Boolean), changed: isChanged(r), status: S.accepted[r.part.id] ? 'assigned' : 'open' }));
}

async function chat(text) {
  if (CHAT.busy) return; CHAT.busy = true;
  setDock(true); userSay(text);
  const el = agentMsg(); CHAT.pending = el; const body = $('.body', el); body.innerHTML = '<p class="muted"><em>Thinking…</em></p>';
  CHAT.turns.push({ role: 'user', content: text });
  try {
    let reply;
    if (AI.live) {
      try { reply = await liveChat(body); }
      catch (e) { if (e && e.code === 'cancelled') throw e; reply = null; }
    }
    if (!reply) reply = await fallbackChat(text, body);
    body.innerHTML = mdToHtml(reply);
    CHAT.turns.push({ role: 'assistant', content: reply });
  } catch (e) { body.innerHTML = '<p class="muted">Stopped.</p>'; }
  CHAT.pending = null; scrollFeed(); CHAT.busy = false;
}
async function liveChat(body) {
  const rules = `You are the Planning Agent inside "Intelligent Planning", an AI-first supply-planning app for an electronics OEM building ${PRODUCT.name} (48-part BOM, weekly plan ${WEEKS[0].label}–${WEEKS[NWEEKS - 1].label}). You combine demand/supply plans with market intelligence, Resilience Rating, lifecycle PCNs, geopolitical events and cross references to recommend a market-adjusted forecast and a Plan-for-Every-Part policy per part, then route actions to owners (Design Engineer, Supply Chain Manager, Procurement/Buyer, Demand Planner) and reassess.
The user is a C-level executive. Answer in at most 120 words of plain prose; short numbered lists and **bold** are fine; no headings. Never invent numbers: use tools for facts. When the user wants to see something, call open_view. For what-ifs, call run_scenario. For monitoring or automation requests, call draft_workflow. Only call accept_recommendations if the user explicitly asks to accept or assign.
Current portfolio: ${JSON.stringify(portfolioFacts())}`;
  const turns = [{ role: 'user', content: rules }, ...CHAT.turns.slice(-8)];
  const opts = { tier: 'quick', onText: ({ text }) => { body.innerHTML = mdToHtml(text); scrollFeed(); } };
  if (AI.tools) opts.tools = agentTools(); else opts.cache = false;
  const text = await aiCall(turns, opts);
  return text.replace(/\n{3,}/g, '\n\n').trim();
}
