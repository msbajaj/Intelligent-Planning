async function fallbackChat(text, body) {
  const t = text.toLowerCase(); await sleep(500);
  if (/briefing|ceo|one.minute|executive summary|big picture/.test(t)) {
    toolLine('<b>open_view</b> scenarios'); setView('scenarios'); const st = buildStory();
    return `**${st.headline}.** ${st.dek}\n\n${st.sections.map(([h, p]) => `**${h}.** ${p}`).join('\n\n')}`;
  }
  if (/what if|what-if|scenario|lasts|extend|suppose|imagine|simulat|increase supply|expedite|air.?freight|safety stock|\bif\b.*(demand|port|constraint|closure)/.test(t)) {
    toolLine('<b>run_scenario</b> ' + esc(text));
    const prm = parseScenarioFallback(text); runScenario(prm); setView('scenarios');
    return simReadout();
  }
  if (/every (morning|day|week)|daily|weekly|monitor|watch|alert me|notify|workflow|automat/.test(t)) {
    toolLine('<b>draft_workflow</b>'); setView('workflows'); const spec = await draftWorkflow(text);
    return `I drafted **${spec.name}**: ${spec.triggers.map(x => x.label.toLowerCase()).join(', ')}, scoped to ${spec.scope.label.toLowerCase()}. Review the triggers and routing on the right, then activate it or run it once now.`;
  }
  if (/engineer|waiting|actions|who|owner|assigned/.test(t)) {
    toolLine('<b>get_actions</b>'); setView('actions');
    const open = S.actions.filter(a => a.status !== 'Done'); const by = {};
    for (const a of open) (by[a.role] = by[a.role] || []).push(a);
    if (!open.length) return 'Nothing is open right now. Accept recommendations on the Plan screen and I will route them.';
    return `There are **${open.length} open actions**.\n${Object.entries(by).map(([k, v]) => `- **${ROLES[k].person}** (${ROLES[k].name}): ${v.length}, e.g. ${v[0].title.toLowerCase()} for ${v[0].mpn}`).join('\n')}\n\n${by.de ? `Engineering is the long pole: cross validation gates the multi-source moves.` : ''}`;
  }
  const mentioned = S.world.parts.find(p => t.includes(p.mpn.toLowerCase()));
  if (mentioned) {
    const r = S.comp.byId[mentioned.id]; toolLine('<b>get_part</b> ' + esc(mentioned.mpn)); openWhy(mentioned.id);
    if (/walk|why|explain/.test(t)) return `**${mentioned.mpn}**: ${[r.forecast, ...r.policies].filter(Boolean).join(' · ')}.\n\n${whyFallback(r)}`;
    return `${mentioned.mpn}: **${[r.forecast, ...r.policies].filter(Boolean).join(' · ')}**. ${r.revenueAtRisk ? `Waiting two weeks keeps ${money(r.revenueAtRisk)} exposed; the first shortage is ${WEEKS[r.firstShortWeek].label}, and every week of delay pushes recovery past the ${r.mkt?.lt || 'current'}-week lead time.` : `Nothing is short yet, so a two-week wait costs little today. The risk is lead time: at ${r.mkt?.lt || '—'} weeks, orders placed later land after the market tightens further.`} The full reasoning is open on the right.`;
  }
  if (/accept all|assign all|accept (them|everything)/.test(t)) {
    toolLine('<b>accept_recommendations</b> all'); const res = acceptAll(); setView('actions');
    return res.actions ? `Done. **${res.actions} actions** are routed across ${new Set(S.actions.map(a => a.role)).size} teams for ${res.parts} parts. I'll reassess each part as its actions close.` : 'Everything is already assigned.';
  }
  if (/resilien|\brr\b|rating/.test(t)) {
    toolLine('<b>find_parts</b> {"sort":"resilience_rating"}');
    const rs = S.comp.results.filter(r => r.part.rr != null).sort((a, b) => a.part.rr - b.part.rr).slice(0, 6);
    S.plan.ids = rs.map(r => r.part.id); S.plan.changedOnly = false; S.plan.mode = 'sum'; S.plan.group = 'part'; setView('plan');
    return `The weakest Resilience Ratings on the BOM:\n${rs.map(r => { const poor = Object.entries(r.part.ratings).filter(([, v]) => v === 'Poor').map(([k]) => k.replace(/ Rating$/, '')); return `- **${r.part.mpn}** (${COMMODITIES[r.part.commodity].name}): ${r.part.rr} · ${r.part.rrGrade}${poor.length ? `; poor on ${poor.slice(0, 3).join(', ')}` : ''}. Plan: ${r.policies.map(shortPolicy).join(' + ')}`; }).join('\n')}\n\nThey are filtered on the Plan screen.`;
  }
  if (/biggest|exposure|risk|worst/.test(t)) {
    toolLine('<b>find_parts</b> {"at_risk_only":true}');
    const rs = S.comp.results.filter(r => r.revenueAtRisk > 0).sort((a, b) => b.revenueAtRisk - a.revenueAtRisk);
    if (!rs.length) return `No part has revenue at risk right now: every projected shortage has a mitigation in place. I'll keep watching the market and event feeds and flag anything that reopens a gap.`;
    const byC = {}; for (const r of rs) (byC[r.part.commodity] = byC[r.part.commodity] || []).push(r);
    const named = Object.keys(byC).find(k => t.includes(COMMODITIES[k].name.toLowerCase()));
    const want = named || Object.keys(byC).sort((x, y) => byC[y].reduce((s, r) => s + r.revenueAtRisk, 0) - byC[x].reduce((s, r) => s + r.revenueAtRisk, 0))[0];
    const g = byC[want]; const name = COMMODITIES[want].name || COMMODITIES[want].name;
    const drivers = [...new Set(g.flatMap(r => [r.mkt && CONSTRAINED(r.mkt.status) ? `${name} prices show a ${mstat(r.mkt).toLowerCase()}` : null, ...r.hits.map(e => e.title), r.sole ? 'sole sourcing' : null, r.part.rrGrade === 'Poor' ? `Poor Resilience Rating on ${r.part.mpn}` : null, r.shortUnits > 0 ? 'committed supply below demand' : null]).filter(Boolean))].slice(0, 3);
    S.hz.group = 'part'; S.hz.scope = g[0].part.id; S.hz.source = 'base'; setView('horizon');
    return `**${name} is the biggest exposure: ${g.length} of the ${rs.length} parts projected short, starting ${WEEKS[Math.min(...g.map(r => r.firstShortWeek))].label}.** The signals that stack up: ${drivers.join('; ')}.\n\n${g.slice(0, 6).map(r => `- **${r.part.mpn}**: short from ${WEEKS[r.firstShortWeek].label}; recommend ${r.policies.map(shortPolicy).join(' + ')}`).join('\n')}\n\nI've put ${g[0].part.mpn} on the Roadmap so you can see where the gap opens.`;
  }
  if (/calendar|holiday|shutdown|golden week|tariff|polysilicon|new year|compliance|cbam|important dates|coming up/.test(t)) {
    toolLine('<b>get_portfolio_summary</b> strategic calendar');
    const next = STRATEGIC.filter(x => x.view === 'in' && !x.lane).sort((a, b) => a.week - b.week).slice(0, 6);
    setView('horizon');
    return `**Key dates in the next ${NWEEKS} weeks:**\n${next.map(x => `- **${x.timing}**: ${x.title} (${x.geo}). ${x.action}.`).join('\n')}\n\nThe full strategic calendar, including later and ongoing items, is under **Strategic calendar** on the Roadmap.`;
  }
  if (/change|what's new|what is new|summary|brief/.test(t)) {
    const ch = changedResults(); const by = {}; for (const r of ch) for (const p of r.policies) by[p] = (by[p] || 0) + 1;
    return `**${ch.length} ${HAS_HISTORY ? 'recommendations changed this week' : 'new recommendations'}** (${HAS_HISTORY ? '' : 'first planning run'}): ${Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${v} ${shortPolicy(k)}`).join(', ')}. The main drivers are committed supply running below demand, commodity price increases and parts that are obsolete or at last-time buy.`;
  }
  toolLine('<b>get_portfolio_summary</b>');
  const f = portfolioFacts();
  return `Across ${f.parts} parts, **${money(f.revenue_at_risk_usd)}** of revenue is at risk over ${NWEEKS} weeks (clear-to-build ${f.clear_to_build_pct}%). With the recommended plan it drops to ${money(f.revenue_at_risk_with_ai_plan_usd)}. ${f.awaiting_decision} recommendations await your decision. Try asking about a part, a what-if, or a standing instruction like “every morning, check my sole-source parts”.`;
}

async function explainCommodity(k, c, list, el, modeEl, srcEl) {
  WHY_CTL = new AbortController(); const sig = WHY_CTL.signal;
  const r0 = list[0];
  const fb = !c.status
    ? `There is no market intelligence for ${c.name}, so the agent leaves the forecast insight blank rather than guess. The ${list.length} part${list.length > 1 ? 's' : ''} in this classification stay on the statistical forecast, and their supply policy is set separately in Plan For Every Part.`
    : `Market intelligence shows ${c.name} prices with a ${mstat(c).toLowerCase()}${c.lt != null ? `, with lead times at ${c.lt} weeks` : ''}. ${CONSTRAINED(c.status) ? 'Rising prices signal tightening supply.' : c.status === 'Surplus' ? 'Falling prices signal loose supply.' : 'Prices are steady.'}\n\n${CONSTRAINED(c.status) ? `A forecast built only on history would place orders too late for these lead times. The recommendation is to pull demand forward for all ${list.length} parts, so the next MRP run releases orders ahead of the constraint.` : c.status === 'Surplus' ? `With supply loose and prices falling, buying ahead ties up cash. The recommendation is to push demand out so the next MRP run buys closer to need.` : `Nothing in the market argues for changing the plan, so the statistical forecast holds.`}\n\nThis is the planner's decision. Supply policies such as buffers, LTSAs or multi-sourcing for these parts are handled in Plan For Every Part.`;
  if (AI.live) {
    modeEl.textContent = 'Claude'; srcEl.textContent = 'Written live by Claude from the market facts on this page.';
    try {
      el.textContent = 'Thinking…';
      await aiCall(`You are the planning agent. Explain to a C-level executive, in 3 short paragraphs (90 words total, plain text, no headings or bullets), why the demand forecast recommendation for this commodity is "${r0.forecast || 'blank'}". Cover what the market is doing, why a history-based forecast would be wrong now, and that supply policies (buffer, LTSA, multi-source) are decided separately in Plan For Every Part. Do not quote unit quantities. Use only these facts:\n${JSON.stringify({ commodity: c.name, price_status: mstat(c), market_state: c.status, lead_time_weeks: c.lt, parts: list.map(r => r.part.mpn), recommendation: r0.forecast, rule: forecastBasis(c) })}`, { signal: sig, onText: ({ text }) => { el.classList.remove('thinking'); el.textContent = text; } });
      return;
    } catch (e) { if (e && e.code === 'cancelled') return; srcEl.textContent = 'Claude was unavailable, so this explanation was assembled from the market data.'; }
  } else srcEl.textContent = 'Demo mode: explanation assembled from the market data. With Claude connected, this is written live.';
  modeEl.textContent = 'Scripted';
  typeInto(el, fb, sig);
}

const NEXT_LABEL = { 'Assigned': 'Start review', 'In review': 'Approve', 'Approved': 'Mark done' };

VIEWS.actions = function () {
  const el = $('#v-actions');
  const open = S.actions.filter(a => a.status !== 'Done');
  const inRev = S.actions.filter(a => a.status === 'In review' || a.status === 'Approved').length;
  const done = S.actions.filter(a => a.status === 'Done').length;
  const protectedRev = Math.max(0, S.startRisk - S.comp.ctb.revenueAtRisk);
  const lanes = Object.entries(ROLES).map(([k, r]) => {
    const list = S.actions.filter(a => a.role === k).sort((a, b) => FLOW.indexOf(a.status) - FLOW.indexOf(b.status) || (a.status === 'Done' ? 0 : 0));
    const live = list.filter(a => a.status !== 'Done'), fin = list.filter(a => a.status === 'Done');
    return `<div class="lane"><div class="lane-h"><span class="av ${k}">${r.initials}</span><div><b>${esc(r.name)}</b><small>${esc(r.person)}</small></div><span class="cnt">${live.length} open</span></div>
      ${live.length ? live.map(actCard).join('') : '<div class="empty">Nothing waiting.</div>'}
      ${fin.length ? `<details><summary class="muted" style="font-size:12px;cursor:pointer">${fin.length} completed</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${fin.map(actCard).join('')}</div></details>` : ''}</div>`;
  }).join('');
  el.innerHTML = `
    <div class="kpis">
      <div class="card kpi"><div class="eyebrow">Open actions</div><div class="v">${open.length}</div><div class="s">${inRev} in review or approved</div></div>
      <div class="card kpi"><div class="eyebrow">Completed</div><div class="v">${done}</div><div class="s">${Object.keys(S.resolved).length} parts reassessed</div></div>
      <div class="card kpi"><div class="eyebrow">Revenue protected</div><div class="v" style="color:var(--good)">${money(protectedRev)}</div><div class="s">of ${money(S.startRisk)} at risk at the start of the run</div></div>
      <div class="card kpi"><div class="eyebrow">Awaiting your decision</div><div class="v">${pendingChanged().length}</div><div class="s"><button class="why-btn" id="ac-plan">Review in Plan ›</button></div></div>
    </div>
    <div class="toolbar"><span class="muted" style="font-size:12.5px">Prototype control: owners' progress is simulated.</span><span class="grow"></span>
      <button class="btn" id="ac-step" ${open.length ? '' : 'disabled'}>Simulate one day of team progress</button></div>
    <div class="lanes">${lanes}</div>
    <div class="twocol" style="margin-top:20px">
      <div class="card" style="padding:16px"><div class="why-sec"><h4>Activity</h4></div><div class="feed">${S.activity.slice(0, 30).map(e => `<div class="ev ${e.cls}"><time>${e.t}</time><span class="av ${e.who === 'ai' ? 'ai' : e.who === 'you' ? 'dp' : e.who}">${e.who === 'ai' ? '✦' : e.who === 'you' ? 'You' : ROLES[e.who]?.initials || '·'}</span><p>${e.html}</p></div>`).join('')}</div></div>
      <div class="card" style="padding:16px"><div class="why-sec"><h4>Routing rules</h4></div>
        <p class="muted" style="font-size:12.5px;margin:0 0 8px">Default owner for each recommendation. Changes apply to new actions. Customers can add approval thresholds per role.</p>
        <table class="routing-table"><tbody>${Object.entries(S.routing).map(([pol, [role, title]]) => `<tr><td><b style="font-size:12.5px">${esc(pol)}</b><div class="muted" style="font-size:11.5px">${esc(title)}</div></td><td style="width:48%"><select class="field" data-pol="${esc(pol)}" aria-label="Owner for ${esc(pol)}">${Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${k === role ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
    </div>`;
  $$('[data-adv]', el).forEach(b => b.onclick = () => advanceAction(b.dataset.adv));
  $$('[data-why]', el).forEach(b => b.onclick = () => openWhy(b.dataset.why));
  $$('select[data-pol]', el).forEach(s => s.onchange = () => { S.routing[s.dataset.pol][0] = s.value; logActivity('you', `Routing changed: <b>${esc(s.dataset.pol)}</b> → ${esc(ROLES[s.value].name)}.`); toast('Routing rule updated'); });
  $('#ac-plan').onclick = () => setView('plan');
  $('#ac-step').onclick = () => {
    const live = S.actions.filter(a => a.status !== 'Done');
    // advance a handful, oldest first, so reassessments happen visibly
    const byPart = {}; for (const a of live) (byPart[a.partId] = byPart[a.partId] || []).push(a);
    const picks = Object.values(byPart).slice(0, 4).flat();
    for (const a of picks) advanceAction(a.id);
    S.actions.forEach(a => a.fresh = false);
  };
  S.actions.forEach(a => a.fresh = false);
};
function actCard(a) {
  return `<div class="act ${a.fresh ? 'fresh' : ''}"><div class="t">${esc(a.title)}</div>
    <div>${seBadge(true)} <button class="why-btn mono" data-why="${a.partId}" style="font-family:var(--mono)">${esc(a.mpn)}</button> <span class="chip rec" style="margin-left:4px">${esc(shortPolicy(a.policy.replace('Adjust forecast (pull)', 'Pull forecast').replace('Adjust forecast (push)', 'Push forecast')))}</span></div>
    <div class="muted" style="font-size:12px">${esc(a.spec)}</div>
    <div class="meta"><span class="st ${a.status.replace(' ', '-')}">${esc(a.status)}</span><span>Due ${esc(a.due)}${a.createdBy === 'Workflow' ? ' · by workflow' : ''}</span>
    ${a.status !== 'Done' ? `<button class="btn sm" data-adv="${a.id}">${NEXT_LABEL[a.status]} ›</button>` : ''}</div></div>`;
}

const WF = { text: 'Every morning, analyze my critical parts. Identify parts where projected supply will not meet demand or where resilience has materially deteriorated. Recommend mitigation actions and assign them to the appropriate teams.', draft: null, selected: null, busy: false, run: null, source: '' };

const TRIG_LABEL = { time: 'Time-based', gap: 'Demand / supply', event: 'Event-based', market: 'Market signal' };

function seedWorkflows() {
  S.workflows = [
    { id: 'wf1', status: 'Active', next: 'Tomorrow 22:00', last: 'Today · first planning run', spec: fallbackSpec('Every night, refresh the plan for all parts, re-score recommendations against market intelligence, events and PCNs, and brief me on what changed.', 'Nightly plan refresh') },
    { id: 'wf2', status: 'Active', next: 'Mon 07:00', last: 'Not yet run', spec: fallbackSpec('Every Monday, check for PCN and lifecycle changes on any part. When a part moves to LTB, recommend a life-time buy and assign it to the supply chain manager, and ask design engineering to validate crosses.', 'Weekly PCN & lifecycle watch') },
  ];
  WF.selected = 'wf1';
}

            <button data-ex="When a geopolitical event hits a region where any sole-source part is made, assess the impact within the hour and alert the supply chain manager.">Event-based · sole-source exposure</button>

  const run = WF.run && WF.run.name === sp.name ? WF.run : null;
  return `
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div><div class="eyebrow" style="color:${status === 'Draft' ? 'var(--warn)' : 'var(--good)'}">${status === 'Draft' ? 'Draft · review before activating' : 'Active · ' + esc(sp.schedule || '')}</div><h3>${esc(sp.name)}</h3></div>
      ${WF.source && status === 'Draft' ? `<span class="chip agent">${esc(WF.source)}</span>` : ''}
    </div>
    <p class="sum">${esc(sp.summary)}</p>
    <div class="why-sec"><h4>Triggers</h4><div class="trig">${sp.triggers.map(t => `<div class="t"><div class="ty">${esc(TRIG_LABEL[t.type] || t.type)}</div><b>${esc(t.label)}</b><small>${esc(t.detail || '')}</small></div>`).join('')}</div></div>
    <div class="why-sec"><h4>Scope and conditions</h4><div style="display:flex;flex-wrap:wrap;gap:6px"><span class="chip agent">${esc(sp.scope.label)}</span>${sp.conditions.map(c => `<span class="chip">${esc(c.label)}</span>`).join('')}</div></div>
    <div class="why-sec"><h4>What the agent does</h4><div class="pipe">${STAGES.map(([k, n], i) => `<div class="s ${run ? (i < run.stage ? 'done' : i === run.stage ? 'run' : '') : ''}"><span class="n">${n}</span>${esc(sp.steps[k] || '')}</div>`).join('')}</div></div>
    <div class="why-sec"><h4>Routing and approvals</h4><div class="routes">${sp.routing.map(r => { const k = roleKey(r.owner); return `<div class="route"><span class="av ${k}">${ROLES[k].initials}</span><div><b>${esc(r.recommendation)}</b>${r.approval ? `<div class="muted" style="font-size:12px">${esc(r.approval)}</div>` : ''}</div><div class="who">${esc(ROLES[k].name)}</div></div>`; }).join('')}</div></div>
    ${sp.notify && sp.notify.length ? `<div class="why-sec"><h4>Notifications</h4><div style="display:flex;flex-wrap:wrap;gap:6px">${sp.notify.map(n => `<span class="chip">${esc(n)}</span>`).join('')}</div></div>` : ''}
    ${run && run.findings ? `<div class="why-sec"><h4>Run results · ${run.findings.length} parts matched</h4><div class="agent-text" style="font-size:15px;margin-bottom:10px">${esc(run.text)}</div><div class="findings">${run.findings.slice(0, 10).map(f => `<div class="finding"><div><span class="mono">${esc(f.mpn)}</span> <span class="muted">· ${esc(f.reason)}</span></div><span class="red" style="font-size:12px;font-weight:500">${esc(f.rec)}</span></div>`).join('')}${run.findings.length > 10 ? `<div class="muted" style="font-size:12px">+ ${run.findings.length - 10} more</div>` : ''}</div></div>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${status === 'Draft' ? `<button class="btn primary" id="wf-act">Activate</button><button class="btn" id="wf-run">Run once now</button><button class="btn ghost" id="wf-disc">Discard</button>` : `<button class="btn" id="wf-run">Run now</button><button class="btn ghost" id="wf-pause">Pause</button>`}
    </div>

// ── Metrics, costs and summary
function metrics(comp) {

    inv: comp.results.reduce((a, r) => a + r.startInv * r.part.price, 0),
    short: comp.results.filter(r => r.shortUnits > 0).length,

  const air = scp.airFreight ? AIR_PER_WEEK * Math.min(NWEEKS, airEvent()?.weeks || 4) : 0;
  const qual = scp.crossQualified ? QUAL_PER_PART * S.world.parts.filter(p => p.crossNew).length : 0;
  const wc = Math.max(0, s.inv - b.inv);
  const carry = wc * CARRY_RATE * NWEEKS / 52;
  const total = expedite + air + qual + carry;

  const costs = simCosts(s.scp, b, sc);
  return {

  if (reg) s.region = { region: reg, impact: pct && !s.demandPct && !k && !s.boost.pct ? +pct / 100 : 0.5, from: 1, weeks: wks };

}

    const e = r.hits[0];
    const cause = e ? e.title.replace(/ \(what-if\)$/, '') : r.mkt && CONSTRAINED(r.mkt.status) ? `${r.mkt.name} price ${mstat(r.mkt).toLowerCase()}` : 'committed supply below demand';

}
function riskByCommodity(comp) {

}

function briefChart() {
  const s = S.scenario; const W = 700, H = 240, L = 50, R = 12, T = 14, B = 26;
  const dem = s.comp.ctb.plan, sup = s.comp.ctb.built, today = S.comp.ctb.plan;
  const delta = sup.map((v, i) => v - dem[i]);
  const max = Math.max(...dem, ...today) * 1.1, minD = Math.min(0, ...delta);
  const top = T, mid = T + (H - T - B) * 0.72; // lines above, delta bars below
  const y = v => top + (1 - v / max) * (mid - top - 8);
  const dRange = Math.max(1, -minD, Math.max(...delta));
  const yd = v => mid + 12 + (H - B - mid - 16) / 2 - v / dRange * (H - B - mid - 16) / 2;
  const x = i => L + (i + 0.5) * (W - L - R) / NWEEKS, bw = (W - L - R) / NWEEKS * 0.55;
  const path = a => a.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const ticks = [0, max / 2, max].map(v => `<text class="ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${kfmt(v)}</text><line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join('');
  const z = yd(0);
  const bars = delta.map((d, i) => { const h = Math.max(1.5, Math.abs(yd(d) - z)); return `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(d < 0 ? z : z - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${d < 0 ? 'var(--rec)' : 'var(--good)'}" opacity=".85" rx="2"/>${NWEEKS <= 20 && d < 0 && Math.abs(d) > dRange * 0.25 ? `<text class="ax" x="${x(i)}" y="${(z + h + 10).toFixed(1)}" text-anchor="middle" style="fill:var(--rec)">−${kfmt(-d)}</text>` : ''}`; }).join('');
  const lbl = WEEKS.map((w, i) => i % (NWEEKS > 20 ? 4 : 2) === 0 ? `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${w.iso}</text>` : '').join('');
  const active = (s.scp.demandPct || 0) > 0;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly demand, supply and delta">${ticks}
    ${active ? `<path d="${path(today)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>` : ''}
    <path d="${path(dem)}" fill="none" stroke="var(--demand)" stroke-width="2.2"/><path d="${path(sup)}" fill="none" stroke="var(--supply)" stroke-width="2.2"/>
    <text class="ax" x="${L - 6}" y="${z + 3}" text-anchor="end">Δ 0</text><line x1="${L}" x2="${W - R}" y1="${z}" y2="${z}" stroke="var(--line2)"/>${bars}${lbl}</svg>`;
}

// ── Live agent write-up of the insights (actual supply chain)
function storyKey() { return 'actual|' + S.comp.ctb.revenueAtRisk + '|' + pendingChanged().length; }
function aiStoryHtml(text) { return `<div class="st-ai">${mdToHtml(text)}</div>`; }
async function agentStory() {
  const btn = $('#br-ai'); const box = $('#br-story');
  if (!AI.live) { toast('Claude is not available in this view, so the insights stay built from the numbers.'); return; }
  const st = buildStory(); const key = storyKey();
  btn.disabled = true; $('#br-src').textContent = 'Claude is writing…';
  const facts = { headline: st.headline, on_time_delivery_pct: st.m.otd, boards_late: st.m.late, revenue_at_risk_usd: Math.round(st.m.rar), insights: st.insights.map(x => `${x[0]}: ${x[1]}`), converge_open_market: CONVERGE, top_drivers: topDrivers(S.comp).map(d => ({ part: d.r.part.mpn, cause: d.cause, revenue_at_risk_usd: Math.round(d.r.revenueAtRisk) })) };
  try {
    let first = true;
    const text = await aiCall(`You are the anchor of a daily supply-chain briefing for a CEO. Using only these facts about the actual supply chain, write 5 key insights as a numbered list. Each item starts with a bold 2–3 word lead-in, then one plain sentence with the key number. No jargon, no invented numbers.\n${JSON.stringify(facts)}`, { tier: 'quick', onText: ({ text }) => { if (first) { box.innerHTML = ''; first = false; } box.innerHTML = aiStoryHtml(text); } });
    S.briefAI = { text, key }; $('#br-src').textContent = 'Written by Claude';
  } catch (e) { $('#br-src').textContent = 'Built from live numbers'; if (e && e.code !== 'cancelled') toast('Claude could not write the insights right now.'); updateBriefing(); }
  btn.disabled = false;
}

// ───────────────────────── Boot ─────────────────────────
(function boot() {
  S.world = makeWorld();
  S.lastWeek = compute(prevWorld(S.world));
  S.comp = compute(S.world);
  S.ai = compute(withAllApplied(S.world, S.comp));
  S.startRisk = S.comp.ctb.revenueAtRisk;
  seedHistory(); seedWorkflows();
  initShell();
  updateBadges();
  setView('scenarios');
  initAI();
  briefing();
})();
</script>
