<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Intelligent Planning Branded</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>:root {
  color-scheme: dark;
  --ink: #0A1018;
  --deep: #0F1721;
  --panel: #141F2C;
  --panel2: #192637;
  --line: #22324A;
  --line2: #2F4360;
  --text: #E7EDF4;
  --soft: #B9C6D6;
  --muted: #8494AB;
  --faint: #56677E;
  --demand: #7EB0FF;
  --supply: #4CCFB2;
  --rec: #FF5B4F;
  --rec-soft: rgba(255, 91, 79, .14);
  --warn: #F3B34C;
  --good: #5ED39A;
  --agent: #B7A7FF;
  --agent-soft: rgba(183, 167, 255, .12);
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cond: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --serif: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --r: 8px;
  --dock: 380px;
  --on-agent: var(--on-agent);
  --hz-glow: #132034;
  --glass: rgba(16, 25, 38, .92);
  --glass2: rgba(15,23,33,.82);
  --rowhover: #121c29;
  --recm-bg: rgba(40, 16, 18, .9);
  --scrim: rgba(4,8,14,.55);
}
:root[data-theme="light"] {
  color-scheme: light;
  --ink: #F3F5F8; --deep: #FFFFFF; --panel: #FFFFFF; --panel2: #F1F4F8; --line: #DFE5EC; --line2: #C7D1DD;
  --text: #132033; --soft: #36485E; --muted: #5C6C82; --faint: #8D9AAC;
  --demand: #2F6FD6; --supply: #0E9A7E; --rec: #D63A2F; --rec-soft: rgba(214,58,47,.10); --warn: #B07400; --good: #1D9A5B;
  --agent: #6A50DF; --agent-soft: rgba(106,80,223,.10); --on-agent: #FFFFFF;
  --hz-glow: #E3EBF5; --glass: rgba(255,255,255,.95); --glass2: rgba(255,255,255,.88); --rowhover: #EEF3F9; --recm-bg: #FFF1F0; --scrim: rgba(20,32,51,.35);
}
:root[data-theme="graphite"] {
  color-scheme: dark;
  --ink: #111214; --deep: #17181B; --panel: #1C1E22; --panel2: #23262B; --line: #2E3137; --line2: #3E424A;
  --text: #ECEDEF; --soft: #C3C6CC; --muted: #8D919A; --faint: #5E626B;
  --agent: #9FB4FF; --agent-soft: rgba(159,180,255,.12); --on-agent: #0E1424;
  --hz-glow: #1E2128; --glass: rgba(28,30,34,.94); --glass2: rgba(23,24,27,.86); --rowhover: #22252A; --recm-bg: rgba(48,18,18,.9); --scrim: rgba(0,0,0,.55);
}
:root[data-theme="ocean"] {
  color-scheme: dark;
  --ink: #06161F; --deep: #0A1F2B; --panel: #0E2836; --panel2: #123142; --line: #1C4256; --line2: #295670;
  --text: #E5F2F6; --soft: #B1CFDA; --muted: #7B9DAC; --faint: #4D6F7E;
  --demand: #7FC3FF; --supply: #4FD8C4;
  --agent: #5FD7CB; --agent-soft: rgba(95,215,203,.12); --on-agent: #04201E;
  --hz-glow: #0F3346; --glass: rgba(14,40,54,.94); --glass2: rgba(10,31,43,.86); --rowhover: #113040; --recm-bg: rgba(52,20,22,.9); --scrim: rgba(2,10,14,.6);
}
:root[data-theme="navy"] {
  color-scheme: dark;
  --ink: #0A1430; --deep: #0E1A3B; --panel: #132248; --panel2: #182A56; --line: #233A6C; --line2: #304B84;
  --text: #EEF2FA; --soft: #C3CDE4; --muted: #8C9CC2; --faint: #5B6B92;
  --agent: #F5C33B; --agent-soft: rgba(245,195,59,.14); --on-agent: #1B1505;
  --hz-glow: #1A2D5E; --glass: rgba(19,34,72,.94); --glass2: rgba(14,26,59,.86); --rowhover: #172955; --recm-bg: rgba(60,22,26,.9); --scrim: rgba(3,8,22,.6);
}
:root[data-theme="paper"] {
  color-scheme: light;
  --ink: #F5F1E8; --deep: #FFFDF8; --panel: #FFFDF8; --panel2: #F0EBE0; --line: #E2DACB; --line2: #CDC3B1;
  --text: #2A241B; --soft: #4B4234; --muted: #786D5D; --faint: #A69B89;
  --demand: #2E62B8; --supply: #127F6C; --rec: #C2412D; --rec-soft: rgba(194,65,45,.10); --warn: #A36A00; --good: #2A8A4E;
  --agent: #1F6F8B; --agent-soft: rgba(31,111,139,.10); --on-agent: #FFFFFF;
  --hz-glow: #EAE1CF; --glass: rgba(255,253,248,.95); --glass2: rgba(255,253,248,.88); --rowhover: #F2ECDF; --recm-bg: #FBEDE8; --scrim: rgba(42,36,27,.3);
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 10.5px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.red { color: var(--rec); }

/* ── App frame */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { display: flex; align-items: center; gap: 20px; padding: 0 16px; min-height: 58px; border-bottom: 1px solid var(--line); background: var(--deep); position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 0; }
.brand-mark { width: 32px; height: 32px; flex-shrink: 0; }
.brand-name { font: 600 15px/1.1 var(--cond); letter-spacing: .02em; }
.brand-ctx { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 18px 12px 16px; border-radius: 6px; text-align: left; white-space: nowrap; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; }
.tab .stage { display: block; font: 600 9.5px/1 var(--cond); letter-spacing: .14em; color: var(--faint); margin-bottom: 4px; }
.tab .tname { font-weight: 500; color: var(--soft); }
.tab:hover .tname { color: var(--text); }
.tab[aria-selected="true"] { border-bottom-color: var(--agent); }
.tab[aria-selected="true"] .tname { color: var(--text); }
.tab[aria-selected="true"] .stage { color: var(--agent); }
.tab .badge { display: inline-block; margin-left: 6px; min-width: 18px; padding: 1px 5px; border-radius: 9px; background: var(--rec); color: #fff; font: 600 10.5px/1.4 var(--mono); text-align: center; }
.agent-pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line2); border-radius: 20px; background: var(--panel); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
.dot.live { background: var(--agent); box-shadow: 0 0 0 3px var(--agent-soft); animation: pulse 2.4s infinite; }
.dot.demo { background: var(--warn); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(183,167,255,0); } }

main.body { display: grid; grid-template-columns: 1fr var(--dock); min-height: 0; }
body.dock-closed main.body { grid-template-columns: 1fr 0; }
.views { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.view { position: absolute; inset: 0; overflow: auto; }
.view.pad { padding: 20px 20px 40px; }

/* ── Common UI */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--agent); border-color: var(--agent); color: var(--on-agent); }
.btn.primary:hover { background: #C9BDFF; }
.btn.danger { background: var(--rec); border-color: var(--rec); color: #fff; }
.btn.ghost { background: none; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 5px; font-size: 11.5px; border: 1px solid var(--line2); color: var(--soft); background: var(--panel); white-space: nowrap; }
.chip.rec { color: var(--rec); border-color: rgba(255,91,79,.45); background: var(--rec-soft); font-weight: 500; }
.chip.good { color: var(--good); border-color: rgba(94,211,154,.35); }
.chip.warn { color: var(--warn); border-color: rgba(243,179,76,.4); }
.chip.bad { color: var(--rec); border-color: rgba(255,91,79,.4); }
.chip.agent { color: var(--agent); border-color: rgba(183,167,255,.4); background: var(--agent-soft); }
.chip.new::after { content: 'NEW'; font: 700 9px/1 var(--cond); letter-spacing: .1em; color: var(--ink); background: var(--warn); padding: 2px 4px; border-radius: 3px; margin-left: 2px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font: 600 11px/1.5 var(--sans); white-space: nowrap; }
.pill.High { background: rgba(255,91,79,.16); color: var(--rec); }
.pill.Medium { background: rgba(243,179,76,.16); color: var(--warn); }
.pill.Low { background: rgba(94,211,154,.12); color: var(--good); }
.mkt { font-size: 12px; white-space: nowrap; }
.mkt::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; background: var(--faint); }
.mkt.Constrained::before { background: var(--rec); } .mkt.Tightening::before { background: var(--warn); } .mkt.Stable::before { background: var(--good); } .mkt.Surplus::before { background: var(--demand); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.section-title { font: 600 18px/1.25 var(--cond); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 70ch; margin: 4px 0 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .eyebrow { line-height: 1.3; }
.kpi .v { font: 500 24px/1.1 var(--mono); margin-top: 8px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 12px; font-size: 12.5px; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--text); box-shadow: inset 0 -2px 0 var(--agent); }
.field { background: var(--deep); border: 1px solid var(--line2); border-radius: 7px; padding: 7px 10px; font-size: 13px; }
.field:focus { border-color: var(--agent); outline: none; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--soft); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--agent); width: 15px; height: 15px; }

/* ── Horizon (3D corridor) */
#v-horizon { display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(120% 70% at 50% 36%, var(--hz-glow) 0%, var(--ink) 62%); }
#hz-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#hz-canvas.drag { cursor: grabbing; }
#hz-cards { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.hz-card { position: absolute; left: 0; top: 0; width: 250px; display: block; pointer-events: auto; transform-origin: 50% 50%; border-radius: 9px; padding: 11px 13px 12px; background: var(--glass); border: 1px solid var(--line2); box-shadow: 0 10px 30px rgba(0,0,0,.35); cursor: pointer; will-change: transform, opacity; text-align: left; color: var(--text); }
.hz-card:hover { border-color: var(--soft); }
.hz-card .k { display: flex; align-items: center; gap: 6px; font: 600 9.5px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hz-card .k i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--warn); }
.hz-card .t { font-weight: 600; font-size: 14px; line-height: 1.25; margin: 7px 0 4px; }
.hz-card .d { font-size: 12px; color: var(--soft); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hz-card.hzsig.bad .k i { background: var(--rec); }
.hz-card.hzsig.good .k i { background: var(--good); }
.hz-card.hzsig.neutral .k i { background: var(--demand); }
.hz-card.recm { border-color: rgba(255,91,79,.55); background: var(--recm-bg); }
.hz-card.recm .k { color: var(--rec); }
.hz-card.recm .k i { background: var(--rec); box-shadow: 0 0 10px var(--rec); }
.hz-card .pols { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
.hz-card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.hz-card .foot b { color: var(--rec); font: 500 12px var(--mono); }
.hz-card .newtag { margin-left: auto; font: 700 9px/1 var(--cond); letter-spacing: .1em; color: var(--ink); background: var(--warn); padding: 2px 5px; border-radius: 3px; }

.hz-top { position: relative; z-index: 3; flex-shrink: 0; padding: 14px 16px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px 24px; flex-wrap: wrap; background: var(--deep); border-bottom: 1px solid var(--line); }
.hz-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.hz-right { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; min-width: 0; }
.hz-lgd { border-collapse: collapse; font-size: 10.5px; color: var(--soft); }
.hz-lgd th { text-align: left; font: 600 9px/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 3px 12px 3px 0; white-space: nowrap; }
.hz-lgd td { padding: 2px 12px 2px 0; white-space: nowrap; }
.hz-lgd .lg { display: inline-flex; align-items: center; gap: 6px; }
.hz-lgd i { display: inline-block; flex-shrink: 0; }
.hz-lgd i.ln-dem, .hz-lgd i.ln-sup, .hz-lgd i.ln-gap, .hz-lgd i.ln-lane { width: 16px; height: 3px; border-radius: 2px; }
.hz-lgd i.ln-dem { background: var(--demand); } .hz-lgd i.ln-sup { background: var(--supply); } .hz-lgd i.ln-gap { background: var(--rec); height: 8px; opacity: .7; } .hz-lgd i.ln-lane { background: #F29BD0; opacity: .7; }
.hz-lgd i[class^="d-"] { width: 8px; height: 8px; border-radius: 50%; }
.hz-lgd i.d-dis { background: var(--rec); } .hz-lgd i.d-hol { background: var(--demand); } .hz-lgd i.d-dem { background: #F29BD0; } .hz-lgd i.d-life { background: var(--agent); } .hz-lgd i.d-tar { background: var(--warn); } .hz-lgd i.d-comp { background: #D5DCE6; } .hz-lgd i.d-price { background: var(--supply); }
.hz-title { max-width: 520px; min-width: 0; }
.hz-title h1 { margin: 0; font: 600 22px/1.1 var(--cond); letter-spacing: .01em; }
.hz-title p { margin: 4px 0 0; color: var(--soft); max-width: 62ch; font-size: 12.5px; }
.hz-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.hz-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--soft); margin-top: 10px; }
.hz-legend span { display: inline-flex; align-items: center; gap: 6px; }
.hz-legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.hz-kpis { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.hz-kpi { max-width: 290px; background: var(--glass2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; min-width: 118px; backdrop-filter: blur(6px); }
.hz-kpi .v { font: 500 20px/1.1 var(--mono); margin-top: 6px; font-variant-numeric: tabular-nums; }
.hz-kpi .v s { color: var(--faint); font-size: 14px; margin-right: 6px; }
.hz-kpi .s { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.hz-bottom { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 28px; display: flex; align-items: center; gap: 10px; }
.hz-strip { flex: 1; display: grid; grid-template-columns: repeat(var(--nw, 16), minmax(0, 1fr)); gap: 1px; position: relative; min-width: 0; }
.hz-strip button { border: 0; padding: 0; height: 30px; border-radius: 3px; position: relative; background: var(--good); opacity: .75; }
.hz-strip button span { position: absolute; left: 0; right: 0; top: 34px; font: 500 10px/1 var(--mono); color: var(--muted); text-align: center; }
.hz-strip button.amber { background: var(--warn); }
.hz-strip button.red { background: var(--rec); }
.hz-strip button.cur { opacity: 1; outline: 2px solid var(--text); outline-offset: 1px; }
.hz-strip button:hover { opacity: 1; }
.hz-nav { display: flex; gap: 4px; }
.hz-nav button { width: 34px; height: 30px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel); }
.hz-hint { position: absolute; z-index: 2; left: 50%; bottom: 76px; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); background: var(--glass2); padding: 5px 12px; border-radius: 12px; pointer-events: none; white-space: nowrap; }
.hz-pop { position: absolute; z-index: 5; width: 320px; max-width: calc(100% - 32px); padding: 14px 16px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.hz-pop h3 { margin: 6px 0 6px; font-size: 15px; }
.hz-pop p { margin: 0 0 10px; color: var(--soft); font-size: 12.5px; }
.hz-pop ul { list-style: none; margin: 0 0 12px; padding: 0; max-height: 180px; overflow: auto; }
.hz-pop li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.hz-pop li button { background: none; border: 0; color: var(--text); padding: 0; text-align: left; }
.hz-pop li button:hover { color: var(--agent); }
.hz-pop .x { position: absolute; right: 8px; top: 8px; background: none; border: 0; color: var(--muted); font-size: 18px; width: 28px; height: 28px; }

/* ── Plan */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 12px; }
.toolbar .grow { flex: 1; }
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--deep); max-height: calc(100vh - 250px); }
table.grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 12.5px; }
table.grid th, table.grid td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; }
table.grid thead th { position: sticky; top: 0; background: var(--panel); z-index: 3; font: 600 10.5px/1.2 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; }
table.grid thead th .dt { display: block; font: 400 10.5px var(--mono); letter-spacing: 0; color: var(--faint); text-transform: none; margin-top: 3px; }
table.grid th.l, table.grid td.l { text-align: left; }
table.grid .stick { position: sticky; left: 0; background: var(--deep); z-index: 2; }
table.grid thead .stick { z-index: 4; background: var(--panel); }
table.grid tbody tr.grp td { border-bottom: 0; }
table.grid tbody tr.grp-end td { border-bottom: 1px solid var(--line2); }
table.grid tbody tr:hover td { background: var(--rowhover); }
table.grid td.metric { color: var(--muted); text-align: left; font-size: 11.5px; }
table.grid td.v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--soft); }
table.grid td.v.neg { color: var(--rec); font-weight: 600; background: rgba(255,91,79,.08); }
table.grid td.v.adj { color: var(--rec); }
table.grid td.v.adj.up::before { content: '▲ '; font-size: 8px; vertical-align: 1px; }
table.grid td.v.adj.dn::before { content: '▼ '; font-size: 8px; vertical-align: 1px; }
table.grid td.v.ev { box-shadow: inset 0 -2px 0 var(--warn); }
.partcell { display: flex; flex-direction: column; gap: 2px; min-width: 170px; }
.partcell button { background: none; border: 0; padding: 0; font: 600 12.5px var(--mono); color: var(--text); text-align: left; }
.partcell button:hover { color: var(--agent); }
.partcell small { color: var(--muted); font-size: 11px; }
table.grid tr.cgrp td { background: var(--panel); }
table.grid tr.cgrp td.stick { background: var(--panel); }
.partcell .tog { font: 600 13px var(--sans); display: flex; align-items: center; gap: 4px; }
.partcell .tog .caret { display: inline-block; width: 14px; color: var(--muted); font-size: 11px; }
.recs { display: flex; flex-direction: column; gap: 2px; color: var(--rec); font-size: 12px; font-weight: 500; text-align: left; min-width: 190px; }
.recs span { white-space: normal; }
.recs .was { color: var(--faint); font-weight: 400; text-decoration: line-through; font-size: 11px; }
.recs .ok { color: var(--good); font-weight: 400; }
.chg { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
.rr { font-family: var(--mono); }
.rr small { font-size: 10.5px; margin-left: 4px; }
.rr small.dn { color: var(--rec); }
.rr small.rrg { display:block; margin-left:0; font-family: var(--sans, inherit); color: var(--muted); }
.rr small.rrg.Poor { color: var(--rec); } .rr small.rrg.Fair { color: var(--warn); } .rr small.rrg.Good { color: var(--good); }
.status-accepted { color: var(--agent); font-size: 12px; }
.why-btn { background: none; border: 1px solid rgba(183,167,255,.4); color: var(--agent); border-radius: 5px; padding: 3px 9px; font-size: 11.5px; }
.why-btn:hover { background: var(--agent-soft); }

/* ── Why drawer */
.drawer-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--deep); border-left: 1px solid var(--line2); z-index: 41; display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0,0,0,.4); animation: slidein .28s ease-out; }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
.drawer header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); position: relative; }
.drawer header h2 { margin: 6px 0 2px; font: 600 20px/1.2 var(--mono); }
.drawer header .x { position: absolute; right: 12px; top: 12px; background: none; border: 1px solid var(--line2); color: var(--soft); border-radius: 6px; width: 32px; height: 32px; font-size: 16px; }
.drawer .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.drawer .scroll { flex: 1; overflow: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 22px; }
.drawer footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel); }
.recbox { border: 1px solid rgba(255,91,79,.45); background: linear-gradient(180deg, rgba(255,91,79,.1), rgba(255,91,79,.03)); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.recbox .lbl { font: 600 10px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.recbox .val { color: var(--rec); font-weight: 600; font-size: 16px; margin-top: 6px; line-height: 1.3; }
.recbox .sub { font-size: 12px; color: var(--soft); margin-top: 4px; }
.recbox .was { font-size: 11.5px; color: var(--faint); margin-top: 6px; }
.why-sec h4 { margin: 0 0 10px; font: 600 10.5px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.siglist { display: flex; flex-direction: column; gap: 8px; }
.sig { display: grid; grid-template-columns: 86px 1fr; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
.sig .kind { font: 600 10px/1.3 var(--cond); letter-spacing: .12em; text-transform: uppercase; }
.sig.bad .kind { color: var(--rec); } .sig.good .kind { color: var(--good); } .sig.neutral .kind { color: var(--demand); }
.sig .src { display: block; color: var(--faint); font: 400 10.5px var(--sans); letter-spacing: 0; text-transform: none; margin-top: 4px; }
.sig b { font-size: 13px; font-weight: 600; }
.sig p { margin: 3px 0 0; color: var(--soft); font-size: 12.5px; }
.rules { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.rules td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.rules tr.pick td { background: rgba(255,91,79,.07); }
.rules tr.pick td:first-child { box-shadow: inset 3px 0 0 var(--rec); }
.rules .pn { font-weight: 600; white-space: nowrap; }
.rules tr.pick .pn { color: var(--rec); }
.rules .el { font: 600 11px var(--mono); white-space: nowrap; }
.rules .el.y { color: var(--good); } .rules .el.n { color: var(--faint); }
.rules .bar { width: 70px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
.rules .bar i { display: block; height: 100%; background: var(--soft); }
.rules tr.pick .bar i { background: var(--rec); }
.rules .rs { color: var(--soft); }
.agent-text { font: 400 16px/1.55 var(--serif); color: var(--text); background: var(--agent-soft); border: 1px solid rgba(183,167,255,.25); border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; min-height: 80px; }
.agent-text.thinking { color: var(--muted); font-style: italic; }
.agent-src { font-size: 11px; color: var(--muted); margin-top: 6px; }
.routes { display: flex; flex-direction: column; gap: 8px; }
.route { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.route .who { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
.av { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 11px var(--sans); color: var(--ink); flex-shrink: 0; }
.av.de { background: #9CC7FF; } .av.scm { background: #F3C77A; } .av.buyer { background: #7EE0C3; } .av.dp { background: #D9B7FF; } .av.ai { background: var(--agent); }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { fill: var(--faint); font: 10px var(--mono); }

/* ── Actions */
.lanes { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.lane { background: var(--deep); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 230px; display: flex; flex-direction: column; gap: 10px; }
.lane-h { display: flex; align-items: center; gap: 10px; }
.lane-h b { font-size: 13.5px; } .lane-h small { display: block; color: var(--muted); font-size: 11.5px; }
.lane-h .cnt { white-space: nowrap; margin-left: auto; font: 500 12px var(--mono); color: var(--muted); }
.act { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; display: flex; flex-direction: column; gap: 7px; }
.act.fresh { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { border-color: var(--agent); box-shadow: 0 0 0 3px var(--agent-soft); } }
.act .t { font-weight: 600; font-size: 13px; }
.act .p { font: 500 12px var(--mono); color: var(--soft); }
.act .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; font-size: 11.5px; color: var(--muted); }
.act .meta > span:nth-child(2) { white-space: nowrap; margin-right: auto; }
.st { font: 600 10.5px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; }
.st.Assigned { background: rgba(126,176,255,.15); color: var(--demand); }
.st.In-review { background: rgba(243,179,76,.15); color: var(--warn); }
.st.Approved { background: rgba(76,207,178,.15); color: var(--supply); }
.st.Done { background: rgba(94,211,154,.15); color: var(--good); }
.lane .empty { color: var(--faint); font-size: 12px; padding: 10px 2px; }
.feed { display: flex; flex-direction: column; }
.feed .ev { display: grid; grid-template-columns: 56px 28px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; align-items: start; }
.feed .ev time { font: 400 11px var(--mono); color: var(--faint); padding-top: 6px; }
.feed .ev p { margin: 0; color: var(--soft); }
.feed .ev p b { color: var(--text); font-weight: 600; }
.feed .ev.reassess p { color: var(--text); }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.routing-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.routing-table td { padding: 7px 6px; border-top: 1px solid var(--line); }
.routing-table select { width: 100%; }

/* ── Workflows */
.wf-grid { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.composer { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.composer textarea { width: 100%; min-height: 128px; resize: vertical; background: var(--deep); border: 1px solid var(--line2); border-radius: 8px; padding: 12px; font: 400 15px/1.5 var(--serif); }
.composer textarea:focus { border-color: var(--agent); outline: none; }
.examples { display: flex; flex-direction: column; gap: 6px; }
.examples button { text-align: left; background: var(--deep); border: 1px dashed var(--line2); border-radius: 7px; padding: 8px 10px; font-size: 12.5px; color: var(--soft); }
.examples button:hover { border-color: var(--agent); color: var(--text); }
.wf-card { padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
.wf-card h3 { margin: 4px 0 4px; font: 600 20px/1.2 var(--cond); }
.wf-card .sum { font: 400 15.5px/1.5 var(--serif); color: var(--soft); margin: 0; }
.trig { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.trig .t { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--deep); }
.trig .t .ty { font: 600 10px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--agent); }
.trig .t b { display: block; margin-top: 6px; font-size: 13px; }
.trig .t small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.pipe { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.pipe .s { position: relative; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--deep); font-size: 12.5px; color: var(--soft); }
.pipe .s .n { font: 600 10px/1 var(--cond); letter-spacing: .14em; color: var(--agent); display: block; margin-bottom: 6px; }
.pipe .s.run { background: var(--agent-soft); }
.pipe .s.done .n::after { content: ' ✓'; color: var(--good); }
.wf-list { display: flex; flex-direction: column; gap: 8px; }
.wf-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; }
.wf-item b { font-size: 13.5px; } .wf-item small { color: var(--muted); font-size: 12px; grid-column: 1; }
.wf-item .right { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 8px; }
.findings { display: flex; flex-direction: column; gap: 6px; }
.finding { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 12px; background: var(--deep); border: 1px solid var(--line); border-radius: 7px; font-size: 12.5px; align-items: center; }
.finding .mono { font-weight: 600; }
.refine { display: flex; gap: 8px; }
.refine input { flex: 1; min-width: 0; }

/* ── Scenarios */
.sc-grid { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.sc-panel { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { background: var(--deep); border: 1px solid var(--line2); border-radius: 16px; padding: 5px 11px; font-size: 12px; color: var(--soft); }
.presets button:hover, .presets button[aria-pressed="true"] { border-color: var(--agent); color: var(--text); background: var(--agent-soft); }
.param { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-size: 12.5px; }
.param label { color: var(--soft); }
.param output { font: 500 12px var(--mono); color: var(--text); }
.param input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--agent); }
.param select { grid-column: 1 / -1; }
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.cmp .kpi .v small { font-size: 12px; color: var(--muted); margin-left: 6px; }
.delta-up { color: var(--rec); } .delta-dn { color: var(--good); }

/* ── Agent dock */
aside.dock { border-left: 1px solid var(--line); background: var(--deep); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
body.dock-closed aside.dock { visibility: hidden; }
.dock-h { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.dock-h .glyph { width: 30px; height: 30px; border-radius: 8px; background: var(--agent-soft); border: 1px solid rgba(183,167,255,.35); display: grid; place-items: center; }
.dock-h b { font-size: 14px; } .dock-h small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
.dock-h small .dot { width: 7px; height: 7px; }
.dock-h .x { margin-left: auto; background: none; border: 1px solid var(--line2); border-radius: 6px; width: 30px; height: 30px; color: var(--soft); }
.feedwrap { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.msg.agent .body { font: 400 15px/1.55 var(--serif); color: var(--text); }
.msg.agent .body p { margin: 0 0 9px; }
.msg.agent .body ol { margin: 4px 0 10px; padding-left: 20px; }
.msg.agent .body li { margin-bottom: 8px; }
.msg.agent .body strong { font-weight: 600; color: var(--text); }
.msg .who { font: 600 10px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--agent); margin-bottom: 7px; display: flex; gap: 8px; align-items: center; }
.msg .who time { color: var(--faint); letter-spacing: 0; font: 400 10.5px var(--mono); }
.msg.user { align-self: flex-end; max-width: 88%; background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px 12px 3px 12px; padding: 9px 12px; font-size: 13.5px; }
.msg .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tool { font: 400 11.5px/1.4 var(--mono); color: var(--muted); padding: 6px 10px; border-left: 2px solid var(--agent); background: rgba(183,167,255,.05); border-radius: 0 5px 5px 0; }
.tool b { color: var(--agent); font-weight: 500; }
.typing::after { content: '▍'; animation: blink 1s steps(2) infinite; color: var(--agent); margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.dock-in { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.sugg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.sugg::-webkit-scrollbar { display: none; }
.sugg button { flex-shrink: 0; background: none; border: 1px solid var(--line2); color: var(--soft); border-radius: 14px; padding: 4px 10px; font-size: 11.5px; }
.sugg button:hover { border-color: var(--agent); color: var(--text); }
.dock-in form { display: flex; gap: 8px; align-items: flex-end; }
.dock-in textarea { flex: 1; min-width: 0; resize: none; height: 42px; max-height: 120px; background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; padding: 10px 12px; font-size: 13.5px; }
.dock-in textarea:focus { border-color: var(--agent); outline: none; }
.send { width: 42px; height: 42px; border-radius: 9px; border: 0; background: var(--agent); color: var(--on-agent); display: grid; place-items: center; flex-shrink: 0; }
.fab { display: none; }
body.dock-closed .hz-bottom { right: 130px; }
body.dock-closed .fab { display: flex; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 24px; background: var(--agent); color: var(--on-agent); border: 0; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--agent); color: var(--text); padding: 10px 16px; border-radius: 9px; z-index: 60; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100% - 32px); }

@media (max-width: 1100px) {
  :root { --dock: 340px; }
  .wf-grid, .sc-grid { grid-template-columns: 1fr; }
  .lanes { grid-template-columns: repeat(4, 240px); }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  header.top { flex-wrap: wrap; gap: 8px 12px; padding: 8px 16px 0; }
  nav.tabs { order: 3; flex-basis: 100%; }
  .brand-ctx { display: none; }
  main.body { grid-template-columns: 1fr !important; }
  aside.dock { position: fixed; left: 0; right: 0; bottom: 0; height: 72vh; z-index: 50; border-left: 0; border-top: 1px solid var(--line2); border-radius: 14px 14px 0 0; box-shadow: 0 -20px 60px rgba(0,0,0,.5); transition: transform .25s; padding-bottom: env(safe-area-inset-bottom, 0px); }
  body.dock-closed aside.dock { transform: translateY(105%); visibility: visible; }
  .fab { display: flex; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 24px; background: var(--agent); color: var(--on-agent); border: 0; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .view.pad { padding: 16px 16px 90px; }
  .twocol { grid-template-columns: 1fr; }
  .hz-kpis { display: none; }
  .hz-right { align-items: flex-start; } .hz-lgd-wrap, #hz-legend { overflow-x: auto; max-width: 100%; }
  .hz-title p { display: none; }
  .hz-card { width: 210px; }
  .recbox { grid-template-columns: 1fr; }
  .hz-strip button span { display: none; }
  .hz-bottom { bottom: 80px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.hz-card.k-dis .k i { background: var(--rec); }
.hz-card.k-hol .k i { background: var(--demand); }
.hz-card.k-life .k i { background: var(--agent); }
.hz-card.k-tar .k i { background: var(--warn); }
.hz-card.k-price .k i { background: var(--supply); }
.hz-card.k-dis { border-top: 2px solid var(--rec); } .hz-card.k-hol { border-top: 2px solid var(--demand); } .hz-card.k-life { border-top: 2px solid var(--agent); } .hz-card.k-tar { border-top: 2px solid var(--warn); } .hz-card.k-price { border-top: 2px solid var(--supply); }
.hz-legend .dotk::before { content: ''; width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--faint); }
.hz-legend .dotk.k-dis::before { background: var(--rec); } .hz-legend .dotk.k-hol::before { background: var(--demand); } .hz-legend .dotk.k-life::before { background: var(--agent); } .hz-legend .dotk.k-tar::before { background: var(--warn); } .hz-legend .dotk.k-price::before { background: var(--supply); }
.hz-card.k-comp .k i { background: #D5DCE6; } .hz-card.k-comp { border-top: 2px solid #D5DCE6; }
.hz-card.k-dem .k i { background: #F29BD0; } .hz-card.k-dem { border-top: 2px solid #F29BD0; }
.hz-legend .dotk.k-comp::before { background: #D5DCE6; } .hz-legend .dotk.k-dem::before { background: #F29BD0; border-radius: 2px; width: 12px; height: 4px; }
.hz-pop p b { font-weight: 600; color: var(--text); }

#hz-lgbtn { display: none; }
/* compact Roadmap: small laptops or when the agent panel is open */
#v-horizon .hz-top { padding: 8px 14px 8px; gap: 8px 16px; align-items: center; }

// ───────────────────────── Customer workspaces (multi-tenant) ─────────────────────────
// Each customer is a workspace holding one data workbook. The active customer's data becomes IMPORTED
// before anything else runs, so the whole app (engine, views, essie) works on that customer only.
// Two stores:
//   • Browser: workspaces kept in this browser's local storage (prototype / demos; nothing leaves the device).
//   • Hosted:  the self-hosted server injects window.__IP_HOSTED__ with the customer list and the active
//              customer's data; uploads go to the server in your cloud, behind your sign-on.
const DEMO_TENANT = { id: 'demo', name: 'Demo customer', builtIn: true };
const TENANT = (() => {
  const H = window.__IP_HOSTED__ || null;
  const mem = {}; // used when browser storage is unavailable
  let storeOK = true;
  try { const k = '__ip_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch (e) { storeOK = false; }
  const get = k => { try { return storeOK ? localStorage.getItem(k) : (mem[k] ?? null); } catch (e) { return mem[k] ?? null; } };
  const set = (k, v) => { if (!storeOK) { mem[k] = v; return; } localStorage.setItem(k, v); }; // may throw QuotaExceeded
  const del = k => { try { storeOK ? localStorage.removeItem(k) : delete mem[k]; } catch (e) { /* ignore */ } };

  const winGet = () => { try { const o = JSON.parse(window.name || '{}'); return o && o.__ip ? o : null; } catch (e) { return null; } };
  const meta = d => ({ product: d.product && d.product.name, parts: (d.parts || []).length, weeks: d.horizon, asof: d.asof });
  function list() {
    if (H) return [...(H.demo !== false ? [{ ...DEMO_TENANT, ...meta(DEMO_IMPORTED) }] : []), ...(H.tenants || []).map(t => ({ ...t }))];
    let l = []; try { l = JSON.parse(get('ip-tenants') || '[]'); } catch (e) { l = []; }
    const w = winGet(); if (w && !l.some(t => t.id === w.id)) l.push({ id: w.id, name: w.name, ...meta(w.data), uploadedAt: w.uploadedAt, temp: true });
    return [{ ...DEMO_TENANT, ...meta(DEMO_IMPORTED) }, ...l];
  }
  function activeId() {
    if (H) return H.active || 'demo';
    const q = new URLSearchParams(location.search).get('customer');

    return list().some(t => t.id === id) ? id : 'demo';
  }
  function data(id) {
    if (id === 'demo') return DEMO_IMPORTED;
    if (H) return H.data || DEMO_IMPORTED;

      if (!res.ok) throw new Error((await res.text()) || `Upload failed (${res.status})`);
      return (await res.json()).id;
    }

    const entry = { id: nid, name, ...meta(d), file: file || '', uploadedAt: now };

// ───────────────────────── Workbook import (browser) ─────────────────────────
// Reads a filled Intelligent Planning data workbook (.xlsx) and returns the same data object the
// prototype runs on (identical to import_xlsx.py). Needs SheetJS (window.XLSX), bundled with the app.
function importWorkbook(buf) {
  if (typeof XLSX === 'undefined') throw new Error('The workbook reader did not load.');
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  const notes = [];
  const need = ['Settings', 'Build Plan', 'Demand', 'Supply Plan', 'Parts'];
  const missing = need.filter(n => !wb.Sheets[n]);
  if (missing.length) throw new Error(`This does not look like the Intelligent Planning template: missing sheet${missing.length > 1 ? 's' : ''} ${missing.join(', ')}.`);
  const grid = name => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: false }) : [];
  const blank = v => v === null || v === undefined || v === '';
  const rows = (name, start = 2) => {
    const g = grid(name); if (!g.length) return [[], []];
    const hdr = (g[0] || []).map(c => blank(c) ? '' : String(c).trim());
    const out = [];
    for (const r of g.slice(start - 1)) { if (!r || !r.some(v => !blank(v))) continue; const o = {}; hdr.forEach((h, i) => { if (!(h in o)) o[h] = r[i] === undefined ? null : r[i]; }); out.push(o); }
    return [hdr, out];
  };
  const s = v => blank(v) ? '' : String(v).trim();
  const num = (v, d = 0) => { if (blank(v)) return d; const n = Number(v); return isFinite(n) ? n : d; };
  // Dates: Excel serial numbers (or Date objects) → UTC midnight
  const DAY = 864e5, EPOCH = Date.UTC(1899, 11, 30);
  const asDate = v => { if (v instanceof Date && !isNaN(v)) return Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()); if (typeof v === 'number' && v > 59 && v < 2958466) return EPOCH + Math.floor(v) * DAY; return null; };
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtD = t => { const d = new Date(t); return `${MN[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
  const fmtMD = t => { const d = new Date(t); return `${MN[d.getUTCMonth()]} ${d.getUTCDate()}`; };
  const COUNTRY = { 'Taiwan (Province of China)': 'Taiwan', 'Korea (Republic of)': 'South Korea', 'United States of America': 'United States', 'Viet Nam': 'Vietnam', 'United Kingdom of Great Britain and Northern Ireland': 'United Kingdom', 'China · Jiangsu': 'China' };
  const country = c => { c = s(c); return COUNTRY[c] || c; };
  const countries = v => s(v).split(/\s*[|;]\s*/).filter(x => s(x)).map(country);
  const uniq = a => [...new Set(a)];

  // Settings
  const settings = {}; for (const r of rows('Settings')[1]) settings[s(r.Field)] = r.Value;
  const start = asDate(settings['Plan start date (Monday)']) ?? Date.UTC(2026, 8, 28);

// Predicted direction for a part, combining the family dashboard and manufacturer notes
function partOutlook(part) {
  const fam = familyFor(part); const f = fam ? MW_FAMILY[fam] : null;
  const mi = MFR_INTEL.filter(x => x.re.test(part.mfr));
  const up = s => /increas|stretch|allocation/i.test(s || '');
  const price = (f && /^increasing$|allocation/i.test(f.price) ? 1 : 0) + mi.reduce((a, x) => a + (x.price > 0 ? 1 : 0), 0);
  const lt = (f && up(f.lt) ? 1 : 0) + mi.reduce((a, x) => a + (x.lt > 0 ? 1 : 0), 0);
  const inv = (f && /red/i.test(f.risk) ? -1 : 0) + mi.reduce((a, x) => a + (x.inv < 0 ? -1 : 0), 0);
  const notes = [...(f ? [[`${fam}: avg lead time ${f.avg ? f.avg + ' wks (' + f.range + ')' : 'n/a'}, lead time ${f.lt.toLowerCase()}, pricing ${f.price.toLowerCase()}, risk ${f.risk}. ${f.note}`, MW_SRC]] : []), ...mi.flatMap(x => x.notes)];
  return {
    family: fam, fam: f,
    price: price > 0 ? 'up' : 'flat', lt: lt > 0 ? 'up' : 'flat', inv: inv < 0 ? 'down' : 'flat',
    ltTrend: f ? f.lt : null, ltStrong: !!(f && /stretch|allocation/i.test(f.lt)) || mi.some(x => x.lt > 0),
    priceStrong: (f && /^increasing$/i.test(f.price) && mi.some(x => x.price > 0)) || false,
    openMarket: fam ? OM_FAMILY[fam] || null : null,
    notes,
  };
}

// ───────────────────────── Recommendation engine ─────────────────────────
// Deterministic rules (section 3 + 4 of the concept) produce repeatable,
// explainable recommendations. The AI layer synthesizes, prioritizes and explains.

const POLICY_SHORT = { 'Reduce inventory': 'Reduce stock', 'Open-market sourcing': 'Open market', 'Long Term Supply Agreement': 'LTSA', 'Life-time buy': 'LTB', 'Strategic buy': 'Buffer', 'Multi-source': 'Multi-source', 'Buffer': 'Buffer', 'MRP': 'MRP' };
const CONSTRAINED = s => s === 'Constrained' || s === 'Tightening';

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function makeWorld() {
  return { parts: makeParts(), commodities: clone(COMMODITIES), events: clone(EVENTS), build: BUILD_PLAN.slice(), demandPct: 0, label: 'Current plan' };
}

// Previous-week view of the world: used to detect recommendation changes
function prevWorld(w) {
  const p = clone(w);
  for (const k in p.commodities) { const c = p.commodities[k]; c.status = c.prev; c.lt = c.ltPrev; }
  p.events = p.events.filter(e => !e.isNew);
  for (const part of p.parts) {
    part.rr = part.rrPrev;
    if (part.crossNew) { part.crossesP2P -= 1; part.crossNew = false; if (!part.crossesP2P) part.bestCross = null; }
    if (part.pcn && part.pcn.isNew) { part.lifecycle = 'Active'; part.pcn = null; }
  }
  return p;
}

function eventImpact(world, part) {
  const imp = new Array(NWEEKS).fill(0); const hits = [];
  for (const e of world.events) {
    if (!(e.impact > 0)) continue; // price-only signals carry no supply loss
    const regs = e.regions || (e.region ? [e.region] : []);
    const match = regs.some(r => (part.countries || [part.region]).includes(r)) || (e.commodity && e.commodity === part.commodity);
    if (!match) continue;
    hits.push(e);
    for (let w = e.from; w < Math.min(NWEEKS, e.from + e.weeks); w++) imp[w] = Math.max(imp[w], e.impact);
  }
  return { imp, hits };
}

// ── Data layers. ERP data (demand, supply, inventory) is always present; the adders bring in
//    SiliconExpert (lifecycle, PCN, Resilience Rating, crosses, sites, price status, events),
//    Market Watch (lead-time / price / inventory predictions) and Arrow Insights (open market).
const ALL_LAYERS = { se: true, mw: true, cv: true };
const LAYER_NAME = { erp: 'ERP data', se: 'SiliconExpert', mw: 'Market Watch', cv: 'Arrow Insights' };
function ltbWeek(part) { const d = part.pcn && part.pcn.ltbDate ? new Date(part.pcn.ltbDate + ' UTC') : null; return d && !isNaN(d) ? Math.floor((d - WEEK0) / (7 * 864e5)) : null; }
// Risk-adjusted supply: expected loss on the committed supply plan from risks the signals point to.
// These risks are real whether or not the planner can see them; the data layers decide what is visible.
// Expected-loss assumptions (shown in the app's value panel)
const RISK_K = { obsolete: 0.6, ltb: 0.6, nrnd: 0.1, priceSharp: 0.1, price: 0.05, noStock: 0.06, mwRed: 0.06, mwMfr: 0.04, multi: 0.3, omCv: 0.5, omBlind: 0.85 };
function riskLoss(world, part, only) {
  const loss = new Array(NWEEKS).fill(0), reasons = [];
  if (world.planView) return { loss, reasons };
  const cats = world.riskCats; // Risk to Plan walk: limit the expected losses to these driver categories
  const apply = (from, to, frac, why, src, cat) => { if (!(frac > 0) || from >= NWEEKS || (only && !only.includes(src)) || (cats && !cats.includes(cat))) return; for (let w = Math.max(0, from); w < Math.min(NWEEKS, to); w++) loss[w] = 1 - (1 - loss[w]) * (1 - frac); reasons.push({ why, src, from: Math.max(0, from), frac }); };
  const lc = part.lifecycle;
  if (lc === 'Obsolete') apply(12, NWEEKS, RISK_K.obsolete, `Obsolete: ~${Math.round(RISK_K.obsolete * 100)}% of committed supply at risk after the backlog ships (~12 wks)`, 'se', 'lifecycle');
  if (lc === 'LTB') { const w = ltbWeek(part); if (w != null) apply(w + 4, NWEEKS, RISK_K.ltb, `Last-time buy: ~${Math.round(RISK_K.ltb * 100)}% of supply at risk after the LTB window (${part.pcn.ltbDate})`, 'se', 'lifecycle'); }
  if (lc === 'NRND') apply(26, NWEEKS, RISK_K.nrnd, `NRND: production declining (−${Math.round(RISK_K.nrnd * 100)}% from week 27)`, 'se', 'lifecycle');
  const mkt = world.commodities[part.commodity]; const pd = mkt && mkt.disp ? mkt.disp.toLowerCase() : '';
  if (pd === 'sharp increase') apply(8, NWEEKS, RISK_K.priceSharp, `Price sharp increase: allocation cuts (−${Math.round(RISK_K.priceSharp * 100)}% from week 9)`, 'se', 'price');
  else if (pd === 'increase') apply(8, NWEEKS, RISK_K.price, `Price increase: allocation tightening (−${Math.round(RISK_K.price * 100)}% from week 9)`, 'se', 'price');
  if ((part.ratings || {})['Inventory Rating'] === 'Poor') apply(4, NWEEKS, RISK_K.noStock, `No distributor stock: deliveries slip (−${Math.round(RISK_K.noStock * 100)}% from week 5)`, 'se', 'stock');
  for (const e of world.events) {
    if (!(e.impact > 0)) continue;
    const regs = e.regions || (e.region ? [e.region] : []);
    if (regs.some(r => (part.countries || [part.region]).includes(r)) || (e.commodity && e.commodity === part.commodity)) apply(e.from, e.from + e.weeks, e.impact, `${e.title}: ~${Math.round(e.impact * 100)}% supply loss`, e.kind === 'Scenario' ? 'scenario' : 'se', 'events');
  }
  const out = partOutlook(part);
  if (out.fam && /red/i.test(out.fam.risk)) apply(12, NWEEKS, RISK_K.mwRed, `${out.family}: Market Watch red risk (−${Math.round(RISK_K.mwRed * 100)}% from week 13)`, 'mw', 'market');
  if (MFR_INTEL.some(x => x.re.test(part.mfr) && x.inv < 0)) apply(12, NWEEKS, RISK_K.mwMfr, `${part.mfr}: allocation / order controls (−${Math.round(RISK_K.mwMfr * 100)}% from week 13)`, 'mw', 'market');
  return { loss, reasons };
}

function adjustedDemand(part, mkt, dem) {
  const avg = dem.reduce((a, b) => a + b, 0) / NWEEKS;
  const out = dem.slice(); let dir = null, qty = 0;
  if (mkt && CONSTRAINED(mkt.status)) {
    dir = 'pull';
    const ltDelta = Math.max(2, (mkt.lt || 0) - (mkt.ltPrev || 0));
    qty = Math.round(avg * Math.min(4, ltDelta / 2) * 0.5);
    for (let w = 0; w < 4; w++) out[w] += Math.round(qty / 4);
    for (let w = 8; w < Math.min(16, NWEEKS); w++) out[w] -= Math.round(qty / 8);
  } else if (mkt && mkt.status === 'Surplus') {
    dir = 'push';
    qty = Math.round(dem.slice(0, 4).reduce((a, b) => a + b, 0) * 0.25);
    for (let w = 0; w < 4; w++) out[w] -= Math.round(qty / 4);
    for (let w = 8; w < 12; w++) out[w] += Math.round(qty / 4);
  }
  return { out, dir, qty };
}

function evaluatePart(world, part) {
  const mkt = world.commodities[part.commodity];
  const a = part.applied || {};
  const dmult = 1 + (world.demandPct || 0) / 100;
  const baseDemand = part.demand.map(d => Math.round(d * dmult));
  const adj = adjustedDemand(part, mkt, baseDemand);
  const demand = a.forecast ? adj.out : baseDemand;
  const L = world.layers || ALL_LAYERS;
  const { hits } = eventImpact(world, part);
  const risk = riskLoss(world, part); const imp = risk.loss;
  const sources = a.multi ? Math.max(2, part.sources) : part.sources;
  const sole = sources === 1;
  // Multi-sourcing: a pin-to-pin cross qualifies in ~4 wks; a redesign onto a non pin-to-pin cross takes ~20 wks
  const qualWk = part.crossesP2P > 0 || part.sources > 1 ? 4 : 20;
  const mitigW = w => (a.multi && w >= qualWk ? RISK_K.multi : 1) * (a.openMarket ? (L.cv ? RISK_K.omCv : RISK_K.omBlind) : 1);
  const boost = world.boost && world.boost.pct && (world.boost.commodity === 'all' || world.boost.commodity === part.commodity) ? world.boost.pct / 100 : 0;
  const smult = dmult > 1 && mkt && CONSTRAINED(mkt.status) ? 1 + (dmult - 1) * 0.5 : dmult;
  const supply = part.supplyPlan.map((s, w) => Math.round(s * smult * (1 - imp[w] * mitigW(w)) * (w >= 2 ? 1 + boost : 1)));
  const avgD = avgOf(baseDemand);
  const onHand = a.release ? Math.min(part.onHand, Math.round(avgD * (a.releaseWks || 8))) : part.onHand;
  let inv = onHand + Math.round((world.bufferWeeks || 0) * avgD) + (a.buffer ? Math.round(avgD * (a.bufferWks || 3)) : 0) + (a.strategic ? Math.round(avgD * (a.strategicWks || 6)) : 0) + (a.ltb ? Math.round(avgOf(baseDemand) * 20) : 0) + (a.openMarket ? Math.round(avgD * (a.omWks || 2)) : 0);
  const startInv = inv;
  const balance = [], short = [];
  for (let w = 0; w < NWEEKS; w++) {
    const avail = inv + supply[w]; const use = Math.min(avail, demand[w]);
    short.push(demand[w] - use); inv = avail - use; balance.push(inv - short[w]);
  }
  const shortUnits = short.reduce((a, b) => a + b, 0);
  const avg = avgOf(baseDemand);
  const minBal = Math.min(...balance);
  const invRisk = shortUnits > 0 ? 'High' : minBal < avg * 0.5 ? 'Medium' : 'Low';
  const mktStatus = mkt ? mkt.status : null;
  const mktConstraint = CONSTRAINED(mktStatus);
  const geo = hits.length > 0;
  const rrDrop = (part.rrPrev || part.rr) - part.rr;
  const ltb = part.lifecycle === 'LTB' || part.lifecycle === 'Obsolete';
  const obsolete = part.lifecycle === 'Obsolete';
  const diversifiable = sources >= 2 || part.crossesP2P > 0;
  const annualSpend = avg * 52 * part.price;
  const ltDelta = mkt && mkt.lt != null ? mkt.lt - mkt.ltPrev : 0;

  // ERP view: does the committed plan itself show a shortage? (what MRP alone sees)
  let pinv = part.onHand, planShort = false;
  for (let w = 0; w < NWEEKS; w++) { pinv += part.supplyPlan[w] - baseDemand[w]; if (pinv < 0) { planShort = true; break; } }
  const cover = avgD > 0 ? part.onHand / avgD : 99;
  // Expected supply loss the planner can SEE with the data layers switched on (sizes buffers / stockpiles)
  const vis = riskLoss(world, part, ['scenario', ...['se', 'mw'].filter(k => L[k])]).loss;
  const visLoss = part.supplyPlan.reduce((t, sp, w) => t + sp * smult * vis[w], 0);
  const lossWks = avgD > 0 ? Math.min(26, Math.ceil(visLoss / avgD)) : 0;
  // ── Plan For Every Part: decision tree (Recommendations criteria, "Updated" sheet)
  const tree = decisionTree(world, part, { mkt, hits, sources, a, L, planShort, cover });
  const covered = (a.multi || a.buffer || a.strategic || a.ltb || a.openMarket || a.release) && invRisk === 'Low';
  const cands = []; const byPol = {};
  for (const d of tree.drivers) if (d.fired) for (const act of d.actions) {
    const c = byPol[act.policy] || (byPol[act.policy] = { policy: act.policy, eligible: true, score: 0, why: '', drivers: [], actions: [] });
    c.score += (d.urgent ? 40 : 15) + (act.special ? 60 : 0); c.drivers.push(d.driver); if (!c.actions.includes(act.text)) c.actions.push(act.text);
    if (act.weeks) c.weeks = Math.max(c.weeks || 0, act.weeks);
  }
  // Size buffers / stockpiles to the visible expected loss (data-driven, not a flat rule of thumb)
  if (byPol.Buffer && L.se && lossWks > (byPol.Buffer.weeks || 0)) { byPol.Buffer.weeks = lossWks; byPol.Buffer.actions = byPol.Buffer.actions.map(t => t.replace(/\(\d+ wks?\)/, `(${lossWks} wks, sized to expected supply loss)`)); }
  let stockpileSkipped = null;
  if (byPol['Strategic buy']) {
    const wk = Math.max(4, lossWks);
    if (cover >= wk + 5 && !planShort) { stockpileSkipped = `On-hand cover is ${Math.round(cover)} wks, enough to ride out the predicted tightening: no stockpile needed`; delete byPol['Strategic buy']; }
    else { byPol['Strategic buy'].weeks = wk; byPol['Strategic buy'].actions = byPol['Strategic buy'].actions.map(t => t === 'Stockpile' ? `Stockpile (${wk} wks)` : t); }
  }
  // Arrow Insights: open-market bridge buys for parts with no distributor stock or no production, while alternates qualify
  if (L.cv && (planShort || (L.se && (tree.stock0 || /Obsolete|LTB/.test(part.lifecycle)))) && (lossWks > 0 || planShort) && !byPol['Open-market sourcing']) byPol['Open-market sourcing'] = { policy: 'Open-market sourcing', eligible: true, score: 45, why: '', drivers: ['Open-market bridge (Arrow Insights)'], actions: [`Open-market bridge buy via Arrow Insights (${Math.max(2, Math.round(0.5 * Math.min(lossWks, qualWk)))} wks)${planShort && !L.se ? ' to close the gap in the committed plan' : ' while alternates qualify'}`], weeks: Math.max(2, Math.round(0.5 * Math.min(lossWks, qualWk))) };
  if (byPol['Open-market sourcing'] && byPol['Open-market sourcing'].weeks == null) byPol['Open-market sourcing'].weeks = L.cv ? Math.max(2, lossWks) : 2;
  // Inventory-aware buffers: skip a buffer the on-hand cover already exceeds (avoids unneeded stock)

function mdToHtml(md) {

  let out = '', inList = false, para = [];
  const flush = () => { if (para.length) { out += `<p>${para.join(' ')}</p>`; para = []; } };
  for (const ln of lines) {
    const m = ln.match(/^\s*(\d+)[.)]\s+(.*)/) || ln.match(/^\s*[-•]\s+(.*)/);
    if (m) { flush(); if (!inList) { out += '<ol>'; inList = true; } out += `<li>${m[2] ?? m[1]}</li>`; continue; }

}

// ── Render loop
function hzFrame() {
  HZ.raf = 0;
  if (S.view !== 'horizon' || !HZ.w) return;
  const d = HZ.camT - HZ.cam;
  HZ.cam += d * 0.09;
  if (Math.abs(d) < 0.0008) HZ.cam = HZ.camT;
  drawHorizon();
  if (HZ.cam !== HZ.camT) HZ.raf = requestAnimationFrame(hzFrame);

    if (dz > 34) op = Math.min(op, Math.max(0, (52 - dz) / 18));
    if (op <= 0.01 || dz <= 0) { c.el.style.opacity = 0; c.el.style.visibility = 'hidden'; continue; }
    c.el.style.visibility = 'visible';
    const cw = c.el.offsetWidth, ch = c.el.offsetHeight;
    c.el.style.opacity = op.toFixed(3);
    c.el.style.transform = `translate(${(sx - cw / 2).toFixed(1)}px, ${(sy - ch / 2).toFixed(1)}px) scale(${Math.min(HZ.compact ? 0.82 : 1.0, sc * (HZ.compact ? 0.85 : 1)).toFixed(3)})`;
    c.el.style.zIndex = String(1000 - Math.round(dz));
    c.el.tabIndex = op > 0.5 ? 0 : -1; c.el.style.pointerEvents = op > 0.3 ? 'auto' : 'none';
  }
  // strip "current" marker
  const cur = Math.max(0, Math.min(NWEEKS - 1, Math.round(HZ.cam + CAM_OFF)));
  $$('#hz-strip button').forEach((b, i) => b.classList.toggle('cur', i === cur));
}

// ───────────────────────── Plan: Intelligent Plan (forecast) + Plan For Every Part (supply policy) ─────────────────────────
// Intelligent Plan = planner view: market-adjusted forecast recommendation only.
// Plan For Every Part = procurement view: supply / replenishment policy only.
const kfmt = n => { const a = Math.abs(n); return a >= 10000 ? (n / 1000).toFixed(0) + 'K' : a >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(Math.round(n)); };
// First run (no prior-week data): "changed" means the part needs action
const fcChanged = r => HAS_HISTORY ? lastRec(r.part.id).forecast !== r.forecast : (r.forecast || '').startsWith('Adjust');
const polChanged = r => HAS_HISTORY ? lastRec(r.part.id).policies.join('|') !== r.policies.join('|') : r.primary !== 'MRP';
const wasFc = r => HAS_HISTORY ? lastRec(r.part.id).forecast : undefined;
const modeChanged = r => (S.plan.mode === 'grid' ? fcChanged(r) : polChanged(r));
const fcPriority = r => ({ 'Adjust forecast (pull)': 3, 'Adjust forecast (push)': 2, 'Hold forecast': 1 }[r.forecast] || 0);

function planRows() {
  const f = S.plan;
  return S.comp.results.filter(r => (!f.ids || f.ids.includes(r.part.id)) && (!f.changedOnly || modeChanged(r)))
    .sort((a, b) => f.mode === 'grid' ? (fcChanged(b) - fcChanged(a)) || (fcPriority(b) - fcPriority(a)) || (priority(b) - priority(a)) : priority(b) - priority(a));
}
function planGroups(rows) {
  const g = {};
  for (const r of rows) (g[r.part.commodity] = g[r.part.commodity] || []).push(r);
  const order = k => { const c = COMMODITIES[k]; return (c.status !== c.prev ? 100 : 0) + ({ Constrained: 4, Tightening: 3, Surplus: 2, Stable: 1 }[c.status] || 0); };
  return Object.entries(g).sort((a, b) => order(b[0]) - order(a[0]) || b[1].length - a[1].length);
}
function forecastHtml(fc, was) {
  const main = fc ? (fc.startsWith('Adjust') ? `<span>${esc(fc)}</span>` : `<span class="ok">${esc(fc)}</span>`) : !S.layers.se ? '<span class="muted" title="Forecast insight needs price status from SiliconExpert">— needs market data</span>' : '<span class="ok" title="No market intelligence for this commodity">— no market data</span>';
  return `<div class="recs">${main}${was !== undefined && was !== fc ? `<span class="was">${esc(was || 'No recommendation')}</span>` : ''}</div>`;
}
const SRC_TAG = { erp: 'ERP', se: 'SE', mw: 'MW', cv: 'CI' };
const SRC_FULL = { erp: 'Raw Plan', se: 'SiliconExpert', mw: 'Market Watch', cv: 'Arrow Insights' };
function informedBy(r) {
  const s = new Set();

  if (r.policies.includes('Open-market sourcing') && S.layers.cv) s.add('cv');
  if (r.policies.includes('Reduce inventory') || r.bufferSkipped) s.add('se');
  if (!s.size) s.add('erp');
  return ['erp', 'se', 'mw', 'cv'].filter(k => s.has(k));
}
function srcChips(r) { return `<div class="srcchips">${informedBy(r).map(k => k === 'se' && BRAND && BRAND.se ? `<span class="sc se logo" title="Informed by SiliconExpert"><img src="${BRAND.se}" alt="SiliconExpert"></span>` : `<span class="sc ${k}" title="Informed by ${SRC_FULL[k]}">${SRC_TAG[k]}</span>`).join('')}</div>`; }
function srcBanner() {
  const v = S.value; if (!v) return '';
  const mask = layerMask(), cur = v.combos[mask];

  const unlock = miss.map(k => { const m = mask | { se: 1, mw: 2, cv: 4 }[k]; const c = v.combos[m]; const n = c.comp.results.filter(r => curMap[r.part.id] !== recKey(r)).length; const dp = c.resolved - cur.resolved; return `<button class="why-btn" data-addsrc="${k}">+ ${ADDER_LABEL[k]}</button> changes ${n} recommendation${n === 1 ? '' : 's'}${dp > 0 ? `, protects ${dp} more at-risk part${dp === 1 ? '' : 's'}` : ''} (on time ${cur.otd}% → ${c.otd}%)`; });
  return `<div class="srcbanner"><span class="muted">Recommendations use</span> ${['erp', ...ADDERS].map(k => `<span class="sc ${k} ${k === 'erp' || S.layers[k] ? '' : 'off'}">${SRC_FULL[k]}</span>`).join(' ')}${miss.length ? `<span class="sep">·</span>${unlock.join('<span class="sep">·</span>')}` : ''}</div>`;

function policyHtml(r) {

function statusHtml(r) {

}
function mktLine(c) { if (!S.layers.se) return SE_LOCK('Price status: SiliconExpert'); return c.status ? `<span class="mkt ${c.status}" title="Price status (now)">Price: ${esc(mstat(c))}</span>${c.lt != null ? ` <small class="muted">· LT ${c.ltPrev === c.lt ? c.lt : c.ltPrev + '→' + c.lt} wks</small>` : ''}` : '<span class="mkt" title="No market intelligence for this classification">No market data</span>'; }
function lcChip(lc) { return `<span class="lc ${/LTB|Obsolete/.test(lc) ? 'bad' : lc !== 'Active' ? 'warn' : ''}">${esc(lc)}</span>`; }
const SE_LOCK = (what = 'SiliconExpert') => `<span class="lockcell" title="Add ${what} data to see this">${what}</span>`;

const LC_CLS = lc => /LTB|Obsolete/.test(lc) ? 'bad' : lc !== 'Active' ? 'warn' : 'ok';
function priceFact(c) {

// Forecast insight as the first row of the facts list: "Forecast  Adjust (pull)"
const FC_SHORT = fc => fc ? fc.replace(/^Adjust forecast/, 'Adjust').replace(/^Hold forecast$/, 'Hold') : fc;
function forecastFact(fc, was) {

function rrLevel(p) { return { Poor: ['Low', 'rrL'], Fair: ['Medium', 'rrM'], Good: ['High', 'rrH'] }[p.rrGrade] || null; }
function rrPill(p) { if (!S.layers.se) return SE_LOCK('SE'); const l = rrLevel(p); return l ? `<span class="pill ${l[1]}" title="Resilience Rating ${esc(p.rrGrade)} · score ${p.rr ?? '—'}">${l[0]}</span>` : '<span class="muted">—</span>'; }

// ── Intelligent Plan: forecast recommendation + Demand / Supply / Projected balance
function weekHead() { return WEEKS.map(w => `<th>${w.label}<span class="dt">${w.date}</span></th>`).join(''); }
function metricRows(lines, lead) {
  const n = lines.length;
  return lines.map((ln, i) => `<tr class="${ln.cls || ''} ${i === n - 1 ? 'grp-end' : 'grp'}">${i === 0 ? lead(n) : ''}<td class="metric">${ln.name}</td>${ln.vals.map(v => `<td class="v ${ln.neg && v < 0 ? 'neg' : ln.neg && v > 0 ? 'pos' : ''}">${kfmt(v)}</td>`).join('')}</tr>`).join('');
}
function partLines(r) { return [{ name: 'Demand', vals: r.demand }, { name: 'Supply', vals: r.supply }, { name: 'Balance', vals: r.balance, neg: true }]; }
function ipPartRows(r, nested) {
  return metricRows(partLines(r), n => `
    <td class="l stick" rowspan="${n}"><div class="partcell" style="${nested ? 'padding-left:18px' : ''}"><button data-why="${r.part.id}">${esc(r.part.mpn)}</button><small>${seBadge(true)} ${esc(r.part.mfr)}</small>${nested ? '' : `<small>${esc(COMMODITIES[r.part.commodity].name)}</small>`}</div></td>
    <td class="l" rowspan="${n}">${insightFacts(r, forecastFact(r.forecast, wasFc(r)))}<div style="margin-top:6px"><button class="why-btn" data-why="${r.part.id}">Gameplan</button></div></td>
    <td rowspan="${n}" class="v">${kfmt(r.part.onHand)}</td>`);
}
function ipTable(rows) {
  if (!rows.length) return `<p class="muted" style="padding:20px">No parts match.</p>`;
  const head = `<thead><tr><th class="l stick">${S.plan.group === 'commodity' ? 'Commodity · part' : 'Part'}</th><th class="l">Forecast insight</th><th>Inv.</th><th class="l">Plan</th>${weekHead()}</tr></thead>`;
  if (S.plan.group === 'part') return `<table class="grid">${head}<tbody>${rows.map(r => ipPartRows(r, false)).join('')}</tbody></table>`;
  const body = planGroups(rows).map(([k, list]) => {
    const c = COMMODITIES[k]; const r0 = list[0]; const open = !!S.plan.open[k];
    const sum = key => WEEKS.map((_, w) => list.reduce((s, r) => s + r[key][w], 0));
    const inv = list.reduce((s, r) => s + r.part.onHand, 0);
    const head = metricRows([{ name: 'Demand', vals: sum('demand'), cls: 'cgrp' }, { name: 'Supply', vals: sum('supply'), cls: 'cgrp' }, { name: 'Balance', vals: sum('balance'), neg: true, cls: 'cgrp' }], n => `
      <td class="l stick" rowspan="${n}"><div class="partcell"><button class="tog" data-tog="${k}" aria-expanded="${open}"><span class="caret">${open ? '▾' : '▸'}</span>${esc(c.name)}</button><small>${list.length} part${list.length > 1 ? 's' : ''}</small></div></td>
      <td class="l" rowspan="${n}">${groupFacts(list, c, forecastFact(r0.forecast, wasFc(r0)))}<div style="margin-top:6px"><button class="why-btn" data-cwhy="${k}">Gameplan</button></div></td>
      <td rowspan="${n}" class="v">${kfmt(inv)}</td>`);

// ── Plan For Every Part: supply / replenishment policy per part
// Five SiliconExpert Resilience Rating factors, in place of the composite rating (Poor = red, Fair = amber, Good = green)
const RISK_KEYS = [['Lifecycle Rating', 'Lifecycle'], ['Price Rating', 'Price'], ['Inventory Rating', 'Inventory'], ['Lead Time Rating', 'Lead time'], ['Multisourcing Rating', 'Multi-source']];
const LVL = { Poor: 'High', Fair: 'Medium', Good: 'Low' };
const RANK = { Poor: 3, Fair: 2, Good: 1 };
function riskFactors(r) {
  const p = r.part, m = r.mkt, out = {};
  const ctx = {
    'Lifecycle Rating': `${p.lifecycle}${p.yearsToEol != null ? ` · ${p.yearsToEol} years to end of life` : ''}${p.pcn && p.pcn.ltbDate ? ` · last-time buy by ${p.pcn.ltbDate}` : ''}`,
    'Price Rating': m && m.status ? `Commodity price status: ${mstat(m)}` : 'No commodity price status',
    'Inventory Rating': r.invRisk === 'High' ? `Projected shortage from ${WEEKS[r.firstShortWeek].label}` : 'Supply plan covers demand',
    'Lead Time Rating': `Manufacturer lead time rating: ${p.ratings['Manufacturer Lead Time Rating'] || '—'}${r.hits.length ? ' · event exposure' : ''}`,
    'Multisourcing Rating': r.sources >= 2 ? `1 + ${p.otherSources} other approved source${p.otherSources > 1 ? 's' : ''}` : p.crossesP2P ? `Sole source · ${p.crossesP2P} pin-to-pin active cross${p.crossesP2P > 1 ? 'es' : ''}` : `Sole source · ${p.crossesTotal} crosses, none pin-to-pin`,
  };
  for (const [k] of RISK_KEYS) { const v = p.ratings[k]; out[k] = RANK[v] ? [v, `${k}: ${v} · ${ctx[k]}`] : [null, `${k}: ${v || 'not rated'} · ${ctx[k]}`]; }
  return out;
}
function riskPill([lvl, tip]) {
  if (!S.layers.se) return SE_LOCK('SE'); return lvl ? `<span class="pill ${LVL[lvl]}" title="${esc(tip)}">${lvl}</span>` : `<span class="muted" title="${esc(tip)}">—</span>`; }
function spend(r) { return r.demand.reduce((a, b) => a + b, 0) * r.part.price; }

function pfepRow(r, nested) {
  const rf = riskFactors(r);
  return `<tr class="grp-end">
    <td class="l stick"><div class="partcell" style="${nested ? 'padding-left:18px' : ''}"><button data-why="${r.part.id}">${esc(r.part.mpn)}</button><small>${seBadge(true)} ${esc(r.part.mfr)}</small></div></td>
    ${S.plan.group === 'commodity' ? '' : `<td class="l cm">${esc(COMMODITIES[r.part.commodity].name)}</td>`}
    <td class="v">${money(spend(r))}</td>
    <td class="l">${rrPill(r.part)}</td>
    ${RISK_KEYS.map(([k]) => `<td class="l">${riskPill(rf[k])}</td>`).join('')}
    <td class="l">${policyHtml(r)}</td>
    <td><button class="why-btn" data-why="${r.part.id}">Gameplan</button></td></tr>`;
}
function pfepTable(rows) {
  if (!rows.length) return `<p class="muted" style="padding:20px">No parts match.</p>`;
  const byC = S.plan.group === 'commodity';
  const head = `<thead><tr><th class="l stick">${byC ? 'Commodity · part' : 'Part'}</th>${byC ? '' : '<th class="l">Commodity</th>'}<th title="Forecasted demand × unit price over ${NWEEKS} weeks">Forecasted spend</th><th class="l" title="SiliconExpert Resilience Rating: Low (Poor), Medium (Fair), High (Good)">Resilience Rating</th>${RISK_KEYS.map(([k, n]) => `<th class="l" title="SiliconExpert ${k}">${n}</th>`).join('')}<th class="l">Recommended policy</th><th></th></tr></thead>`;
  if (!byC) return `<table class="grid">${head}<tbody>${rows.map(r => pfepRow(r, false)).join('')}</tbody></table>`;
  const body = planGroups(rows).map(([k, list]) => {
    const c = COMMODITIES[k]; const open = S.plan.openP[k] !== false;
    const mix = {}; for (const r of list) for (const p of r.policies) mix[p] = (mix[p] || 0) + 1;
    const worst = key => { const lv = list.map(r => riskFactors(r)[key]).filter(x => x[0]).sort((a, b) => RANK[b[0]] - RANK[a[0]]); if (!lv.length) return riskPill([null, 'No data']); const n = lv.filter(x => x[0] === lv[0][0]).length; return `${riskPill([lv[0][0], `Worst in group: ${lv[0][1]}`])}${list.length > 1 ? ` <small class="muted">${n}/${list.length}</small>` : ''}`; };
    return `<tr class="cgrp grp-end"><td class="l stick"><div class="partcell"><button class="tog" data-tog="${k}" aria-expanded="${!!open}"><span class="caret">${open ? '▾' : '▸'}</span>${esc(c.name)}</button><small>${list.length} part${list.length > 1 ? 's' : ''}</small></div></td>
      <td class="v">${money(list.reduce((s2, r) => s2 + spend(r), 0))}</td>
      <td class="l">${(() => { const w = list.slice().sort((a, b) => (RANK[b.part.rrGrade] || 0) - (RANK[a.part.rrGrade] || 0))[0]; const n = list.filter(r => r.part.rrGrade === w.part.rrGrade).length; return rrPill(w.part) + (list.length > 1 ? ` <small class="muted">${n}/${list.length}</small>` : ''); })()}</td>
      ${RISK_KEYS.map(([key]) => `<td class="l">${worst(key)}${key === 'Price Rating' && S.layers.se && c.status ? `<div class="pzline"><span class="pz ${c.status}">${esc(mstat(c))}</span></div>` : ''}</td>`).join('')}
      <td class="l"><div class="recs">${Object.entries(mix).sort((a, b) => b[1] - a[1]).map(([p, n]) => `<span>${n} × ${esc(shortPolicy(p))}</span>`).join('')}</div></td><td></td></tr>` + (open ? list.map(r => pfepRow(r, true)).join('') : '');
  }).join('');
  return `<table class="grid">${head}<tbody>${body}</tbody></table>`;
}

// Header chips mirror the insights in the Plan view the drawer was opened from:
// Intelligent Plan -> the Forecast insight rows; Plan For Every Part -> Resilience Rating + the five risk factors
function whyChips(r, mode) {
  const chip = (cls, label, val, tip) => `<span class="chip ${cls}"${tip ? ` title="${esc(tip)}"` : ''}>${label}: ${esc(val)}</span>`;
  const tone = g => g === 'Poor' ? 'bad' : g === 'Fair' ? 'warn' : g === 'Good' ? 'good' : '';
  if (!S.layers.se) return `${chip(r.forecast && r.forecast.startsWith('Adjust') ? 'bad' : '', 'Forecast', FC_SHORT(r.forecast) || 'Needs market data')}<span class="chip muted">Add SiliconExpert for price, lifecycle and resilience</span>`;
  if (mode === 'sum') {
    const rl = rrLevel(r.part); const rf = riskFactors(r);
    return chip(tone(r.part.rrGrade), 'Resilience Rating', rl ? rl[0] : '—') + RISK_KEYS.map(([k, n]) => chip(tone(rf[k][0]), n, rf[k][0] || 'No data', rf[k][1])).join('');
  }
  const m = r.mkt;
  return chip(r.forecast && r.forecast.startsWith('Adjust') ? 'bad' : r.forecast ? 'good' : '', 'Forecast', FC_SHORT(r.forecast) || 'No market data')
    + chip(m && CONSTRAINED(m.status) ? 'bad' : m && m.status === 'Surplus' ? 'good' : '', 'Price', m && m.status ? mstat(m) : 'No market data')
    + chip(['Obsolete', 'LTB'].includes(r.part.lifecycle) ? 'bad' : r.part.lifecycle !== 'Active' ? 'warn' : '', 'Lifecycle', r.part.lifecycle)

}

// The few reasons that matter: drivers that fired, urgent first
function whyBullets(r) {
  const f = (r.tree ? r.tree.drivers : []).filter(d => d.fired).sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0));
  if (!f.length) return '<p class="muted" style="margin:0">No risk driver fired: the part stays on MRP.</p>';
  const seen = new Set(), top = f.filter(d => !seen.has(d.driver) && seen.add(d.driver)).slice(0, 3);
  return `<ul class="why-list">${top.map(d => `<li><b>${esc(d.driver)}</b>${d.urgent ? ' <span class="chip bad" style="padding:0 5px;font-size:10px">Urgent</span>' : ''}<span>${esc(d.basis || '')}</span></li>`).join('')}</ul>${f.length > top.length ? `<p class="muted" style="font-size:12px;margin:4px 0 0">${f.length - top.length} more in the decision tree below.</p>` : ''}`;
}
function treeHtml(r) {
  const t = r.tree; if (!t) return '';
  const fired = t.drivers.filter(d => d.fired), quiet = t.drivers.filter(d => !d.fired);
  const row = d => `<tr class="${d.fired ? 'pick' : ''}${d.locked ? ' locked' : ''}"><td class="pn">${esc(d.cat)}</td><td class="pn">${esc(d.driver)}${d.urgent ? ' <span class="chip bad" style="padding:0 5px;font-size:10px">Urgent</span>' : ''}${d.predicted ? ' <span class="chip agent" style="padding:0 5px;font-size:10px">Predicted</span>' : ''}</td><td class="rs">${esc(d.basis)}</td><td class="rs">${d.actions.map(x => `<b style="font-weight:600">${esc(x.text)}</b> <span class="muted">(${esc(x.option)})</span>`).join('<br>') || '—'}</td></tr>`;
  const pols = r.policies.map(pl => { const c = r.cands.find(x => x.policy === pl); return `<span class="chip ${c && c.drivers.length ? 'bad' : ''}">${esc(shortPolicy(pl))}${c && c.drivers.length ? ` · ${new Set(c.drivers).size} driver${new Set(c.drivers).size > 1 ? 's' : ''}` : ''}</span>`; }).join(' ');
  return `<p class="muted" style="font-size:12px;margin:-2px 0 8px">Inventory branch: <b>${t.stock0 ? 'distributor stock = 0' : 'distributor stock ≥ 1'}</b> (from the Inventory Rating). Each driver that fires picks an action; the plan combines them, urgent drivers and last-time buys first.</p>
    <div style="margin-bottom:8px">Result: ${pols}</div>
    <table class="rules tree"><thead><tr><th>Risk</th><th>Driver</th><th>Basis</th><th>Action</th></tr></thead><tbody>${fired.map(row).join('') || '<tr><td colspan="4" class="muted">No driver fired: the part stays on MRP.</td></tr>'}</tbody></table>
    ${quiet.some(d => d.locked) ? `<p class="lockcard" style="margin:8px 0 0">${quiet.filter(d => d.locked).length} drivers can't be checked without ${[...new Set(quiet.filter(d => d.locked).map(d => LAYER_NAME[d.locked]))].join(' and ')} data. Add the source from the Data bar at the top to unlock them.</p>` : ''}
    <details style="margin-top:8px"><summary class="muted" style="font-size:12px;cursor:pointer">${quiet.length} drivers checked, not fired</summary><table class="rules tree"><tbody>${quiet.map(row).join('')}</tbody></table></details>`;
}

function whyChart(r) {
  const W = 600, H = 190, L = 44, R = 10, T = 12, B = 26;
  const max = Math.max(...r.demand, ...r.supply) * 1.1;
  const x = i => L + (i + 0.5) * (W - L - R) / NWEEKS, bw = (W - L - R) / NWEEKS * 0.56;
  const y = v => T + (1 - v / max) * (H - T - B);
  const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const ticks = [0, max / 2, max].map(v => `<text class="ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${kfmt(v)}</text><line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const bars = r.supply.map((v, i) => `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y(v)).toFixed(1)}" fill="rgba(76,207,178,.45)" rx="2"/>`).join('');
  const shorts = r.short.map((s, i) => s > 0 ? `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(r.demand[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2, y(r.demand[i] - s) - y(r.demand[i])).toFixed(1)}" fill="var(--rec)" opacity=".85" rx="2"/>` : '').join('');
  const lbl = WEEKS.map((w, i) => i % (NWEEKS > 20 ? 4 : 2) === 0 ? `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${w.iso}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly demand and projected supply">${ticks}${bars}${shorts}<path d="${path(r.demand)}" fill="none" stroke="var(--demand)" stroke-width="2"/>${lbl}</svg>`;
}

function whyFallback(r) {

  if (se) for (const e of r.hits) sigs.push(`${e.title} (${(e.threat || '').toLowerCase()} threat) cuts supply about ${Math.round(e.impact * 100)}% in ${wkRange(e.from, e.from + e.weeks - 1)}`);

async function chat(text) {
