  setDock(true); userSay(text);
  const el = agentMsg(); CHAT.pending = el; const body = $('.body', el); body.innerHTML = '<p class="muted"><em>Thinking…</em></p>';
  CHAT.turns.push({ role: 'user', content: text });
  try {
    let reply;
    if (AI.live) {
      try { reply = await liveChat(body); }
      catch (e) { if (e && e.code === 'cancelled') throw e; reply = null; }
    }
    if (!reply) reply = await fallbackChat(text, body);
    body.innerHTML = mdToHtml(reply);

    </div>

    <div class="why-sec"><h4>Triggers</h4><div class="trig">${sp.triggers.map(t => `<div class="t"><div class="ty">${esc(TRIG_LABEL[t.type] || t.type)}</div><b>${esc(t.label)}</b><small>${esc(t.detail || '')}</small></div>`).join('')}</div></div>

    <div class="why-sec"><h4>Routing and approvals</h4><div class="routes">${sp.routing.map(r => { const k = roleKey(r.owner); return `<div class="route"><span class="av ${k}">${ROLES[k].initials}</span><div><b>${esc(r.recommendation)}</b>${r.approval ? `<div class="muted" style="font-size:12px">${esc(r.approval)}</div>` : ''}</div><div class="who">${esc(ROLES[k].name)}</div></div>`; }).join('')}</div></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${status === 'Draft' ? `<button class="btn primary" id="wf-act">Activate</button><button class="btn" id="wf-run">Run once now</button><button class="btn ghost" id="wf-disc">Discard</button>` : `<button class="btn" id="wf-run">Run now</button><button class="btn ghost" id="wf-pause">Pause</button>`}
    </div>

function roleKey(owner) { const o = String(owner || '').toLowerCase(); return o.includes('design') ? 'de' : o.includes('procure') || o.includes('buyer') ? 'buyer' : o.includes('demand') || o.includes('planner') ? 'dp' : 'scm'; }
function bindSpecCard() {
  const card = $('#wf-card'); if (!card) return;

  if ($('#wf-disc', card)) $('#wf-disc', card).onclick = () => { WF.draft = null; WF.run = null; VIEWS.workflows(); };

}
function nextRun(sp) { const t = sp.triggers.find(t => t.type === 'time'); return t ? (/week|monday/i.test(t.label + t.detail) ? 'Mon 06:00' : 'Tomorrow 06:00') : 'On trigger'; }

async function draftWorkflow(text, prior) {
  WF.busy = true; WF.text = text; WF.run = null;
  if (S.view === 'actions') VIEWS.workflows();
  let spec = null; WF.source = '';
  if (AI.live) {
    try {
      const prompt = `Convert a supply-planning user's instruction into a workflow configuration for essie, an AI planning assistant. Reply with only JSON matching this shape:
{"name": "≤6 words", "summary": "one sentence in plain English", "schedule": "e.g. Daily 06:00 or On event",
 "triggers": [{"type": "time|gap|event|market", "label": "short", "detail": "one line"}],
 "scope": {"label": "e.g. Critical parts (31)", "critical_only": bool, "sole_source_only": bool, "commodities": [keys from: ${Object.keys(COMMODITIES).join(', ')}]},
 "conditions": [{"type": "gap|resilience_drop|event|market|lifecycle|cross", "label": "short", "threshold": number or null}],
 "steps": {"sense": "...", "analyze": "...", "recommend": "...", "assign": "...", "act": "...", "reassess": "..."},
 "routing": [{"recommendation": "e.g. Find or validate crosses", "owner": "Design Engineer|Supply Chain Manager|Procurement / Buyer|Demand Planner", "approval": "string or null"}],
 "notify": ["short strings"]}
Steps are one short sentence each, specific to the instruction. Default routing: crosses/multi-source → Design Engineer; buffer, strategic buy, life-time buy → Supply Chain Manager; LTSA and open-market sourcing → Procurement / Buyer; forecast adjustments → Demand Planner.
Context: ${S.world.parts.length} parts, ${S.world.parts.filter(p => p.critical).length} flagged critical, ${S.world.parts.filter(p => p.sources === 1).length} sole-source.${prior ? '\nThe previous draft was: ' + JSON.stringify(prior) : ''}
Instruction: ${text}`;
      const j = await aiCall(prompt, { json: true, tier: 'quick', cache: false });
      if (j && j.name && Array.isArray(j.triggers) && j.steps) { spec = normalizeSpec(j); WF.source = 'Drafted by essie'; }
    } catch (e) { /* fall back */ }
  }
  if (!spec) { await sleep(900); spec = fallbackSpec(text); WF.source = AI.live ? 'Scripted draft (live AI unavailable)' : 'Scripted draft'; }
  WF.draft = spec; WF.busy = false;
  if (S.view === 'actions') VIEWS.workflows();
  return spec;
}
function normalizeSpec(j) {
  const scope = j.scope || {};
  return {
    name: String(j.name), summary: String(j.summary || ''), schedule: String(j.schedule || ''),
    triggers: (j.triggers || []).slice(0, 4).map(t => ({ type: String(t.type || 'time'), label: String(t.label || ''), detail: String(t.detail || '') })),
    scope: { label: String(scope.label || 'All parts'), critical_only: !!scope.critical_only, sole_source_only: !!scope.sole_source_only, commodities: Array.isArray(scope.commodities) ? scope.commodities.filter(c => COMMODITIES[c]) : [] },
    conditions: (j.conditions || []).slice(0, 6).map(c => ({ type: String(c.type || 'gap'), label: String(c.label || c.type), threshold: c.threshold ?? null })),
    steps: Object.fromEntries(STAGES.map(([k]) => [k, String((j.steps || {})[k] || '')])),
    routing: (j.routing || []).slice(0, 6).map(r => ({ recommendation: String(r.recommendation || ''), owner: String(r.owner || 'Supply Chain Manager'), approval: r.approval ? String(r.approval) : null })),
    notify: (j.notify || []).slice(0, 4).map(String),
  };
}

function fallbackSpec(text, forcedName) {
  const t = text.toLowerCase();
  const triggers = [], conditions = [];
  const daily = /every (morning|day|night)|daily|nightly/.test(t), weekly = /week|monday/.test(t), monthly = /month/.test(t);
  if (daily || weekly || monthly) triggers.push({ type: 'time', label: daily ? (/night/.test(t) ? 'Every night, 22:00' : 'Every morning, 06:00') : weekly ? 'Every Monday, 07:00' : 'First of the month', detail: 'Runs on a schedule in your time zone' });
  const num = (t.match(/(\d[\d,]*)\s*(boards|units)/) || [])[1];
  if (/gap|not meet|shortage|short|exceed/.test(t)) { triggers.push({ type: 'gap', label: num ? `Projected gap > ${num} boards` : 'Projected supply < demand', detail: `Evaluated weekly across the ${NWEEKS}-week horizon` }); conditions.push({ type: 'gap', label: num ? `Gap above ${num} boards in any week` : 'Projected supply below demand', threshold: num ? +num.replace(/,/g, '') : null }); }
  if (/event|geopolit|disruption|port|tariff|earthquake|region/.test(t)) { triggers.push({ type: 'event', label: 'Geopolitical or supply-chain event', detail: 'Matches events to part origin regions and suppliers' }); conditions.push({ type: 'event', label: 'Part made in an affected region', threshold: null }); }
  if (/market|price|lead time|open-market|availability/.test(t)) { const pct = (t.match(/(\d+)\s*%/) || [])[1]; triggers.push({ type: 'market', label: pct ? `Price or availability moves > ${pct}%` : 'Market constraint or rising prices', detail: 'Open-market and commodity intelligence' }); conditions.push({ type: 'market', label: 'Commodity constrained or tightening', threshold: pct ? +pct : null }); }
  if (/resilien|deteriorat/.test(t)) conditions.push({ type: 'resilience_drop', label: 'Resilience Rating is Poor', threshold: null });
  if (/pcn|lifecycle|ltb|end of life|eol/.test(t)) { triggers.push({ type: 'event', label: 'New PCN or lifecycle change', detail: 'Manufacturer notifications' }); conditions.push({ type: 'lifecycle', label: 'Part is LTB or obsolete', threshold: null }); }
  if (/cross|alternate/.test(t) && !/pcn/.test(t)) conditions.push({ type: 'cross', label: 'New pin-to-pin cross available', threshold: null });
  if (/refresh|re-score|all parts/.test(t)) { conditions.push({ type: 'market', label: 'Any recommendation change', threshold: null }); }
  if (!triggers.length) triggers.push({ type: 'time', label: 'Every morning, 06:00', detail: 'Default schedule' });
  if (!conditions.length) conditions.push({ type: 'gap', label: 'Projected supply below demand', threshold: null });
  const comm = findCommodities(t);
  const crit = /critical/.test(t), sole = /sole/.test(t);
  const n = S.world.parts.filter(p => (!crit || p.critical) && (!sole || p.sources === 1) && (!comm.length || comm.includes(p.commodity))).length;
  const scopeLabel = `${sole ? 'Sole-source' : crit ? 'Critical' : comm.length ? comm.map(c => COMMODITIES[c].name || c).join(' & ') : 'All'} parts (${n})`;
  const approvalAmt = (t.match(/\$\s?(\d+)\s?(k|m)?/) || []);
  const approval = /approv/.test(t) ? `Your approval required${approvalAmt[1] ? ` over $${approvalAmt[1]}${(approvalAmt[2] || '').toUpperCase()}` : ''}` : null;
  const routing = [
    { recommendation: 'Find or validate crosses', owner: 'Design Engineer', approval: null },
    { recommendation: 'Buffer · strategic buy · life-time buy', owner: 'Supply Chain Manager', approval: approval || 'Auto-approve under $25K' },
    { recommendation: 'LTSA · open-market sourcing', owner: 'Procurement / Buyer', approval: null },
    { recommendation: 'Market-adjusted forecast', owner: 'Demand Planner', approval: null },
  ];
  const trigWords = triggers.map(x => x.label.toLowerCase());
  const name = forcedName || (sole ? 'Sole-source exposure watch' : /market|price/.test(t) ? 'Market signal watch' : /gap|exceed/.test(t) && !daily ? 'Supply gap guardrail' : /event|geopolit/.test(t) ? 'Event impact watch' : crit ? 'Daily critical-parts watch' : 'Planning watch');
  return {
    name, schedule: triggers[0].type === 'time' ? triggers[0].label : 'On trigger',
    summary: `${cap(trigWords.join(', and on '))}, essie checks ${scopeLabel.toLowerCase()} for ${conditions.map(c => c.label.toLowerCase()).join(' or ')}, recommends a mitigation for each and routes it to the owning team.`,
    triggers, scope: { label: scopeLabel, critical_only: crit, sole_source_only: sole, commodities: comm }, conditions,
    steps: {
      sense: 'Pull demand and supply plans, market intelligence, events, PCNs and Resilience Ratings',
      analyze: `Project weekly balance for ${scopeLabel.toLowerCase()} and test each condition`,
      recommend: 'Score Plan for Every Part policies and the market-adjusted forecast; explain each',
      assign: 'Create actions for the default owner of each recommendation',
      act: approval ? approval + '; others proceed automatically' : 'Owners review, approve and execute; essie tracks status',
      reassess: 'Re-run each part when its actions close; alert if the gap persists',
    },
    routing, notify: [/alert|notify|brief|tell me/.test(t) ? 'Brief me in the essie panel' : 'Summary in the essie panel', 'Email digest to owners'],
  };
}

async function runWorkflow(sp) {
  WF.run = { name: sp.name, stage: 0, findings: null };
  const rerender = () => { const card = $('#wf-card'); if (card && S.view === 'actions') { card.innerHTML = specHtml(sp, WF.draft === sp ? 'Draft' : 'Active'); bindSpecCard(); } };
  for (let i = 0; i < 4; i++) { WF.run.stage = i; rerender(); await sleep(450); }
  const sc = sp.scope;
  const inScope = S.comp.results.filter(r => (!sc.critical_only || r.part.critical) && (!sc.sole_source_only || r.sources === 1) && (!sc.commodities || !sc.commodities.length || sc.commodities.includes(r.part.commodity)));
  const findings = [];
  for (const r of inScope) {
    const why = [];
    for (const c of sp.conditions) {
      if (c.type === 'gap' && r.shortUnits > 0 && (!c.threshold || r.shortUnits / r.part.qtyPer > c.threshold / 4)) why.push(`${fmt(r.shortUnits)} units short from ${WEEKS[r.firstShortWeek].label}`);
      if (c.type === 'resilience_drop' && r.part.rrGrade === 'Poor') why.push(`Resilience Rating ${r.part.rr} (Poor)`);
      if (c.type === 'event' && r.hits.length) why.push(r.hits[0].title);
      if (c.type === 'market' && (CONSTRAINED(r.mktStatus) || (/change/.test(c.label) && isChanged(r)))) why.push(/change/.test(c.label) ? (HAS_HISTORY ? 'recommendation changed' : 'new recommendation') : `price ${mstat(r.mkt).toLowerCase()}`);
      if (c.type === 'lifecycle' && r.ltb) why.push(`${r.part.lifecycle}${r.part.pcn ? ' · ' + r.part.pcn.id : ''}`);
      if (c.type === 'cross' && r.part.crossNew) why.push('new pin-to-pin cross');
    }
    if (why.length && (r.primary !== 'MRP' || r.adjDir)) findings.push({ id: r.part.id, mpn: r.part.mpn, reason: [...new Set(why)].slice(0, 2).join(' · '), rec: [r.adjDir ? (r.adjDir === 'pull' ? 'Pull' : 'Push') : null, ...r.policies.map(shortPolicy)].filter(Boolean).join(' + '), r });
  }
  findings.sort((a, b) => priority(b.r) - priority(a.r));
  let created = 0, parts = 0;
  for (const f of findings) { const c = acceptRec(f.id, 'Workflow'); if (c.length) { created += c.length; parts++; } }
  WF.run.stage = 6; WF.run.findings = findings;
  WF.run.text = findings.length ? `Checked ${inScope.length} parts; ${findings.length} met the conditions. ${created ? `Created ${created} actions for ${parts} parts that had no owner yet.` : 'All of them already have owners, so no new actions were needed.'} I'll reassess each part as its actions close.` : `Checked ${inScope.length} parts. None met the conditions today.`;
  const w = S.workflows.find(x => x.spec === sp); if (w) w.last = `Just now · ${findings.length} matched, ${created} actions`;
  logActivity('ai', `Workflow <b>${esc(sp.name)}</b> ran: ${findings.length} parts matched, ${created} actions created.`);
  updateBadges(); S.dirty.plan = S.dirty.actions = S.dirty.horizon = true;
  rerender();
  agentSay(`**${sp.name}** ran. ${WF.run.text}`, created ? [{ label: 'Open actions', fn: () => setView('actions', { resTab: 'actions' }) }] : []);
}

// ───────────────────────── Scenarios: executive briefing + simulator ─────────────────────────
// A news-style view of the supply chain for a CEO: headline, ticker, scoreboard, a plain-language
// story, and a simulator whose levers (increase supply, bypass disruptions, stress tests) update
// the numbers and the story together.
const REGIONS = () => [...new Set(S.world.parts.flatMap(p => p.countries))].filter(Boolean).sort();
const GROSS_MARGIN = PRODUCT.margin, CARRY_RATE = 0.25, EXPEDITE_PREMIUM = 0.3, AIR_PER_WEEK = 22000, QUAL_PER_PART = 12000;
const PRESETS = [
  { group: 'play', label: 'Fastest OTD recovery', scp: { approveAI: true } },
  { group: 'play', label: 'Low-cost fix', scp: { airFreight: true, crossQualified: true } },
  { group: 'play', label: 'Max supply push', scp: { boost: { commodity: 'all', pct: 25 }, bufferWeeks: 2 } },
  ...(COMMODITIES.DRAM ? [{ group: 'stress', label: 'DRAM allocation cut 40%', scp: { shock: { commodity: 'DRAM', ltDelta: 6, supplyImpact: 0.4, from: 2, weeks: 14 } } }] : []),
  { group: 'stress', label: 'China–Taiwan escalation: Taiwan −50% for 8 wks', scp: { region: { region: 'Taiwan', impact: 0.5, from: 1, weeks: 8 } } },
  { group: 'stress', label: 'Program win: demand +20%', scp: { demandPct: 20 } },
  ...(COMMODITIES.CCM ? [{ group: 'stress', label: 'MLCC constraint lasts 6 months', scp: { shock: { commodity: 'CCM', ltDelta: 8, supplyImpact: 0.3, from: 4, weeks: 26 } } }] : []),
];
// The physical disruption that air freight can route around: the event with supply impact touching the most parts

const VAL_METRICS = {

function valueSteps(key) {

  const erp = v.erp[key];
  const st = [];
  if (key === 'resolved') st.push({ kind: 'total', label: 'ERP data only', v: erp, note: `MRP sees ${v.erp.caught} of ${v.atRisk} at-risk parts and protects ${erp}` });

function waterfallSvg(key) {
  const M = VAL_METRICS[key], st = valueSteps(key);
  const W = 1200, H = 270, L = 8, R = 8, T = 28, B = 48;
  let run = 0; const bars = st.map(s => { let y0, y1; if (s.kind === 'delta') { y0 = run; y1 = run + s.v; run = y1; } else { y0 = 0; y1 = s.v; run = s.v; } return { ...s, y0, y1 }; });
  const vals = bars.flatMap(b => [b.y0, b.y1]); let lo = Math.min(0, ...vals), hi = Math.max(...vals);
  if (key === 'otd') { lo = Math.max(0, Math.floor((Math.min(...vals) - 8) / 10) * 10); hi = 100; }
  const y = v => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
  const n = bars.length, slot = (W - L - R) / n, bw = Math.min(110, slot * 0.56);
  const x = i => L + slot * i + (slot - bw) / 2;
  const tone = b => b.kind !== 'delta' ? 'var(--soft)' : b.src === 'risk' ? 'var(--rec)' : M.good === 0 ? (b.v > 0 ? 'var(--warn)' : 'var(--good)') : (b.v * M.good > 0 ? 'var(--good)' : b.v === 0 ? 'var(--faint)' : 'var(--rec)');
  let g = `<line x1="${L}" x2="${W - R}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line2)"/>`;
  bars.forEach((b, i) => {
    const top = Math.min(y(b.y0), y(b.y1)), h = Math.max(2, Math.abs(y(b.y1) - y(b.y0)));
    const off = b.kind === 'delta' && b.src !== 'risk' && b.src !== 'erp' && !b.on;
    g += `<g class="wf-bar" tabindex="0"><title>${esc(b.label)}: ${b.kind === 'delta' ? M.dfmt(b.v) : M.fmt(b.v)}. ${esc(b.note || '')}${off ? ' (not connected: switch it on in the Data bar)' : ''}</title>
      <rect x="${x(i).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${tone(b)}" ${b.kind === 'delta' ? 'fill-opacity=".9"' : 'fill-opacity=".35"'} ${off ? 'stroke="var(--agent)" stroke-dasharray="4 3" fill-opacity=".25"' : ''}/>
      <text class="wf-v" x="${(x(i) + bw / 2).toFixed(1)}" y="${(top - 7).toFixed(1)}" text-anchor="middle">${b.kind === 'delta' ? M.dfmt(b.v) : M.fmt(b.v)}</text>
      <text class="wf-l" x="${(x(i) + bw / 2).toFixed(1)}" y="${H - B + 16}" text-anchor="middle">${esc(b.label.split(' ')[0])}</text>
      <text class="wf-l" x="${(x(i) + bw / 2).toFixed(1)}" y="${H - B + 30}" text-anchor="middle">${esc(b.label.split(' ').slice(1).join(' '))}</text></g>`;
    if (i < n - 1) { const yy = y(b.y1); g += `<line x1="${(x(i) + bw).toFixed(1)}" x2="${x(i + 1).toFixed(1)}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--line2)" stroke-dasharray="3 3"/>`; }
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(M.label)} waterfall by data source">${g}</svg>`;
}

// ── Part count (by country of origin) and supplier count (by manufacturing site location)
const CAT_VARS = ['--c1', '--c2', '--c3', '--c4', '--c5'];
function breakdown(map, total, n = 5) {
  const rows = Object.entries(map).sort((a, b) => b[1] - a[1]);
  const top = rows.slice(0, n), other = rows.slice(n).reduce((t, r) => t + r[1], 0);
  if (other) top.push(['Other', other]);
  return top.map(([k, v], i) => ({ k, v, pct: v / total, col: k === 'Other' ? 'var(--faint)' : `var(${CAT_VARS[i]})` }));
}
function stackBar(items, unit, f = v => String(v)) {
  return `<div class="stk" role="img" aria-label="${esc(items.map(x => `${x.k} ${f(x.v)} ${unit}`).join(', '))}">${items.map(x => `<i style="width:${(x.pct * 100).toFixed(2)}%;background:${x.col}" title="${esc(x.k)}: ${f(x.v)} ${unit} (${Math.round(x.pct * 100)}%)"></i>`).join('')}</div>
    <ul class="stk-lg">${items.map(x => `<li title="${esc(x.k)}: ${f(x.v)} ${unit} (${Math.round(x.pct * 100)}%)"><i style="background:${x.col}"></i><span>${esc(x.k)}</span><b>${f(x.v)}</b></li>`).join('')}</ul>`;
}
function partCountTile() {
  const parts = S.world.parts, by = {};
  for (const p of parts) { const c = (p.origin && p.origin[0]) || p.region || 'Unknown'; by[c] = (by[c] || 0) + 1; }
  return `<div class="sc-tile mix"><div class="eyebrow">Part count</div><div class="v">${parts.length}</div><div class="s">By country of origin</div>${stackBar(breakdown(by, parts.length), 'parts')}</div>`;
}
function supplierTile() {
  const sup = {}; for (const p of S.world.parts) { (sup[p.mfr] = sup[p.mfr] || new Set()); for (const c of Object.values(p.sites || {})) if (c) sup[p.mfr].add(c); }
  const n = Object.keys(sup).length, by = {};
  // each supplier counted once, at its main manufacturing location (most of its sites)
  for (const [m, set] of Object.entries(sup)) {
    const cnt = {}; for (const p of S.world.parts.filter(x => x.mfr === m)) for (const c of Object.values(p.sites || {})) if (c) cnt[c] = (cnt[c] || 0) + 1;
    const main = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]; const k = main ? main[0] : 'Not provided'; by[k] = (by[k] || 0) + 1; void set;
  }
  return `<div class="sc-tile mix"><div class="eyebrow">Supplier count</div><div class="v">${n}</div><div class="s">By main manufacturing site location</div>${stackBar(breakdown(by, n), 'suppliers')}</div>`;
}

// ── Total demand by quarter, supply by supplier, inventory by commodity
function demandTile(m) {
  const plan = S.comp.ctb.plan, by = {};
  WEEKS.forEach((w, i) => { const d = new Date(WEEK0.getTime() + i * 7 * 864e5); const q = `Q${Math.floor(d.getUTCMonth() / 3) + 1} '${String(d.getUTCFullYear()).slice(2)}`; by[q] = (by[q] || 0) + plan[i] * PRODUCT.asp; });
  const tot = Object.values(by).reduce((a, b) => a + b, 0);

  return `<div class="sc-tile mix"><div class="eyebrow">Total demand</div><div class="v">${money(m.plan * PRODUCT.asp)}</div><div class="s">${S.comp.results.length} parts · by quarter</div>${stackBar(items, 'of demand', money)}</div>`;

      , tile('Parts short', short.length, `First gap ${m.firstShort >= 0 ? WEEKS[m.firstShort].label : '—'}`, short.length ? 'red' : '')

// ───────────────────────── P&L: the plan in profit-and-loss terms ─────────────────────────
// Three views of the same 52-week plan: what the ERP plan shows, the risk-adjusted outcome before any
// action, and the outcome with essie's plan (using the data sources connected). Revenue is what ships
// on time; cost of goods follows the product margin from the workbook; essie's plan adds the cost of
// carrying extra inventory and the open-market premium.
S.pnlA = S.pnlA || { carry: 20, omPrem: 25 };
function pnlFor(comp, opts = {}) {
  const ctb = comp.ctb, unitCost = PRODUCT.asp * (1 - (PRODUCT.margin ?? 0.45));
  const planRev = ctb.plan.reduce((a, b) => a + b, 0) * PRODUCT.asp, shipRev = ctb.built.reduce((a, b) => a + b, 0) * PRODUCT.asp;
  const cogs = ctb.built.reduce((a, b) => a + b, 0) * unitCost;
  const inv = comp.results.reduce((t, r) => t + r.startInv * r.part.price, 0);
  let carry = 0, om = 0;
  if (opts.mitig) {
    carry = Math.max(0, inv - opts.baseInv) * S.pnlA.carry / 100 * NWEEKS / 52;
    for (const p of comp.world.parts) if (p.applied && p.applied.openMarket) om += avgOf(p.demand) * (p.applied.omWks || 2) * p.price * S.pnlA.omPrem / 100;
  }
  const gp = shipRev - cogs, net = gp - carry - om;
  return { planRev, rar: planRev - shipRev, shipRev, cogs, gp, carry, om, net, inv, gm: shipRev ? gp / shipRev : 0, nm: shipRev ? net / shipRev : 0 };
}
function pnlQuarters(comp) {
  const by = {}; const unitCost = PRODUCT.asp * (1 - (PRODUCT.margin ?? 0.45));
  WEEKS.forEach((w, i) => { const d = new Date(WEEK0.getTime() + i * 7 * 864e5); const q = `Q${Math.floor(d.getUTCMonth() / 3) + 1} '${String(d.getUTCFullYear()).slice(2)}`; const o = by[q] = by[q] || { plan: 0, ship: 0, gp: 0 }; o.plan += comp.ctb.plan[i] * PRODUCT.asp; o.ship += comp.ctb.built[i] * PRODUCT.asp; o.gp += comp.ctb.built[i] * (PRODUCT.asp - unitCost); });
  return by;
}
VIEWS.pnl = function () {
  if (!S.scenario) runScenario(blankScp(), false);
  const m = metrics(S.comp);
  $('#v-pnl').innerHTML = `<div class="pnl-plan"><div class="eyebrow">The plan · ${esc(PRODUCT.name)}</div><div class="score" id="pnl-score">${demandTile(m)}${supplyTile(m)}${inventoryTile(m)}${partCountTile()}${supplierTile()}</div></div>${simMarkup()}<div id="pnl-body"></div>`;
  bindSim(); updateSim(); renderPnl();
};
// The P&L follows the demand simulator: with demand added, every column uses the simulated plan
function pnlBasis() {
  const sim = S.scenario && (S.scenario.scp.demandPct || 0) > 0;
  return sim ? { sim: true, pct: Math.round(S.scenario.scp.demandPct), world: S.scenario.world, comp: S.scenario.comp, ai: S.scenario.ai } : { sim: false, world: S.world, comp: S.comp, ai: S.ai };
}
let PNL_TODAY = null;
function pnlToday() {
  if (PNL_TODAY && PNL_TODAY.comp === S.comp && PNL_TODAY.ai === S.ai && PNL_TODAY.a === JSON.stringify(S.pnlA)) return PNL_TODAY.v;
  const R = pnlFor(S.comp), A = pnlFor(S.ai, { mitig: true, baseInv: R.inv });
  PNL_TODAY = { comp: S.comp, ai: S.ai, a: JSON.stringify(S.pnlA), v: { R, A } }; return PNL_TODAY.v;
}
function renderPnl() {
  const el = $('#pnl-body'); if (!el) return;
  const B = pnlBasis();
  const pvW = clone(B.world); pvW.planView = true; const pv = compute(pvW);
  const E = pnlFor(pv), R = pnlFor(B.comp), A = pnlFor(B.ai, { mitig: true, baseInv: R.inv });
  const T = B.sim ? pnlToday() : null;
  const vsT = (now, then) => { if (!T) return ''; const d = now - then; return ` · <span class="${d >= 0 ? 'good' : 'red'}">${d >= 0 ? '+' : '−'}${money(Math.abs(d))} vs. today</span>`; };
  const on = ADDERS.filter(k => S.layers[k]);
  const neg = v => v ? `(${money(Math.abs(v))})` : '—';
  const pct = v => `${(v * 100).toFixed(1)}%`;
  const dl = (a, b, good = 1) => { const d = a - b; if (Math.abs(d) < 1) return '<span class="muted">—</span>'; return `<span class="${d * good > 0 ? 'good' : 'red'}">${d > 0 ? '+' : '−'}${money(Math.abs(d))}</span>`; };
  const row = (label, e, r, a, f, cls = '', sub = '', good = 1, delta = true) => `<tr class="${cls}"><td class="l">${label}${sub ? `<div class="muted" style="font-size:11px">${sub}</div>` : ''}</td><td class="v">${f(e)}</td><td class="v">${f(r)}</td><td class="v ai">${f(a)}</td><td class="v">${delta ? dl(a, r, good) : ''}</td></tr>`;
  const recovered = A.net - R.net, cost = A.carry + A.om, invAdd = A.inv - R.inv;
  const Q = [pnlQuarters(pv), pnlQuarters(B.comp), pnlQuarters(B.ai)], qs = Object.keys(Q[0]);

        <h2 class="pnl-h">essie's plan protects <span class="good">${money(Math.max(0, recovered))}</span> of gross profit, net of ${money(cost)} in mitigation cost</h2>
        <p class="muted" style="margin:4px 0 0">Risk-adjusted, ${money(R.rar)} of planned revenue cannot ship on time. ${on.length ? `Using ${on.map(k => ADDER_LABEL[k]).join(', ')}` : 'Using the Raw Plan only'}, essie's plan recovers ${money(A.shipRev - R.shipRev)} of it for ${money(Math.max(0, invAdd))} of added inventory.</p></div>
    </div>
    <div class="pnl-kpis">
      <div class="sc-tile"><div class="eyebrow">Revenue shipped on time</div><div class="v">${money(A.shipRev)}</div><div class="s">${money(R.shipRev)} without action · plan ${money(E.planRev)}${vsT(A.shipRev, T && T.A.shipRev)}</div></div>
      <div class="sc-tile"><div class="eyebrow">Gross profit</div><div class="v">${money(A.net)}</div><div class="s">${money(R.gp)} without action · ${pct(A.nm)} margin${vsT(A.net, T && T.A.net)}</div></div>
      <div class="sc-tile"><div class="eyebrow">Mitigation cost</div><div class="v">${money(cost)}</div><div class="s">Carrying cost ${money(A.carry)} · open-market premium ${money(A.om)}${T ? ` · today ${money(T.A.carry + T.A.om)}` : ''}</div></div>
      <div class="sc-tile"><div class="eyebrow">Working capital</div><div class="v">${invAdd >= 0 ? '+' : '−'}${money(Math.abs(invAdd))}</div><div class="s">Inventory ${money(R.inv)} → ${money(A.inv)}${T ? ` · today ${money(T.A.inv)}` : ''}</div></div>

        <tbody>

          ${row('Risk to Plan', -E.rar, -R.rar, -A.rar, neg, '', 'Revenue that cannot ship on time')}
          ${row('Revenue shipped on time', E.shipRev, R.shipRev, A.shipRev, money, 'sub')}
          ${row('Cost of goods sold', -E.cogs, -R.cogs, -A.cogs, neg, '', `${pct(1 - (PRODUCT.margin ?? 0.45))} of revenue (product margin ${pct(PRODUCT.margin ?? 0.45)})`)}
          ${row('Gross profit before mitigation', E.gp, R.gp, A.gp, money, 'sub')}

          <tr class="memo"><td class="l">Memo: inventory (working capital)</td><td class="v">${money(E.inv)}</td><td class="v">${money(R.inv)}</td><td class="v ai">${money(A.inv)}</td><td class="v">${dl(A.inv, R.inv, -1)}</td></tr>
        </tbody></table></div>
    </div>
    <div class="pnl-two">
      <div class="card pnl-card"><div class="eyebrow">Gross profit by quarter</div>
        <div class="pnl-q">${qs.map(q => `<div class="pq"><div class="pq-bars">${['erp', 'risk', 'ai'].map((k, i) => `<i class="${k}" style="height:${(Q[i][q].gp / qmax * 100).toFixed(1)}%" title="${q} · ${['Raw Plan', 'Risk-adjusted', "With essie's plan"][i]}: ${money(Q[i][q].gp)}"></i>`).join('')}</div><b>${q}</b><small class="ai" title="With essie's plan">${money(Q[2][q].gp)}</small><small class="red" title="Risk-adjusted, no action">${money(Q[1][q].gp)}</small></div>`).join('')}</div>
        <div class="wf-legend" style="margin-top:8px"><span><i style="background:var(--faint)"></i>Raw Plan</span><span><i style="background:var(--rec)"></i>Risk-adjusted</span><span><i style="background:var(--agent)"></i>With essie's plan</span></div></div>
      <div class="card pnl-card"><div class="eyebrow">Assumptions</div>
        <label class="pnl-in">Inventory carrying cost <span><input type="number" id="pa-carry" min="0" max="60" step="1" value="${S.pnlA.carry}">% a year</span></label>

    </div>`;
  const upd = () => { S.pnlA.carry = Math.max(0, +$('#pa-carry').value || 0); S.pnlA.omPrem = Math.max(0, +$('#pa-om').value || 0); renderPnl(); };

  $$('[data-crep]', d).forEach(b => b.onclick = () => openCustomers({ replace: b.dataset.crep }));
  $$('[data-cren]', d).forEach(b => b.onclick = async () => { const t = L.find(x => x.id === b.dataset.cren); const n = prompt('New name for this customer', t.name); if (!n || !n.trim()) return; try { await TENANT.rename(t.id, n.trim()); if (t.id === act) location.reload(); else openCustomers(); } catch (e) { toast(esc(e.message || 'Rename failed')); } });
  $$('[data-cdel]', d).forEach(b => b.onclick = async () => { const t = L.find(x => x.id === b.dataset.cdel); if (!confirm(`Delete ${t.name} and its data? This cannot be undone.`)) return; try { await TENANT.remove(t.id); if (t.id === act) TENANT.open('demo'); else openCustomers(); } catch (e) { toast(esc(e.message || 'Delete failed')); } });
  $('#c-tpl', d).onclick = downloadTemplate;
  if (!TENANT.canUpload) $('.c-where', d).insertAdjacentHTML('beforeend', ' Ask an administrator for upload access to add customers.');
  $('#c-file', d).onchange = async e => {
    const f = e.target.files[0]; const box = $('#c-prev', d); if (!f) return;
    box.innerHTML = '<p class="muted">Reading the workbook…</p>';
    try {
      const data = importWorkbook(new Uint8Array(await f.arrayBuffer()));
      const nm = $('#c-name', d);
      if (!nm.value.trim()) nm.value = data.product.name ? `${data.product.name} customer` : f.name.replace(/\.xlsx$/i, '');
      const mk = Object.values(data.commodities).filter(c => c.status).length;
      box.innerHTML = `<div class="c-sum"><div><b>${esc(data.product.name)}</b> · ${data.parts.length} parts · ${data.horizon} weeks from ${esc(data.start)} · ${Object.keys(data.commodities).length} commodities (${mk} with price status) · ${data.events.length} events</div>
        ${data.notes.length ? `<details><summary>${data.notes.length} import note${data.notes.length === 1 ? '' : 's'}</summary><ul>${data.notes.slice(0, 30).map(n => `<li>${esc(n)}</li>`).join('')}</ul></details>` : '<div class="good">No import issues.</div>'}
        <div class="c-go"><button class="btn primary" id="c-save">${opts.replace ? 'Replace data and open' : 'Save customer and open'}</button><span class="muted">${TENANT.hosted ? 'Uploads to your server.' : 'Saved in this browser.'}</span></div></div>`;
      $('#c-save', d).onclick = async () => {
        const name = (opts.replace ? (L.find(t => t.id === opts.replace) || {}).name : nm.value.trim()) || 'Customer';
        const btn = $('#c-save', d); btn.disabled = true; btn.textContent = 'Saving…';
        try { const id = await TENANT.save({ id: opts.replace || null, name, data, file: f.name }); TENANT.open(id); }
        catch (err) { btn.disabled = false; btn.textContent = 'Try again'; toast(esc(err.message || 'Could not save')); }
      };
    } catch (err) { box.innerHTML = `<p class="red">${esc(err.message || 'This file could not be read.')}</p>`; }
  };
  setTimeout(() => (opts.replace ? $('#c-file', d) : $('[data-copen]', d) || $('#c-name', d))?.focus(), 30);
}
async function downloadTemplate() {
  if (typeof TEMPLATE_XLSX === 'undefined') { toast('The template is not bundled in this build.'); return; }
  const bin = atob(TEMPLATE_XLSX), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  // Inside claude.ai the page offers the file through the downloads capability; elsewhere a normal download
  const dl = !TENANT.hosted && window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) { try { await dl.save({ filename: 'Intelligent-Planning-data-template.xlsx', data: u8 }); } catch (e) { if (e && e.code !== 'declined') toast('The template could not be saved here.'); } return; }
  const url = URL.createObjectURL(new Blob([u8], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const a = document.createElement('a'); a.href = url; a.download = 'Intelligent-Planning-data-template.xlsx'; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

  S.world = makeWorld(); S.world.layers = S.layers;

  S.lastWeek = compute(prevWorld(S.world));
  S.comp = compute(S.world);
  S.ai = compute(withAllApplied(S.world, S.comp));
  S.startRisk = S.comp.ctb.revenueAtRisk;
  seedHistory(); seedWorkflows();
  initShell();
  try { initCustomers(); } catch (e) { console.warn('customers', e); }
  updateBadges();
  setView('scenarios');
  initAI();
  briefing();
})();
